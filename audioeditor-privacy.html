tr:{dir:'ltr',title:'Gizlilik Politikası',footer:'© 2026 EditBook-AudioEditor · Mr. Xie',blocks:[
['meta',[['Ürün: ','EditBook-AudioEditor'],['Son güncelleme: ','1 Kasım 2026'],['Yürürlük tarihi: ','1 Kasım 2026']]],
['p','EditBook-AudioEditor (“Uygulama”) Mr. Xie (“biz”) tarafından sunulmaktadır. Kişisel bilgilerinizin önemini anlıyor ve onları korumak için çalışıyoruz. Bu politika, EditBook-AudioEditor mobil uygulaması (Android/iOS) ve ilgili hizmetler için geçerlidir. Bilgilerinizi nasıl topladığımızı, kullandığımızı, sakladığımızı, paylaştığımızı ve koruduğumuzu ve haklarınızı nasıl kullanabileceğinizi açıklar.'],
['notice',['**Önemli:**','Uygulama **hesap gerektirmez**. Telefon numaranızı, adınızı veya diğer kayıt bilgilerinizi istemiyoruz. Lütfen Uygulamayı kullanmadan önce bu politikayı okuyun; ilk açılışta politikayı (örneğin bir açılır pencerede) gösterip onayınızı isteyeceğiz. Kabul etmiyorsanız lütfen Uygulamayı kullanmayın.']],
['p','Bu politikayla ilgili soru, görüş veya şikâyetleriniz için xieh6888@gmail.com adresinden bize ulaşın.'],
['h','1. Hangi bilgileri topluyoruz'],
['p','Hukuka uygunluk, adalet, gereklilik ve dürüstlük ilkelerine uyarız ve yalnızca Uygulamanın işlevlerini sunmak için gerekli bilgileri toplarız.'],
['h3','1.1 Seçtiğiniz veya kaydettiğiniz sesler'],
['p','Uygulama bir ses düzenleyicidir. İçe aktardığınız ses dosyaları, mikrofonla kaydettiğiniz sesler, düzenlemeleriniz ve dışa aktarılan sonuçlar **varsayılan olarak cihazınızda yerel olarak işlenir**. Ses içeriğinizi kendi inisiyatifimizle sunucularımıza yüklemeyiz.'],
['p','Yalnızca “paylaş/başka bir uygulamaya aktar” gibi işlevleri kullandığınızda, dosya cihazınızın sistem paylaşım işlevi aracılığıyla seçtiğiniz uygulamaya aktarılır. Lütfen o uygulamanın veri uygulamalarını inceleyin.'],
['p','Medya dosyalarına yalnızca siz seçtiğinizde erişiriz, **cihazınızdaki diğer dosyaları taramayız** ve mikrofon izni **yalnızca kayıt işlevine dokunduğunuzda istenir ve kullanılır**.'],
['h3','1.2 Cihaz bilgileri, günlükler ve kullanım istatistikleri'],
['p','Uygulamanın çalışması, analiz, sorun giderme ve reklam gösterimi için biz ve üçüncü taraf SDK’ları aşağıdakileri toplayabiliriz:'],
['ul',['Cihaz modeli, işletim sistemi sürümü, uygulama sürümü, dil ve bölge ayarları;','Ağ türü ve durumu, IP adresi;','Android Advertising ID, OAID, IDFA (izin verirseniz) ve Android ID gibi cihaz tanımlayıcıları (her SDK’nın gerçekte topladığına bağlı olarak);','Uygulama başlatma, sayfa/işlev kullanımı ve tıklama istatistikleri;','Reklam gösterim, tıklama ve dönüşüm verileri;','Çökme günlükleri, hata yığınları ve performans verileri.']],
['h3','1.3 Abonelik ve satın alma bilgileri'],
['p','**Google Play veya Apple App Store** üzerinden abone olursanız ödeme ve sipariş işlemleri mağaza tarafından yürütülür. **Kart numaranızı, ödeme şifrenizi veya benzeri ödeme verilerinizi doğrudan toplamayız**.'],
['p','Hakları doğrulamak, satın alımları geri yüklemek ve para iadesi taleplerini işlemek için gerekli bilgileri mağazadan alabiliriz; bunlar şunları içerir:'],
['ul',['Ürün kimliği, abonelik durumu, satın alma ve bitiş zamanı;','Sipariş/işlem tanımlayıcıları, bölge;','**Apple, aboneliği tanımlamak, içerik sunmak ve para iadesi taleplerine yardımcı olmak için geliştiricilere abone kimliği ve satın alma geçmişi sağlayabilir**;','**Google Play Faturalandırma** aboneliğin geçerliliğini doğrulamak için satın alma geçmişini (satın alma durumu, işlem tanımlayıcıları vb.) sağlayabilir.']],
['p','Para iadeleri ve ödeme anlaşmazlıkları için lütfen önce Google Play veya Apple’ın resmî kanallarını kullanın.'],
['h3','1.4 Reklam bilgileri'],
['p','Uygulama, reklam göstermek için **Google AdMob (Google Mobile Ads SDK)** kullanır. Google’ın SDK’nın veri toplama uygulamalarına ilişkin kamuya açık açıklamasına göre SDK, reklam sunumu, sıklık sınırlaması, sahtekârlık önleme, ölçüm ve SDK performansı için aşağıdakileri toplayabilir:'],
['ul',['**IP adresi** (cihazın yaklaşık konumunu tahmin etmek için kullanılabilir);','**Cihaz kimlikleri**, reklam tanımlayıcıları (Android Advertising ID / iOS IDFA; IDFA, iOS ATT’ye tabidir) veya uygulama/geliştirici kapsamındaki diğer tanımlayıcılar dâhil;','**Reklam verileri**, örneğin gördüğünüz reklamlar;','**Kullanıcı etkileşimleri**, örneğin uygulama açılış dokunuşları ve video görüntülemeleri;','**Sizinle ilişkilendirilmeyen çökme günlükleri, tanılama ve performans verileri**.']],
['p','AdMob bu verileri üçüncü taraf reklam ve analiz amaçlarıyla kullanabilir ve aktarım sırasında şifreler. Yasanın gerektirdiği durumlarda (ör. AEA, Birleşik Krallık, İsviçre) onay yönetimi penceresi aracılığıyla onayınızı alırız. Android reklam ayarlarından veya iOS “İzleme” ayarlarından reklam izlemeyi sınırlayabilir, reklam tanımlayıcınızı sıfırlayabilir veya kişiselleştirilmiş reklamları kapatabilirsiniz; kapattıktan sonra kişiselleştirilmemiş reklamlar görmeye devam edebilirsiniz.'],
['h3','1.5 Bize e-postayla gönderdiğiniz bilgiler'],
['p','Bize e-posta gönderirseniz, sağladığınız adresi, mesaj içeriğini ve ekleri yalnızca talebinizi yanıtlamak ve çözmek için işleriz.'],
['notice',['**Kişi listesi, SMS, kesin konum, biyometrik veya sağlık verileri gibi hassas kişisel bilgileri kendi inisiyatifimizle toplamayız.** Bu durum değişirse sizi bilgilendirir ve yasanın gerektirdiği şekilde onayınızı alırız.']],
['h','2. Uygulama izinleri'],
['p','İzinleri yalnızca belirli bir işlev gerektirdiğinde isteriz. Bunları istediğiniz zaman sistem ayarlarından reddedebilir veya geri çekebilirsiniz; zorunlu olmayan izinleri reddetmek diğer işlevleri etkilemez.'],

['p','Uygulama güncellemeleriyle üçüncü taraf SDK’larını değiştirebiliriz ve sizi uygulama içi üçüncü taraf paylaşım listesi veya politika güncellemeleri aracılığıyla bilgilendiririz.'],
['h','4. Bilgileri nasıl kullanıyoruz'],
['ol',['Temel işlevleri sunmak: ses içe aktarma, **kayıt**, düzenleme, dışa aktarma ve paylaşma;','Abonelik haklarını doğrulamak, satın alımları geri yüklemek ve abonelik durumunu göstermek;','Google AdMob aracılığıyla reklam göstermek, sıklığı sınırlamak, reklam performansını ölçmek ve sahtekârlığı önlemek;','Kullanımı analiz ederek işlevleri ve deneyimi geliştirmek;','Çökmeleri izlemek, sorunları gidermek ve Uygulamanın kararlılığını ve güvenliğini sağlamak;','Sorularınızı, şikâyetlerinizi ve hak taleplerinizi yanıtlamak;','Yasalara ve düzenleyici gerekliliklere uymak.']],
['p','Ses içeriğinizi (kayıtlar dâhil) reklam hedeflemesi için kullanmayız ve üçüncü taraflara satmayız.'],
['h','5. Saklama'],
['h3','5.1 Yöntem ve saklama süresi'],
['p','Ses dosyalarınız ve düzenleme verileriniz varsayılan olarak cihazınızda yerel olarak saklanır ve **kayıtlar da yerel projelerde kalır ve sunucularımıza yüklenmez**. Biz ve üçüncü taraf SDK’ları bilgileri yalnızca yukarıdaki amaçlar için gerekli olduğu sürece saklarız; yasa veya anlaşmazlık yönetimi/güvenlik denetimi gerekliliği daha uzun bir süre gerektirmedikçe. Bu süreden sonra bilgileri siler veya anonimleştiririz.'],
['h3','5.2 Saklama yeri ve sınır ötesi aktarımlar'],
['p','Bilgileri ağırlıklı olarak Çin’de saklar ve işleriz. Bazı üçüncü taraf hizmetleri (**Google AdMob, Google Play ve Apple App Store** gibi) verileri yurt dışında işleyebilir. Sınır ötesi aktarım olması hâlinde yasanın gerektirdiği bilgilendirme, onay alma, güvenlik değerlendirmesi veya standart sözleşme yükümlülüklerini yerine getirir ve alıcılardan uygun koruma önlemleri almalarını isteriz.'],
['h3','5.3 Ürünün faaliyetinin sona ermesi'],
['p','Uygulama faaliyetini sona erdirirse sizi uygulama içi duyuru veya anlık bildirim yoluyla bilgilendirir ve kişisel bilgilerinizi makul bir süre içinde siler veya anonimleştiririz; yasada aksi öngörülmedikçe.'],
['h','6. Paylaşma, aktarma ve açıklama'],
['p','Kişisel bilgilerinizi satmayız. Aşağıdaki durumlar dışında bunları kendi inisiyatifimizle paylaşmayız veya aktarmayız:'],
['ol',['**Reklam (Google AdMob), analiz (Umeng), çökme izleme (Bugly) ve abonelik doğrulama (Google Play / Apple)** işlevlerini sunmak için gerekli bilgileri ilgili SDK’lar/sağlayıcılarla paylaşırız;','Yasa veya yargı ya da idari makamlar tarafından zorunlu olarak talep edildiğinde;','Onayınızı almanın güç olduğu durumlarda sizin veya başkalarının hayatını, mal varlığını ya da diğer önemli meşru menfaatlerini korumak için;','Kendinizin kamuya açtığı veya hukuka uygun olarak kamuya açılmış bilgiler;','Birleşme, devralma veya varlık devri hâlinde sizi bilgilendirir ve yeni veri sorumlusunun bu politikaya bağlı kalmasını şart koşar veya yasanın gerektirdiği şekilde yeniden onayınızı alırız.']],
['p','Ayrı onayınız olmadıkça veya yasa gerektirmedikçe kişisel bilgilerinizi kamuya açıklamayız.'],
['h','7. Haklarınız'],
['p','Yürürlükteki yasa kapsamında şunları yapabilirsiniz:'],
['ul',['Kişisel bilgilerinize **erişme, bunları düzeltme ve silme**;','Sistem ayarlarından **mikrofon iznini** kapatarak, reklam izlemeyi sınırlayarak veya bizimle iletişime geçerek **onayınızı geri çekme**;','Android reklam ayarları veya iOS “İzleme” ayarları aracılığıyla **kişiselleştirilmiş reklamları kapatma**;','Google Play veya Apple App Store abonelik ayarlarından **abonelikleri yönetme**;','Uygulama verilerini temizleyerek veya uygulamayı kaldırarak **yerel verileri silme**;','xieh6888@gmail.com adresine yazarak **şikâyet veya bildirimde bulunma**; yasal süre içinde yanıt veririz.']],
['p','Uygulamada hesap bulunmadığından bilgilerinizi bir hesap üzerinden tespit edemeyebiliriz. Talep gönderdiğinizde kimliğinizi ve talebinizi doğrulamak için gerekli bilgileri isteyebiliriz.'],
['h','8. Bilgi güvenliği'],
['p','Bilgileri kayıp, kötüye kullanım, yetkisiz erişim veya açıklamaya karşı korumak için aktarım sırasında şifreleme, erişim kontrolü ve veri minimizasyonu gibi makul teknik ve idari önlemler uygularız. Hiçbir internet ortamı tamamen güvenli değildir; bu nedenle %100 güvenlik garanti edemeyiz. Kişisel bilgi güvenliği olayı meydana gelirse yanıt planımızı devreye alır, düzeltici önlemler alır ve yasanın gerektirdiği şekilde sizi ve düzenleyici makamları bilgilendiririz.'],
['h','9. Küçüklerin korunması'],
['p','Uygulama ağırlıklı olarak yetişkinlere yöneliktir. 14 yaşından küçükseniz lütfen yalnızca ebeveyninizin veya vasinizin izni ve rehberliğinde kullanın. Çocukların kişisel bilgilerini kendi inisiyatifimizle toplamayız; vasi izni olmadan toplandığını tespit edersek yasanın gerektirdiği şekilde sileriz. Durumu öğrenen vasiler xieh6888@gmail.com adresinden bize ulaşabilir.'],
['h','10. Bu politikadaki değişiklikler'],
['p','Bu politikayı zaman zaman revize edebiliriz. Sizi uygulama içi açılır pencere veya duyuru yoluyla bilgilendirir ve güncelleme ile yürürlük tarihlerini belirtiriz. Önemli değişikliklerde yasanın gerektirdiği şekilde yeniden onayınızı alırız. Uygulamayı kullanmaya devam etmeniz güncellenmiş politikayı kabul ettiğiniz anlamına gelir; kabul etmiyorsanız lütfen kullanımı bırakın.'],
['h','11. Bize ulaşın'],
['contact',['**Gizlilik iletişim e-postası:** xieh6888@gmail.com','Talepleri hızla işleme alır ve yasanın öngördüğü süre içinde yanıt veririz.']]

vi:{dir:'ltr',title:'Chính sách quyền riêng tư',footer:'© 2026 EditBook-AudioEditor · Mr. Xie',blocks:[
['meta',[['Sản phẩm: ','EditBook-AudioEditor'],['Cập nhật lần cuối: ','1 tháng 11 năm 2026'],['Ngày có hiệu lực: ','1 tháng 11 năm 2026']]],
['p','EditBook-AudioEditor (“Ứng dụng”) được cung cấp bởi Mr. Xie (“chúng tôi”). Chúng tôi hiểu tầm quan trọng của thông tin cá nhân của bạn và nỗ lực bảo vệ thông tin đó. Chính sách này áp dụng cho ứng dụng di động EditBook-AudioEditor (Android/iOS) và các dịch vụ đi kèm. Chính sách giải thích cách chúng tôi thu thập, sử dụng, lưu trữ, chia sẻ và bảo vệ thông tin của bạn, cũng như cách bạn thực hiện các quyền của mình.'],
['notice',['**Lưu ý quan trọng:**','Ứng dụng **không yêu cầu tài khoản**. Chúng tôi không yêu cầu số điện thoại, tên hoặc thông tin đăng ký khác. Vui lòng đọc chính sách này trước khi sử dụng Ứng dụng; trong lần đầu sử dụng, chúng tôi sẽ hiển thị chính sách (ví dụ trong cửa sổ bật lên) và xin sự đồng ý của bạn. Nếu không đồng ý, vui lòng không sử dụng Ứng dụng.']],
['p','Nếu có câu hỏi, ý kiến hoặc khiếu nại về chính sách này, hãy liên hệ với chúng tôi tại xieh6888@gmail.com.'],
['h','1. Thông tin chúng tôi thu thập'],
['p','Chúng tôi tuân thủ các nguyên tắc hợp pháp, công bằng, cần thiết và thiện chí, chỉ thu thập thông tin cần thiết để cung cấp các tính năng của Ứng dụng.'],
['h3','1.1 Âm thanh bạn chọn hoặc ghi'],
['p','Ứng dụng là công cụ chỉnh sửa âm thanh. Các tệp âm thanh bạn nhập, âm thanh bạn ghi bằng micrô, các chỉnh sửa và kết quả xuất **mặc định được xử lý cục bộ trên thiết bị của bạn**. Chúng tôi không tự ý tải nội dung âm thanh của bạn lên máy chủ của mình.'],
['p','Chỉ khi bạn sử dụng các tính năng như “chia sẻ/xuất sang ứng dụng khác”, tệp mới được chuyển qua chức năng chia sẻ của hệ thống trên thiết bị đến ứng dụng bạn chọn. Vui lòng xem chính sách dữ liệu của ứng dụng đó.'],
['p','Chúng tôi chỉ truy cập tệp phương tiện khi bạn chọn, **không quét các tệp khác trên thiết bị của bạn**, và quyền micrô **chỉ được yêu cầu và sử dụng khi bạn nhấn vào tính năng ghi âm**.'],
['h3','1.2 Thông tin thiết bị, nhật ký và thống kê sử dụng'],
['p','Để vận hành Ứng dụng, phân tích, khắc phục sự cố và hiển thị quảng cáo, chúng tôi và các SDK bên thứ ba có thể thu thập:'],
['ul',['Mẫu thiết bị, phiên bản hệ điều hành, phiên bản Ứng dụng, cài đặt ngôn ngữ và khu vực;','Loại và trạng thái mạng, địa chỉ IP;','Mã nhận dạng thiết bị như Android Advertising ID, OAID, IDFA (nếu bạn cho phép) và Android ID, tùy theo những gì mỗi SDK thực tế thu thập;','Thống kê khởi chạy Ứng dụng, sử dụng trang/tính năng và nhấp;','Dữ liệu hiển thị, nhấp và chuyển đổi quảng cáo;','Nhật ký sự cố, ngăn xếp lỗi và dữ liệu hiệu năng.']],
['h3','1.3 Thông tin đăng ký và mua hàng'],
['p','Nếu bạn đăng ký qua **Google Play hoặc Apple App Store**, việc thanh toán và xử lý đơn hàng do cửa hàng thực hiện. Chúng tôi **không trực tiếp thu thập số thẻ, mật khẩu thanh toán hoặc dữ liệu thanh toán tương tự của bạn**.'],
['p','Chúng tôi có thể nhận từ cửa hàng thông tin cần thiết để xác minh quyền lợi, khôi phục giao dịch mua và xử lý yêu cầu hoàn tiền, bao gồm:'],
['ul',['ID sản phẩm, trạng thái đăng ký, thời gian mua và hết hạn;','Mã nhận dạng đơn hàng/giao dịch, khu vực;','**Apple có thể cung cấp cho nhà phát triển ID người đăng ký và lịch sử mua hàng** để xác định đăng ký, cung cấp nội dung và hỗ trợ yêu cầu hoàn tiền;','**Google Play Billing** có thể cung cấp lịch sử mua hàng (trạng thái mua, mã giao dịch, v.v.) để xác nhận hiệu lực của đăng ký.']],
['p','Vui lòng xử lý hoàn tiền và tranh chấp thanh toán trước tiên qua các kênh chính thức của Google Play hoặc Apple.'],
['h3','1.4 Thông tin quảng cáo'],
['p','Ứng dụng sử dụng **Google AdMob (Google Mobile Ads SDK)** để hiển thị quảng cáo. Theo mô tả công khai của Google về cách SDK thu thập dữ liệu, SDK có thể thu thập những thông tin sau để phân phối quảng cáo, giới hạn tần suất, chống gian lận, đo lường và cải thiện hiệu năng SDK:'],
['ul',['**Địa chỉ IP**, có thể dùng để ước tính vị trí gần đúng của thiết bị;','**Mã nhận dạng thiết bị**, bao gồm mã nhận dạng quảng cáo (Android Advertising ID / IDFA trên iOS, IDFA chịu sự điều chỉnh của ATT trên iOS) hoặc các mã nhận dạng khác trong phạm vi ứng dụng/nhà phát triển;','**Dữ liệu quảng cáo**, chẳng hạn quảng cáo bạn thấy;','**Tương tác của người dùng**, chẳng hạn nhấn khởi chạy ứng dụng và xem video;','**Nhật ký sự cố, thông tin chẩn đoán và dữ liệu hiệu năng** không liên kết với bạn.']],
['p','AdMob có thể sử dụng dữ liệu này cho mục đích quảng cáo và phân tích của bên thứ ba và mã hóa dữ liệu khi truyền. Khi pháp luật yêu cầu (ví dụ EEA, Vương quốc Anh, Thụy Sĩ), chúng tôi xin sự đồng ý của bạn qua hộp thoại quản lý sự đồng ý. Bạn có thể hạn chế theo dõi quảng cáo, đặt lại mã nhận dạng quảng cáo hoặc tắt quảng cáo được cá nhân hóa trong cài đặt quảng cáo Android hoặc cài đặt “Theo dõi” trên iOS; sau khi tắt, bạn vẫn có thể thấy quảng cáo không được cá nhân hóa.'],
['h3','1.5 Thông tin bạn gửi cho chúng tôi qua email'],
['p','Nếu bạn gửi email cho chúng tôi, chúng tôi xử lý địa chỉ, nội dung tin nhắn và tệp đính kèm bạn cung cấp, chỉ nhằm trả lời và giải quyết yêu cầu của bạn.'],
['notice',['**Chúng tôi không tự ý thu thập thông tin cá nhân nhạy cảm như danh bạ, SMS, vị trí chính xác, dữ liệu sinh trắc học hoặc dữ liệu sức khỏe.** Nếu điều này thay đổi, chúng tôi sẽ thông báo và lấy sự đồng ý theo quy định pháp luật.']],
['h','2. Quyền của Ứng dụng'],
['p','Chúng tôi chỉ yêu cầu quyền khi một tính năng cụ thể cần đến. Bạn có thể từ chối hoặc thu hồi bất cứ lúc nào trong cài đặt hệ thống; việc từ chối các quyền không thiết yếu không ảnh hưởng đến các tính năng khác.'],
['table',{head:['Quyền','Mục đích','Có bắt buộc?'],rows:[
['Mạng','Tải quảng cáo, thống kê, báo cáo sự cố, xác minh trạng thái đăng ký','Bắt buộc'],
['Lưu trữ / phương tiện / tệp','Nhập, chỉnh sửa và xuất các tệp âm thanh bạn chọn','Bắt buộc cho các tính năng này'],
['**Micrô**','**Chỉ ghi âm khi bạn nhấn ghi; bản ghi vẫn ở trong dự án cục bộ và không được tải lên máy chủ của chúng tôi**','**Bắt buộc để ghi âm**'],
['Mã nhận dạng quảng cáo / theo dõi (ATT trên iOS, nếu áp dụng)','Quảng cáo được cá nhân hóa và đo lường quảng cáo','Tùy chọn; có thể từ chối']]}],
['notice',['**Về quyền micrô:**','Quyền này không bao giờ được yêu cầu khi khởi chạy hoặc trong quá trình giới thiệu ban đầu; hộp thoại hệ thống chỉ xuất hiện khi bạn mở và kích hoạt tính năng ghi âm. Nếu từ chối, việc nhập, chỉnh sửa và xuất vẫn hoạt động. Bạn có thể xem, thay đổi hoặc thu hồi quyền bất cứ lúc nào trong cài đặt hệ thống.']],
['h','3. SDK và dịch vụ bên thứ ba'],
['table',{head:['SDK / dịch vụ','Nhà cung cấp','Mục đích','Thông tin có thể được thu thập','Chính sách quyền riêng tư'],rows:[

['**Google AdMob (Google Mobile Ads SDK)**','**Google LLC**','**Hiển thị quảng cáo, giới hạn tần suất, chống gian lận, đo lường, hiệu năng SDK**','**Địa chỉ IP, mã nhận dạng thiết bị (bao gồm mã nhận dạng quảng cáo), dữ liệu quảng cáo, tương tác người dùng, nhật ký sự cố, chẩn đoán, dữ liệu hiệu năng**',SDK_ROWS_URL[2]],
['Google Play Billing','Google LLC','Đăng ký và mua hàng trên Android','ID sản phẩm, lịch sử mua hàng, mã nhận dạng đơn hàng/giao dịch, trạng thái đăng ký, khu vực, v.v.',SDK_ROWS_URL[3]],
['Apple App Store / Mua trong ứng dụng','Apple Inc.','Đăng ký và mua hàng trên iOS','ID sản phẩm, ID người đăng ký, lịch sử mua hàng, mã nhận dạng đơn hàng/giao dịch, trạng thái đăng ký, khu vực, v.v.',SDK_ROWS_URL[4]]]}],
['p','Chúng tôi có thể thay đổi SDK bên thứ ba khi cập nhật Ứng dụng và sẽ thông báo cho bạn qua danh sách chia sẻ bên thứ ba trong Ứng dụng hoặc bản cập nhật chính sách này.'],
['h','4. Cách chúng tôi sử dụng thông tin'],
['ol',['Cung cấp các tính năng cốt lõi: nhập âm thanh, **ghi âm**, chỉnh sửa, xuất và chia sẻ;','Xác minh quyền đăng ký, khôi phục giao dịch mua và hiển thị trạng thái đăng ký;','Hiển thị quảng cáo qua Google AdMob, kiểm soát tần suất, đo lường hiệu quả quảng cáo và chống gian lận;','Phân tích việc sử dụng để cải thiện tính năng và trải nghiệm;','Giám sát sự cố, khắc phục lỗi và duy trì sự ổn định, an toàn của Ứng dụng;','Phản hồi câu hỏi, khiếu nại và yêu cầu về quyền của bạn;','Tuân thủ pháp luật và yêu cầu của cơ quan quản lý.']],
['p','Chúng tôi không sử dụng nội dung âm thanh của bạn (bao gồm bản ghi) để nhắm mục tiêu quảng cáo và không bán cho bên thứ ba.'],

/* ---------- language resolution: URL ?lang= > browser languages > English ---------- */
const DEFAULT_LANG='en';
const ALIAS={zh:'zh-Hans','zh-hans':'zh-Hans','zh-cn':'zh-Hans','zh-sg':'zh-Hans','zh-my':'zh-Hans','zh-hant':'zh-Hant','zh-tw':'zh-Hant','zh-hk':'zh-Hant','zh-mo':'zh-Hant'};
const SUPPORTED=LANGUAGES.reduce((m,l)=>(m[l.code.toLowerCase()]=l.code,m),{});
function normalizeLang(raw){
  if(!raw)return null;
  const v=String(raw).trim().toLowerCase().replace(/_/g,'-');
  if(!v)return null;
  if(ALIAS[v])return ALIAS[v];
  if(SUPPORTED[v])return SUPPORTED[v];
  if(v.startsWith('zh-hant'))return 'zh-Hant';
  if(v.startsWith('zh'))return 'zh-Hans';
  const b=v.split('-')[0];
  return SUPPORTED[b]||null;
}
function detectLang(){
  try{const p=normalizeLang(new URLSearchParams(location.search).get('lang'));if(p)return p;}catch(e){}
  try{
    const list=(navigator.languages&&navigator.languages.length)?navigator.languages:[navigator.language];
    for(const n of list){const m=normalizeLang(n);if(m)return m;}
  }catch(e){}
  return DEFAULT_LANG;
}

/* ---------- rendering ---------- */
const app=document.getElementById('app');
const btn=document.getElementById('langBtn'),menu=document.getElementById('langMenu'),cur=document.getElementById('langCur'),picker=document.getElementById('langPicker');
const EMAIL='xieh6888@gmail.com';
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function fmt(s){
  return esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
    .split(EMAIL).join('<a href="mailto:'+EMAIL+'">'+EMAIL+'</a>');
}
function cell(s){
  return /^https?:\/\//.test(s)?'<a href="'+s+'" target="_blank" rel="noopener noreferrer">'+s+'</a>':fmt(s);
}
function renderBlock(b){
  const [t,v]=b;
  switch(t){
    case 'meta':return '<div class="meta">'+v.map(r=>'<p><strong>'+esc(r[0])+'</strong>'+esc(r[1])+'</p>').join('')+'</div>';
    case 'p':return '<p>'+fmt(v)+'</p>';
    case 'h':return '<h2>'+fmt(v)+'</h2>';
    case 'h3':return '<h3>'+fmt(v)+'</h3>';
    case 'notice':return '<div class="notice">'+v.map(x=>'<p>'+fmt(x)+'</p>').join('')+'</div>';
    case 'contact':return '<div class="contact">'+v.map(x=>'<p>'+fmt(x)+'</p>').join('')+'</div>';
    case 'ul':case 'ol':return '<'+t+'>'+v.map(x=>'<li>'+fmt(x)+'</li>').join('')+'</'+t+'>';
    case 'table':return '<div class="table-wrap"><table><thead><tr>'+v.head.map(h=>'<th>'+esc(h)+'</th>').join('')+'</tr></thead><tbody>'+
      v.rows.map(r=>'<tr>'+r.map(c=>'<td>'+cell(c)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>';
  }
  return '';
}
function render(code){
  const key=I18N[code]?code:DEFAULT_LANG;   // untranslated languages fall back to English
  const d=I18N[key];
  document.documentElement.lang=key;
  document.documentElement.dir=d.dir;
  document.title=d.title+' - EditBook-AudioEditor';
  app.innerHTML='<h1>'+esc(d.title)+'</h1>'+d.blocks.map(renderBlock).join('')+'<footer><p>'+esc(d.footer)+'</p></footer>';
  setSelected(code);
}
function syncUrl(code){
  const u=new URL(location.href);
  if(code===DEFAULT_LANG&&!u.searchParams.has('lang'))return;
  u.searchParams.set('lang',code);
  try{history.replaceState(null,'',u.toString());}catch(e){}
}
function setSelected(code){
  const l=LANGUAGES.find(x=>x.code===code)||LANGUAGES[2];
  cur.textContent=l.label;
  menu.querySelectorAll('li').forEach(li=>li.setAttribute('aria-selected',li.dataset.code===code?'true':'false'));
}
function openMenu(o){
  menu.classList.toggle('open',o);
  btn.setAttribute('aria-expanded',o?'true':'false');
  if(o){const s=menu.querySelector('[aria-selected="true"]');if(s)menu.scrollTop=s.offsetTop-menu.clientHeight/2+s.offsetHeight/2;}
}
LANGUAGES.forEach(l=>{
  const li=document.createElement('li');
  li.setAttribute('role','option');li.dataset.code=l.code;li.lang=l.code;li.textContent=l.label;
  menu.appendChild(li);
});
let current=detectLang();
render(current);syncUrl(current);
btn.addEventListener('click',e=>{e.stopPropagation();openMenu(!menu.classList.contains('open'));});
menu.addEventListener('click',e=>{
  const li=e.target.closest('li');if(!li)return;
  current=li.dataset.code;render(current);syncUrl(current);openMenu(false);
  window.scrollTo({top:0,behavior:'smooth'});
});
document.addEventListener('click',e=>{if(!picker.contains(e.target))openMenu(false);});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){openMenu(false);btn.focus();}});
</script>
