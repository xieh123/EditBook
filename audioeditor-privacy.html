:root{--primary:#216e93;--text:#212121;--muted:#5f6368;--line:#e0e0e0;--bg:#fff;--soft:#f2f2f2}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Lato","PingFang SC","Hiragino Sans GB","Microsoft YaHei",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.75}
.page{max-width:760px;margin:0 auto;padding:72px 24px 80px}
.lang-picker{position:absolute;top:16px;inset-inline-end:20px;z-index:50}
.lang-btn{display:flex;align-items:center;gap:8px;border:1px solid var(--primary);border-radius:999px;padding:7px 12px;background:#fff;color:var(--primary);font:inherit;font-size:14px;cursor:pointer}
.lang-btn .chev{border-left:4px solid transparent;border-right:4px solid transparent;border-top:5px solid var(--primary)}
.lang-menu{display:none;max-height:min(60vh,420px);overflow-y:auto;position:absolute;top:calc(100% + 6px);inset-inline-end:0;width:180px;margin:0;padding:6px;list-style:none;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.15)}
.lang-menu.open{display:block}
.lang-menu li{padding:11px 14px;border-radius:8px;font-size:15px;cursor:pointer}
.lang-menu li:hover{background:var(--soft)}
.lang-menu li[aria-selected="true"]{background:#eaf3f8;color:var(--primary);font-weight:600}
h1{color:var(--primary);font-size:34px;font-weight:400;line-height:1.25;text-align:center;margin:0 0 32px}
h2{color:var(--primary);font-size:20px;font-weight:600;line-height:1.5;margin:40px 0 12px;padding-top:8px;border-top:1px solid var(--line)}
p{margin:12px 0}
.meta{background:var(--soft);border-radius:8px;padding:16px 20px;color:var(--muted);font-size:15px}
.meta p{margin:4px 0}
ul,ol{margin:12px 0;padding-inline-start:24px}
li{margin:8px 0}
strong{font-weight:600}
a{color:#006580;text-decoration:underline;word-break:break-all}
.table-wrap{overflow-x:auto;margin:16px 0;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;min-width:520px;font-size:15px}
th,td{text-align:start;vertical-align:top;padding:12px 14px;border-bottom:1px solid var(--line)}
th{background:var(--soft);font-weight:600}
tr:last-child td{border-bottom:none}
.contact{background:var(--soft);border-radius:8px;padding:18px 20px;margin-top:16px}
.contact p{margin:6px 0}
footer{margin-top:56px;padding-top:20px;border-top:1px solid var(--line);color:var(--muted);font-size:14px;text-align:center}
@media(max-width:479px){.page{padding:64px 16px}h1{font-size:26px}h2{font-size:18px}body{font-size:15px}}
</style>

['p','EditBook-AudioEditor(이하 "본 앱")는 Mr. Xie(이하 "당사")가 제공합니다. 본 앱은 기기 내에서 동작하는 오디오 편집 도구이며 계정 등록이 필요하지 않습니다. 본 방침은 본 앱이 정보를 어떻게 처리하고 보호하는지, 그리고 이용자가 로컬 데이터와 시스템 권한을 어떻게 관리할 수 있는지 설명합니다.'],
['p','본 방침에 대한 문의는 xieh6888@gmail.com으로 연락해 주십시오.'],

['p','현재 버전은 제3자 광고, 통계 분석, 크래시 모니터링, 구독 또는 앱 내 구입 서비스를 연동하지 않으므로 이러한 목적으로 기기 식별자나 이용 데이터를 수집하지 않습니다. 향후 버전에서 관련 서비스를 도입하는 경우, 도입 전에 본 방침을 업데이트하고 필요 시 법률에 따라 동의를 받겠습니다.'],

['p','본 앱의 핵심 기능은 기기에서 완결됩니다. 다음 데이터는 이용자의 기기에만 저장됩니다:'],

['p','본 앱은 이용자가 해당 기능을 직접 사용할 때에만 필요한 권한을 요청하며, 권한을 거부해도 다른 기능에는 영향이 없습니다.'],

['p','본 앱은 사용자 데이터를 당사 서버로 업로드하지 않으며, 오디오 콘텐츠, 녹음 및 프로젝트 데이터는 이용자의 iOS 기기에만 저장됩니다. 기기와 백업을 안전하게 관리하고, 필요에 따라 로컬 프로젝트 파일의 보관 및 삭제를 직접 관리하시기 바랍니다.'],
['h','6. 정보의 공유, 이전 및 공개'],
['p','당사는 이용자의 개인정보를 판매, 임대하거나 광고 목적으로 공유하지 않습니다. 본 앱은 이용자를 식별할 수 있는 개인정보를 수집하지 않고 오디오 콘텐츠도 당사 서버로 전송하지 않으므로, 제3자에게 개인정보를 공유하는 경우는 없습니다.'],
['p','다음의 법정 경우에 한하여 법률에 따라 협조할 수 있습니다:'],
['ol',['법률 또는 사법·행정기관의 강제적 요구가 있는 경우;','이용자 또는 타인의 생명·재산 등 중대한 정당한 이익을 보호하기 위해 본인의 동의를 받기 어려운 경우.']],
['h','7. 이용자의 권리'],
['p','본 앱은 계정이 필요 없고 데이터가 로컬에 저장되므로 이용자가 데이터를 직접 통제합니다:'],
['ul',['프로젝트 삭제, 앱 데이터 삭제 또는 앱 삭제를 통해 로컬 오디오, 녹음 및 프로젝트 데이터를 삭제;','iOS "설정"에서 본 앱의 마이크 및 파일/미디어 접근 권한을 끄거나 조정;','xieh6888@gmail.com으로 본 방침 관련 문의 또는 불만 제기.']],

es:{dir:'ltr',title:'Política de privacidad',footer:'© 2026 EditBook-AudioEditor · All rights reserved.',blocks:[
['meta',[['Producto: ','EditBook-AudioEditor'],['Última actualización: ','17 de noviembre de 2026'],['Fecha de entrada en vigor: ','17 de noviembre de 2026']]],
['p','EditBook-AudioEditor (la «Aplicación») es proporcionada por Mr. Xie («nosotros»). La Aplicación es una herramienta local de edición de audio y no requiere cuenta. Esta política explica cómo la Aplicación trata y protege su información, y cómo puede gestionar los datos locales y los permisos del sistema.'],
['p','Si tiene cualquier pregunta sobre esta política, contáctenos en xieh6888@gmail.com.'],
['h','1. Cómo se trata la información'],
['p','La Aplicación no le pide registrar una cuenta ni facilitar su nombre, número de teléfono u otra información personal ajena a la edición de audio.'],
['p','Los archivos de audio que importa, el audio que graba con el micrófono, los proyectos de edición y los resultados exportados se procesan y almacenan localmente en su dispositivo. No los subimos a nuestros servidores y no podemos acceder a ellos, leerlos ni respaldarlos de forma remota.'],
['p','La versión actual no integra servicios de terceros de publicidad, análisis, supervisión de fallos, suscripción ni compras dentro de la aplicación, por lo que no recopila identificadores del dispositivo ni datos de uso con esos fines. Si una versión futura incorpora tales servicios, actualizaremos esta política de antemano y, cuando sea necesario, obtendremos su consentimiento conforme a la ley.'],
['h','2. Datos tratados localmente'],
['p','Las funciones principales de la Aplicación se ejecutan en su dispositivo. Los siguientes datos se guardan únicamente en su dispositivo:'],
['table',{head:['Tipo de datos','Ubicación','Finalidad'],rows:[
['Archivos de audio que importa','Su dispositivo','Cortar, editar y exportar'],
['Audio grabado con el micrófono','Su dispositivo','Se guarda en el proyecto actual para su edición'],
['Proyectos de edición, parámetros y archivos exportados','Su dispositivo','Conservar su progreso y resultados']]}],
['p','Puede eliminar estos datos locales borrando proyectos individuales, borrando los datos de la Aplicación o desinstalándola.'],
['h','3. Permisos de la Aplicación'],
['p','La Aplicación solicita un permiso solo cuando usted utiliza activamente la función correspondiente. Rechazar un permiso no afecta a las demás funciones.'],
['table',{head:['Permiso','Finalidad','¿Necesario?'],rows:[
['Micrófono','Captura audio solo cuando pulsa la función de grabación; las grabaciones se guardan únicamente en el proyecto local','Necesario para grabar; puede rechazarse'],
['Acceso a archivos / medios','Lee los archivos de audio o medios que usted selecciona, solo cuando los elige, para importarlos y editarlos','Necesario para importar; puede rechazarse']]}],
['p','El permiso de micrófono no se solicita al iniciar la aplicación; el aviso del sistema aparece solo cuando abre y activa la grabación. Puede revisar, modificar o revocar los permisos en cualquier momento en Ajustes de iOS.'],
['h','4. Servicios de terceros'],
['p','La versión actual no integra SDK ni servicios externos de terceros, incluidos publicidad, análisis, supervisión de fallos, gestión de suscripciones, inicio de sesión social y notificaciones push. Por tanto, no se envía información del dispositivo, datos de uso ni contenido de audio a servidores externos mediante servicios de terceros.'],
['p','Si una versión futura necesita servicios de terceros, actualizaremos esta política antes de integrarlos, los divulgaremos en la información de privacidad de la App Store y seguiremos los procedimientos de aviso y consentimiento exigidos por la ley (si procede).'],
['h','5. Almacenamiento y seguridad'],
['p','La Aplicación no sube datos de usuario a nuestros servidores. Su audio, grabaciones y datos de proyecto se almacenan solo en su dispositivo iOS. Le recomendamos mantener seguros su dispositivo y sus copias de seguridad, y gestionar usted mismo la conservación y eliminación de los archivos de proyecto locales según lo necesite.'],
['h','6. Cesión, transferencia y divulgación'],
['p','No vendemos, alquilamos ni compartimos su información personal con fines publicitarios. Dado que la Aplicación no recopila información personal que lo identifique ni transmite audio a nuestros servidores, no existe cesión de su información personal a terceros.'],
['p','Solo podemos colaborar conforme a la ley en los siguientes casos:'],
['ol',['Cuando lo exijan leyes, reglamentos o autoridades judiciales o administrativas;','Para proteger la vida, el patrimonio u otros intereses legítimos importantes suyos o de terceros cuando sea difícil obtener su consentimiento.']],
['h','7. Sus derechos'],
['p','Como la Aplicación no necesita cuenta y los datos se almacenan localmente, usted tiene control directo sobre ellos:'],
['ul',['Eliminar el audio, las grabaciones y los datos de proyecto locales borrando proyectos, borrando los datos de la Aplicación o desinstalándola;','Desactivar o ajustar los permisos de micrófono y de acceso a archivos/medios de la Aplicación en Ajustes de iOS;','Contactarnos en xieh6888@gmail.com para plantear dudas o quejas sobre esta política.']],
['p','Como no podemos localizar su información mediante una cuenta y no conservamos sus datos de audio, algunas solicitudes pueden no poder atenderse porque los datos no existen en nuestro poder. Agradecemos su comprensión.'],
['h','8. Protección de menores'],
['p','La Aplicación está destinada principalmente a adultos. Si es menor de 14 años, utilícela solo con el consentimiento y la orientación de sus padres o tutores. La Aplicación no recopila de forma activa información personal de menores; como el audio se almacena solo localmente, no podemos identificar ni eliminar de forma remota los datos locales de un usuario concreto. Los tutores con dudas pueden contactar en xieh6888@gmail.com.'],
['h','9. Cambios en esta política'],
['p','Podemos revisar esta política periódicamente. Actualizaremos la «Última actualización» y la «Fecha de entrada en vigor» de esta página y, si cambia realmente el alcance de la recopilación de datos, se lo notificaremos en la Aplicación. El uso continuado de la Aplicación implica la aceptación de la política actualizada; si no está de acuerdo, deje de utilizarla.'],
['h','10. Contacto'],
['contact',['**Correo de contacto en materia de privacidad:** xieh6888@gmail.com','Atenderemos las solicitudes con prontitud y responderemos en un plazo razonable.']]
]},
fr:{dir:'ltr',title:'Politique de confidentialité',footer:'© 2026 EditBook-AudioEditor · All rights reserved.',blocks:[
['meta',[['Produit : ','EditBook-AudioEditor'],['Dernière mise à jour : ','17 novembre 2026'],['Date d’entrée en vigueur : ','17 novembre 2026']]],
['p','EditBook-AudioEditor (l’« Application ») est fournie par Mr. Xie (« nous »). L’Application est un outil local d’édition audio qui ne nécessite aucun compte. La présente politique explique comment l’Application traite et protège vos informations, et comment vous pouvez gérer les données locales et les autorisations du système.'],
['p','Pour toute question sur cette politique, contactez-nous à xieh6888@gmail.com.'],
['h','1. Traitement des informations'],
['p','L’Application ne vous demande ni de créer un compte, ni de fournir votre nom, votre numéro de téléphone ou d’autres informations personnelles sans rapport avec l’édition audio.'],
['p','Les fichiers audio que vous importez, l’audio enregistré au microphone, les projets d’édition et les résultats exportés sont tous traités et stockés localement sur votre appareil. Nous ne les téléversons pas sur nos serveurs et ne pouvons ni y accéder, ni les lire, ni les sauvegarder à distance.'],
['p','La version actuelle n’intègre aucun service tiers de publicité, de statistiques, de surveillance des plantages, d’abonnement ou d’achats intégrés ; elle ne collecte donc ni identifiants d’appareil ni données d’utilisation à ces fins. Si une version future introduit de tels services, nous mettrons à jour cette politique au préalable et, si nécessaire, obtiendrons votre consentement conformément à la loi.'],
['h','2. Données traitées localement'],
['p','Les fonctions essentielles de l’Application s’exécutent sur votre appareil. Les données suivantes restent uniquement sur votre appareil :'],
['table',{head:['Type de données','Emplacement','Finalité'],rows:[
['Fichiers audio que vous importez','Votre appareil','Découpe, montage et export'],
['Audio enregistré au microphone','Votre appareil','Enregistré dans le projet en cours pour le montage'],
['Projets de montage, paramètres et fichiers exportés','Votre appareil','Conservation de votre progression et de vos résultats']]}],
['p','Vous pouvez supprimer ces données locales en supprimant des projets, en effaçant les données de l’Application ou en la désinstallant.'],
['h','3. Autorisations de l’Application'],
['p','L’Application ne demande une autorisation que lorsque vous utilisez activement la fonction concernée. Refuser une autorisation n’affecte pas les autres fonctions.'],
['table',{head:['Autorisation','Finalité','Nécessaire ?'],rows:[
['Microphone','Capture l’audio uniquement lorsque vous appuyez sur l’enregistrement ; les enregistrements sont conservés uniquement dans le projet local','Nécessaire pour l’enregistrement ; peut être refusée'],
['Accès aux fichiers / médias','Lit les fichiers audio ou médias que vous sélectionnez, uniquement lorsque vous les choisissez, pour l’import et le montage','Nécessaire pour l’import ; peut être refusée']]}],
['p','L’autorisation du microphone n’est pas demandée au lancement ; l’invite système n’apparaît que lorsque vous ouvrez et déclenchez l’enregistrement. Vous pouvez consulter, modifier ou révoquer les autorisations à tout moment dans les Réglages d’iOS.'],
['h','4. Services tiers'],
['p','La version actuelle n’intègre aucun SDK ni service externe tiers, notamment publicité, statistiques, surveillance des plantages, gestion d’abonnements, connexion sociale et notifications push. Aucune information sur l’appareil, donnée d’utilisation ou contenu audio n’est donc transmis à des serveurs externes via des services tiers.'],
['p','Si une version future nécessite des services tiers, nous mettrons à jour cette politique avant leur intégration, les indiquerons dans les informations de confidentialité de l’App Store et suivrons les procédures d’information et de consentement prévues par la loi (le cas échéant).'],
['h','5. Conservation et sécurité'],
['p','L’Application ne téléverse aucune donnée utilisateur sur nos serveurs. Votre audio, vos enregistrements et vos projets sont stockés uniquement sur votre appareil iOS. Nous vous recommandons de protéger votre appareil et vos sauvegardes et de gérer vous-même la conservation et la suppression des fichiers de projet locaux selon vos besoins.'],
['h','6. Partage, transfert et divulgation'],
['p','Nous ne vendons ni ne louons vos informations personnelles et ne les partageons pas à des fins publicitaires. L’Application ne collectant aucune information personnelle permettant de vous identifier et ne transmettant pas d’audio à nos serveurs, aucune information personnelle n’est partagée avec des tiers.'],
['p','Nous ne pouvons coopérer, conformément à la loi, que dans les cas suivants :'],
['ol',['Lorsque la loi, la réglementation ou des autorités judiciaires ou administratives l’exigent ;','Pour protéger la vie, les biens ou d’autres intérêts légitimes majeurs de vous-même ou d’autrui lorsqu’il est difficile d’obtenir votre consentement.']],
['h','7. Vos droits'],
['p','L’Application ne nécessitant pas de compte et les données étant stockées localement, vous contrôlez directement vos données :'],
['ul',['Supprimer l’audio, les enregistrements et les projets locaux en supprimant des projets, en effaçant les données de l’Application ou en la désinstallant ;','Désactiver ou ajuster les autorisations de microphone et d’accès aux fichiers/médias dans les Réglages d’iOS ;','Nous contacter à xieh6888@gmail.com pour toute question ou réclamation relative à cette politique.']],
['p','Ne pouvant localiser vos informations via un compte et ne détenant pas vos données audio, certaines demandes peuvent ne pas pouvoir aboutir faute de données en notre possession. Merci de votre compréhension.'],
['h','8. Protection des mineurs'],
['p','L’Application est principalement destinée aux adultes. Si vous avez moins de 14 ans, utilisez-la uniquement avec le consentement et sous la supervision d’un parent ou tuteur. L’Application ne collecte pas activement d’informations personnelles d’enfants ; l’audio étant stocké uniquement en local, nous ne pouvons ni identifier ni supprimer à distance les données locales d’un utilisateur donné. Les tuteurs ayant des questions peuvent écrire à xieh6888@gmail.com.'],
['h','9. Modifications de cette politique'],
['p','Nous pouvons réviser cette politique de temps à autre. Nous mettrons à jour la « Dernière mise à jour » et la « Date d’entrée en vigueur » de cette page et, si le périmètre de collecte des données change réellement, vous en informerons dans l’Application. La poursuite de l’utilisation de l’Application vaut acceptation de la politique mise à jour ; dans le cas contraire, veuillez cesser de l’utiliser.'],
['h','10. Nous contacter'],
['contact',['**E-mail de contact pour la confidentialité :** xieh6888@gmail.com','Nous traiterons les demandes rapidement et répondrons dans un délai raisonnable.']]
]},
de:{dir:'ltr',title:'Datenschutzerklärung',footer:'© 2026 EditBook-AudioEditor · All rights reserved.',blocks:[
['meta',[['Produkt: ','EditBook-AudioEditor'],['Zuletzt aktualisiert: ','17. November 2026'],['Inkrafttreten: ','17. November 2026']]],
['p','EditBook-AudioEditor (die „App“) wird von Mr. Xie („wir“) bereitgestellt. Die App ist ein lokales Audio-Bearbeitungswerkzeug und erfordert kein Benutzerkonto. Diese Erklärung beschreibt, wie die App Ihre Informationen verarbeitet und schützt und wie Sie lokale Daten und Systemberechtigungen verwalten können.'],
['p','Bei Fragen zu dieser Erklärung kontaktieren Sie uns unter xieh6888@gmail.com.'],
['h','1. Umgang mit Informationen'],
['p','Die App verlangt keine Kontoregistrierung und fordert weder Ihren Namen noch Ihre Telefonnummer oder andere personenbezogene Daten, die nichts mit der Audiobearbeitung zu tun haben.'],
['p','Von Ihnen importierte Audiodateien, mit dem Mikrofon aufgenommenes Audio, Bearbeitungsprojekte und exportierte Ergebnisse werden ausschließlich lokal auf Ihrem Gerät verarbeitet und gespeichert. Wir laden sie nicht auf unsere Server hoch und können weder aus der Ferne darauf zugreifen, sie lesen noch sichern.'],
['p','Die aktuelle Version bindet keine Drittanbieterdienste für Werbung, Analyse, Absturzüberwachung, Abonnements oder In-App-Käufe ein und erhebt daher dafür keine Gerätekennungen oder Nutzungsdaten. Falls eine künftige Version solche Dienste einführt, aktualisieren wir diese Erklärung vorher und holen bei Bedarf die gesetzlich erforderliche Einwilligung ein.'],
['h','2. Lokal verarbeitete Daten'],
['p','Die Kernfunktionen der App laufen auf Ihrem Gerät. Die folgenden Daten verbleiben ausschließlich auf Ihrem Gerät:'],
['table',{head:['Datenart','Speicherort','Zweck'],rows:[
['Von Ihnen importierte Audiodateien','Ihr Gerät','Schneiden, Bearbeiten und Exportieren'],
['Mit dem Mikrofon aufgenommenes Audio','Ihr Gerät','Speicherung im aktuellen Projekt zur Bearbeitung'],
['Bearbeitungsprojekte, Parameter und exportierte Dateien','Ihr Gerät','Sicherung Ihres Fortschritts und Ihrer Ergebnisse']]}],
['p','Sie können diese lokalen Daten löschen, indem Sie einzelne Projekte löschen, die App-Daten löschen oder die App deinstallieren.'],
['h','3. App-Berechtigungen'],
['p','Die App fordert eine Berechtigung nur an, wenn Sie die zugehörige Funktion aktiv nutzen. Die Ablehnung einer Berechtigung beeinträchtigt andere Funktionen nicht.'],
['table',{head:['Berechtigung','Zweck','Erforderlich?'],rows:[
['Mikrofon','Erfasst Audio nur, wenn Sie die Aufnahmefunktion antippen; Aufnahmen werden nur im lokalen Projekt gespeichert','Für Aufnahmen erforderlich; ablehnbar'],
['Datei-/Medienzugriff','Liest die von Ihnen ausgewählten Audio- oder Mediendateien nur dann, wenn Sie sie auswählen, für Import und Bearbeitung','Für den Import erforderlich; ablehnbar']]}],
['p','Die Mikrofonberechtigung wird beim Start nicht angefragt; die Systemabfrage erscheint erst, wenn Sie die Aufnahme öffnen und auslösen. Sie können Berechtigungen jederzeit in den iOS-Einstellungen prüfen, ändern oder widerrufen.'],
['h','4. Dienste Dritter'],
['p','Die aktuelle Version bindet keine Drittanbieter-SDKs oder externen Dienste ein, darunter Werbung, Analyse, Absturzüberwachung, Abonnementverwaltung, Social-Login und Push-Dienste. Daher werden über Drittanbieterdienste keine Geräteinformationen, Nutzungsdaten oder Audioinhalte an externe Server übertragen.'],
['p','Sollte eine künftige Version Drittanbieterdienste benötigen, aktualisieren wir diese Erklärung vor der Integration, legen sie in den Datenschutzangaben des App Store offen und befolgen die gesetzlich vorgeschriebenen Informations- und Einwilligungsverfahren (falls zutreffend).'],
['h','5. Speicherung und Sicherheit'],
['p','Die App lädt keine Nutzerdaten auf unsere Server hoch. Ihre Audioinhalte, Aufnahmen und Projektdaten werden nur auf Ihrem iOS-Gerät gespeichert. Wir empfehlen, Ihr Gerät und Ihre Backups sicher aufzubewahren und die Aufbewahrung und Löschung lokaler Projektdateien bei Bedarf selbst zu verwalten.'],
['h','6. Weitergabe, Übertragung und Offenlegung'],
['p','Wir verkaufen oder vermieten Ihre personenbezogenen Daten nicht und geben sie nicht zu Werbezwecken weiter. Da die App keine Sie identifizierenden personenbezogenen Daten erhebt und keine Audioinhalte an unsere Server überträgt, findet keine Weitergabe Ihrer personenbezogenen Daten an Dritte statt.'],
['p','Nur in den folgenden Fällen können wir gesetzlich zur Mitwirkung verpflichtet sein:'],
['ol',['Wenn Gesetze, Vorschriften oder Justiz- bzw. Verwaltungsbehörden dies verlangen;','Zum Schutz von Leben, Eigentum oder anderen wesentlichen berechtigten Interessen von Ihnen oder anderen, wenn eine Einwilligung schwer zu erlangen ist.']],
['h','7. Ihre Rechte'],
['p','Da die App kein Konto benötigt und die Daten lokal gespeichert sind, haben Sie direkte Kontrolle über Ihre Daten:'],
['ul',['Lokale Audiodaten, Aufnahmen und Projektdaten durch Löschen von Projekten, Löschen der App-Daten oder Deinstallieren der App entfernen;','Die Mikrofon- und Datei-/Medienzugriffsberechtigungen der App in den iOS-Einstellungen ausschalten oder anpassen;','Uns unter xieh6888@gmail.com bei Fragen oder Beschwerden zu dieser Erklärung kontaktieren.']],
['p','Da wir Ihre Daten nicht über ein Konto zuordnen können und Ihre Audiodaten nicht besitzen, können manche Anfragen mangels vorhandener Daten möglicherweise nicht erfüllt werden. Wir bitten um Verständnis.'],
['h','8. Schutz von Minderjährigen'],
['p','Die App richtet sich hauptsächlich an Erwachsene. Wenn Sie unter 14 Jahre alt sind, nutzen Sie sie bitte nur mit Einwilligung und Anleitung eines Elternteils oder Erziehungsberechtigten. Die App erhebt nicht aktiv personenbezogene Daten von Kindern; da Audio nur lokal gespeichert wird, können wir lokale Daten eines bestimmten Nutzers nicht aus der Ferne identifizieren oder löschen. Erziehungsberechtigte mit Fragen erreichen uns unter xieh6888@gmail.com.'],
['h','9. Änderungen dieser Erklärung'],
['p','Wir können diese Erklärung von Zeit zu Zeit überarbeiten. Wir aktualisieren dann „Zuletzt aktualisiert“ und „Inkrafttreten“ auf dieser Seite und informieren Sie in der App, wenn sich der Umfang der Datenerhebung tatsächlich ändert. Die weitere Nutzung der App gilt als Zustimmung zur aktualisierten Erklärung; andernfalls stellen Sie die Nutzung bitte ein.'],
['h','10. Kontakt'],
['contact',['**E-Mail für Datenschutzanliegen:** xieh6888@gmail.com','Wir bearbeiten Anfragen zügig und antworten innerhalb einer angemessenen Frist.']]
]},
it:{dir:'ltr',title:'Informativa sulla privacy',footer:'© 2026 EditBook-AudioEditor · All rights reserved.',blocks:[
['meta',[['Prodotto: ','EditBook-AudioEditor'],['Ultimo aggiornamento: ','17 novembre 2026'],['Data di entrata in vigore: ','17 novembre 2026']]],
['p','EditBook-AudioEditor (l’«App») è fornita da Mr. Xie («noi»). L’App è uno strumento locale di editing audio e non richiede un account. La presente informativa spiega come l’App tratta e protegge le Sue informazioni e come Lei può gestire i dati locali e le autorizzazioni di sistema.'],
['p','Per qualsiasi domanda sulla presente informativa, ci contatti a xieh6888@gmail.com.'],
['h','1. Come vengono trattate le informazioni'],
['p','L’App non Le chiede di registrare un account né di fornire nome, numero di telefono o altre informazioni personali estranee all’editing audio.'],
['p','I file audio importati, l’audio registrato con il microfono, i progetti di editing e i risultati esportati sono tutti elaborati e conservati localmente sul Suo dispositivo. Non li carichiamo sui nostri server e non possiamo accedervi, leggerli o salvarne copie da remoto.'],
['p','La versione attuale non integra servizi di terze parti per pubblicità, statistiche, monitoraggio degli arresti anomali, abbonamenti o acquisti in-app, quindi non raccoglie identificatori del dispositivo né dati di utilizzo per tali finalità. Se una versione futura introducesse tali servizi, aggiorneremo prima la presente informativa e, ove necessario, otterremo il Suo consenso come previsto dalla legge.'],
['h','2. Dati elaborati localmente'],
['p','Le funzioni principali dell’App vengono eseguite sul Suo dispositivo. I seguenti dati restano solo sul Suo dispositivo:'],
['table',{head:['Tipo di dati','Posizione','Finalità'],rows:[
['File audio importati','Il Suo dispositivo','Taglio, modifica ed esportazione'],
['Audio registrato con il microfono','Il Suo dispositivo','Salvato nel progetto corrente per la modifica'],
['Progetti di editing, parametri e file esportati','Il Suo dispositivo','Conservazione dei progressi e dei risultati']]}],
['p','Può eliminare questi dati locali cancellando i singoli progetti, i dati dell’App o disinstallandola.'],
['h','3. Autorizzazioni dell’App'],
['p','L’App richiede un’autorizzazione solo quando Lei utilizza attivamente la funzione corrispondente. Rifiutare un’autorizzazione non pregiudica le altre funzioni.'],
['table',{head:['Autorizzazione','Finalità','Necessaria?'],rows:[
['Microfono','Acquisisce audio solo quando tocca la funzione di registrazione; le registrazioni sono salvate solo nel progetto locale','Necessaria per registrare; può essere rifiutata'],
['Accesso a file / contenuti multimediali','Legge i file audio o multimediali da Lei selezionati, solo quando li sceglie, per importazione e modifica','Necessaria per importare; può essere rifiutata']]}],
['p','L’autorizzazione al microfono non viene richiesta all’avvio; la richiesta di sistema compare solo quando apre e avvia la registrazione. Può verificare, modificare o revocare le autorizzazioni in qualsiasi momento nelle Impostazioni di iOS.'],
['h','4. Servizi di terze parti'],
['p','La versione attuale non integra SDK o servizi esterni di terze parti, inclusi pubblicità, statistiche, monitoraggio degli arresti anomali, gestione degli abbonamenti, accesso social e notifiche push. Pertanto nessuna informazione sul dispositivo, dato di utilizzo o contenuto audio viene inviato a server esterni tramite servizi di terze parti.'],
['p','Se una versione futura richiedesse servizi di terze parti, aggiorneremo la presente informativa prima dell’integrazione, li indicheremo nelle informazioni sulla privacy dell’App Store e seguiremo le procedure di informativa e consenso previste dalla legge (se applicabili).'],
['h','5. Conservazione e sicurezza'],
['p','L’App non carica dati degli utenti sui nostri server. I Suoi contenuti audio, le registrazioni e i dati dei progetti sono conservati solo sul Suo dispositivo iOS. Le consigliamo di custodire con cura dispositivo e backup e di gestire autonomamente la conservazione e l’eliminazione dei file di progetto locali.'],
['h','6. Condivisione, trasferimento e divulgazione'],
['p','Non vendiamo, non affittiamo né condividiamo le Sue informazioni personali a fini pubblicitari. Poiché l’App non raccoglie informazioni personali che La identifichino e non trasmette audio ai nostri server, non vi è alcuna condivisione di informazioni personali con terzi.'],
['p','Possiamo collaborare ai sensi di legge solo nei seguenti casi:'],
['ol',['Quando richiesto da leggi, regolamenti o autorità giudiziarie o amministrative;','Per proteggere la vita, il patrimonio o altri interessi legittimi rilevanti Suoi o di terzi quando sia difficile ottenere il Suo consenso.']],
['h','7. I Suoi diritti'],
['p','Poiché l’App non richiede un account e i dati sono conservati localmente, Lei ha il controllo diretto dei Suoi dati:'],
['ul',['Eliminare audio, registrazioni e dati dei progetti locali cancellando i progetti, i dati dell’App o disinstallandola;','Disattivare o regolare le autorizzazioni dell’App per microfono e accesso a file/contenuti multimediali nelle Impostazioni di iOS;','Contattarci a xieh6888@gmail.com per domande o reclami sulla presente informativa.']],
['p','Poiché non possiamo individuare le Sue informazioni tramite un account e non deteniamo i Suoi dati audio, alcune richieste potrebbero non essere evase perché i dati non esistono presso di noi. La ringraziamo per la comprensione.'],
['h','8. Protezione dei minori'],
['p','L’App è destinata principalmente agli adulti. Se ha meno di 14 anni, la utilizzi solo con il consenso e la guida di un genitore o tutore. L’App non raccoglie attivamente dati personali di minori; poiché l’audio è conservato solo localmente, non possiamo identificare o eliminare da remoto i dati locali di un utente specifico. I tutori con domande possono scrivere a xieh6888@gmail.com.'],
['h','9. Modifiche alla presente informativa'],
['p','Possiamo rivedere la presente informativa di tanto in tanto. Aggiorneremo «Ultimo aggiornamento» e «Data di entrata in vigore» di questa pagina e, se l’ambito della raccolta dei dati cambia effettivamente, La informeremo nell’App. L’uso continuato dell’App implica l’accettazione dell’informativa aggiornata; in caso contrario, interrompa l’utilizzo.'],
['h','10. Contatti'],
['contact',['**E-mail di contatto per la privacy:** xieh6888@gmail.com','Gestiremo le richieste tempestivamente e risponderemo entro un termine ragionevole.']]
]},
pt:{dir:'ltr',title:'Política de Privacidade',footer:'© 2026 EditBook-AudioEditor · All rights reserved.',blocks:[
['meta',[['Produto: ','EditBook-AudioEditor'],['Última atualização: ','17 de novembro de 2026'],['Data de vigência: ','17 de novembro de 2026']]],
['p','O EditBook-AudioEditor (o “Aplicativo”) é fornecido por Mr. Xie (“nós”). O Aplicativo é uma ferramenta local de edição de áudio e não exige conta. Esta política explica como o Aplicativo trata e protege suas informações e como você pode gerenciar os dados locais e as permissões do sistema.'],
['p','Se tiver qualquer dúvida sobre esta política, entre em contato pelo e-mail xieh6888@gmail.com.'],
['h','1. Como as informações são tratadas'],
['p','O Aplicativo não exige que você registre uma conta nem que forneça nome, número de telefone ou outras informações pessoais sem relação com a edição de áudio.'],
['p','Os arquivos de áudio que você importa, o áudio gravado com o microfone, os projetos de edição e os resultados exportados são todos processados e armazenados localmente no seu dispositivo. Não os enviamos aos nossos servidores e não podemos acessá-los, lê-los nem fazer backup deles remotamente.'],
['p','A versão atual não integra serviços de terceiros de publicidade, estatísticas, monitoramento de falhas, assinatura ou compras no aplicativo; portanto, não coleta identificadores do dispositivo nem dados de uso para essas finalidades. Se uma versão futura incluir esses serviços, atualizaremos esta política antes e, quando necessário, obteremos seu consentimento conforme a lei.'],
['h','2. Dados tratados localmente'],
['p','As funções principais do Aplicativo são executadas no seu dispositivo. Os dados a seguir ficam apenas no seu dispositivo:'],
['table',{head:['Tipo de dados','Local','Finalidade'],rows:[
['Arquivos de áudio que você importa','Seu dispositivo','Cortar, editar e exportar'],
['Áudio gravado com o microfone','Seu dispositivo','Salvo no projeto atual para edição'],
['Projetos de edição, parâmetros e arquivos exportados','Seu dispositivo','Guardar seu progresso e resultados']]}],
['p','Você pode excluir esses dados locais apagando projetos individuais, limpando os dados do Aplicativo ou desinstalando-o.'],
['h','3. Permissões do Aplicativo'],
['p','O Aplicativo solicita uma permissão apenas quando você usa ativamente a função correspondente. Recusar uma permissão não afeta as demais funções.'],
['table',{head:['Permissão','Finalidade','Obrigatória?'],rows:[
['Microfone','Captura áudio somente quando você toca na função de gravação; as gravações ficam salvas apenas no projeto local','Obrigatória para gravar; pode ser recusada'],
['Acesso a arquivos / mídia','Lê os arquivos de áudio ou mídia que você seleciona, somente quando os escolhe, para importação e edição','Obrigatória para importar; pode ser recusada']]}],
['p','A permissão de microfone não é solicitada na abertura do aplicativo; o aviso do sistema aparece apenas quando você abre e aciona a gravação. Você pode revisar, alterar ou revogar as permissões a qualquer momento em Ajustes do iOS.'],
['h','4. Serviços de terceiros'],
['p','A versão atual não integra SDKs ou serviços externos de terceiros, incluindo publicidade, estatísticas, monitoramento de falhas, gerenciamento de assinaturas, login social e notificações push. Assim, nenhuma informação do dispositivo, dado de uso ou conteúdo de áudio é enviado a servidores externos por meio de serviços de terceiros.'],
['p','Se uma versão futura precisar de serviços de terceiros, atualizaremos esta política antes da integração, os divulgaremos nas informações de privacidade da App Store e seguiremos os procedimentos de aviso e consentimento exigidos por lei (se aplicável).'],
['h','5. Armazenamento e segurança'],
['p','O Aplicativo não envia dados de usuários aos nossos servidores. Seu áudio, suas gravações e os dados dos projetos ficam armazenados apenas no seu dispositivo iOS. Recomendamos que você mantenha o dispositivo e os backups em segurança e gerencie, conforme necessário, a retenção e a exclusão dos arquivos de projeto locais.'],
['h','6. Compartilhamento, transferência e divulgação'],
['p','Não vendemos, alugamos nem compartilhamos suas informações pessoais para fins de publicidade. Como o Aplicativo não coleta informações pessoais que identifiquem você nem transmite áudio aos nossos servidores, não há compartilhamento de suas informações pessoais com terceiros.'],
['p','Somente nos casos a seguir podemos colaborar conforme a lei:'],
['ol',['Quando exigido por leis, regulamentos ou autoridades judiciais ou administrativas;','Para proteger a vida, o patrimônio ou outros interesses legítimos relevantes seus ou de terceiros quando for difícil obter seu consentimento.']],
['h','7. Seus direitos'],
['p','Como o Aplicativo não precisa de conta e os dados ficam armazenados localmente, você tem controle direto sobre eles:'],
['ul',['Excluir áudio, gravações e dados de projetos locais apagando projetos, limpando os dados do Aplicativo ou desinstalando-o;','Desativar ou ajustar as permissões de microfone e de acesso a arquivos/mídia do Aplicativo em Ajustes do iOS;','Entrar em contato pelo e-mail xieh6888@gmail.com para dúvidas ou reclamações sobre esta política.']],
['p','Como não conseguimos localizar suas informações por meio de uma conta e não mantemos seus dados de áudio, algumas solicitações podem não ser atendidas porque os dados não existem conosco. Agradecemos a compreensão.'],
['h','8. Proteção de menores'],
['p','O Aplicativo é destinado principalmente a adultos. Se você tem menos de 14 anos, use-o apenas com o consentimento e a orientação de seus pais ou responsáveis. O Aplicativo não coleta ativamente informações pessoais de crianças; como o áudio fica armazenado apenas localmente, não podemos identificar ou excluir remotamente os dados locais de um usuário específico. Responsáveis com dúvidas podem escrever para xieh6888@gmail.com.'],
['h','9. Alterações nesta política'],
['p','Podemos revisar esta política periodicamente. Atualizaremos a “Última atualização” e a “Data de vigência” desta página e, se o escopo da coleta de dados realmente mudar, avisaremos você no Aplicativo. O uso continuado do Aplicativo significa que você aceita a política atualizada; caso contrário, interrompa o uso.'],
['h','10. Fale conosco'],
['contact',['**E-mail de contato sobre privacidade:** xieh6888@gmail.com','Trataremos as solicitações com agilidade e responderemos em prazo razoável.']]
]},
id:{dir:'ltr',title:'Kebijakan Privasi',footer:'© 2026 EditBook-AudioEditor · All rights reserved.',blocks:[
['meta',[['Produk: ','EditBook-AudioEditor'],['Terakhir diperbarui: ','17 November 2026'],['Tanggal berlaku: ','17 November 2026']]],
['p','EditBook-AudioEditor (“Aplikasi”) disediakan oleh Mr. Xie (“kami”). Aplikasi ini adalah alat penyuntingan audio lokal dan tidak memerlukan akun. Kebijakan ini menjelaskan cara Aplikasi memproses dan melindungi informasi Anda, serta cara Anda mengelola data lokal dan izin sistem.'],
['p','Jika Anda memiliki pertanyaan tentang kebijakan ini, hubungi kami di xieh6888@gmail.com.'],
['h','1. Cara informasi diproses'],
['p','Aplikasi tidak meminta Anda mendaftarkan akun, dan tidak meminta nama, nomor telepon, atau informasi pribadi lain yang tidak berkaitan dengan penyuntingan audio.'],
['p','File audio yang Anda impor, audio yang Anda rekam dengan mikrofon, proyek suntingan, dan hasil ekspor semuanya diproses dan disimpan secara lokal di perangkat Anda. Kami tidak mengunggahnya ke server kami dan tidak dapat mengakses, membaca, atau mencadangkannya dari jarak jauh.'],
['p','Versi saat ini tidak mengintegrasikan layanan pihak ketiga untuk iklan, analitik, pemantauan kerusakan, langganan, atau pembelian dalam aplikasi, sehingga tidak mengumpulkan pengenal perangkat atau data penggunaan untuk tujuan tersebut. Jika versi mendatang menambahkan layanan semacam itu, kami akan memperbarui kebijakan ini terlebih dahulu dan, bila perlu, memperoleh persetujuan Anda sesuai hukum.'],
['h','2. Data yang diproses secara lokal'],
['p','Fitur inti Aplikasi berjalan di perangkat Anda. Data berikut hanya tersimpan di perangkat Anda:'],
['table',{head:['Jenis data','Lokasi','Tujuan'],rows:[
['File audio yang Anda impor','Perangkat Anda','Memotong, menyunting, dan mengekspor'],
['Audio yang direkam dengan mikrofon','Perangkat Anda','Disimpan ke proyek saat ini untuk disunting'],
['Proyek suntingan, parameter, dan file hasil ekspor','Perangkat Anda','Menyimpan kemajuan dan hasil kerja Anda']]}],
['p','Anda dapat menghapus data lokal tersebut dengan menghapus proyek tertentu, menghapus data Aplikasi, atau menghapus instalan Aplikasi.'],
['h','3. Izin Aplikasi'],
['p','Aplikasi hanya meminta izin ketika Anda secara aktif menggunakan fitur terkait. Menolak izin tidak memengaruhi fitur lain.'],
['table',{head:['Izin','Tujuan','Wajib?'],rows:[
['Mikrofon','Merekam audio hanya saat Anda mengetuk fitur rekam; rekaman hanya disimpan di proyek lokal','Wajib untuk merekam; dapat ditolak'],
['Akses file / media','Membaca file audio atau media yang Anda pilih, hanya saat Anda memilihnya, untuk impor dan penyuntingan','Wajib untuk impor; dapat ditolak']]}],
['p','Izin mikrofon tidak diminta saat Aplikasi dibuka; perintah sistem hanya muncul saat Anda membuka dan memicu perekaman. Anda dapat meninjau, mengubah, atau mencabut izin kapan saja di Pengaturan iOS.'],
['h','4. Layanan pihak ketiga'],
['p','Versi saat ini tidak mengintegrasikan SDK atau layanan eksternal pihak ketiga, termasuk iklan, analitik, pemantauan kerusakan, pengelolaan langganan, login sosial, dan layanan push. Dengan demikian, tidak ada informasi perangkat, data penggunaan, atau konten audio yang dikirim ke server eksternal melalui layanan pihak ketiga.'],
['p','Jika versi mendatang memerlukan layanan pihak ketiga, kami akan memperbarui kebijakan ini sebelum integrasi, mengungkapkannya dalam informasi privasi App Store, dan mengikuti prosedur pemberitahuan serta persetujuan sesuai hukum (jika berlaku).'],
['h','5. Penyimpanan dan keamanan'],
['p','Aplikasi tidak mengunggah data pengguna ke server kami. Audio, rekaman, dan data proyek Anda hanya disimpan di perangkat iOS Anda. Kami menyarankan Anda menjaga keamanan perangkat dan cadangan, serta mengelola sendiri penyimpanan dan penghapusan file proyek lokal sesuai kebutuhan.'],
['h','6. Pembagian, pengalihan, dan pengungkapan'],
['p','Kami tidak menjual, menyewakan, atau membagikan informasi pribadi Anda untuk tujuan periklanan. Karena Aplikasi tidak mengumpulkan informasi pribadi yang mengidentifikasi Anda dan tidak mengirim audio ke server kami, tidak ada pembagian informasi pribadi Anda kepada pihak ketiga.'],
['p','Kami hanya dapat bekerja sama sesuai hukum dalam hal berikut:'],
['ol',['Jika diwajibkan oleh hukum, peraturan, atau otoritas yudisial maupun administratif;','Untuk melindungi jiwa, harta, atau kepentingan sah penting lainnya milik Anda atau orang lain ketika persetujuan sulit diperoleh.']],
['h','7. Hak Anda'],
['p','Karena Aplikasi tidak memerlukan akun dan data disimpan secara lokal, Anda memiliki kendali langsung atas data Anda:'],
['ul',['Menghapus audio, rekaman, dan data proyek lokal dengan menghapus proyek, menghapus data Aplikasi, atau menghapus instalan Aplikasi;','Menonaktifkan atau menyesuaikan izin mikrofon dan akses file/media Aplikasi di Pengaturan iOS;','Menghubungi kami di xieh6888@gmail.com untuk pertanyaan atau keluhan terkait kebijakan ini.']],
['p','Karena kami tidak dapat menemukan informasi Anda melalui akun dan tidak menyimpan data audio Anda, sebagian permintaan mungkin tidak dapat dipenuhi karena datanya tidak ada pada kami. Terima kasih atas pengertian Anda.'],
['h','8. Perlindungan anak di bawah umur'],
['p','Aplikasi ini terutama ditujukan untuk orang dewasa. Jika Anda berusia di bawah 14 tahun, gunakan hanya dengan persetujuan dan bimbingan orang tua atau wali. Aplikasi tidak secara aktif mengumpulkan informasi pribadi anak; karena audio hanya disimpan secara lokal, kami tidak dapat mengidentifikasi atau menghapus data lokal pengguna tertentu dari jarak jauh. Wali yang memiliki pertanyaan dapat menghubungi xieh6888@gmail.com.'],
['h','9. Perubahan kebijakan ini'],
['p','Kami dapat merevisi kebijakan ini dari waktu ke waktu. Kami akan memperbarui “Terakhir diperbarui” dan “Tanggal berlaku” pada halaman ini dan, jika cakupan pengumpulan data benar-benar berubah, memberi tahu Anda di dalam Aplikasi. Penggunaan Aplikasi yang berkelanjutan berarti Anda menyetujui kebijakan yang diperbarui; jika tidak, harap hentikan penggunaan.'],
['h','10. Hubungi kami'],
['contact',['**Email kontak privasi:** xieh6888@gmail.com','Kami akan menangani permintaan dengan cepat dan membalas dalam jangka waktu yang wajar.']]
]},
tr:{dir:'ltr',title:'Gizlilik Politikası',footer:'© 2026 EditBook-AudioEditor · All rights reserved.',blocks:[
['meta',[['Ürün: ','EditBook-AudioEditor'],['Son güncelleme: ','17 Kasım 2026'],['Yürürlük tarihi: ','17 Kasım 2026']]],
['p','EditBook-AudioEditor (“Uygulama”) Mr. Xie (“biz”) tarafından sunulmaktadır. Uygulama yerel bir ses düzenleme aracıdır ve hesap gerektirmez. Bu politika, Uygulamanın bilgilerinizi nasıl işlediğini ve koruduğunu, ayrıca yerel verileri ve sistem izinlerini nasıl yönetebileceğinizi açıklar.'],
['p','Bu politikayla ilgili sorularınız için xieh6888@gmail.com adresinden bize ulaşabilirsiniz.'],
['h','1. Bilgilerin işlenme biçimi'],
['p','Uygulama sizden hesap oluşturmanızı veya adınız, telefon numaranız gibi ses düzenlemeyle ilgisiz kişisel bilgilerinizi vermenizi istemez.'],
['p','İçe aktardığınız ses dosyaları, mikrofonla kaydettiğiniz sesler, düzenleme projeleri ve dışa aktarılan sonuçların tümü cihazınızda yerel olarak işlenir ve saklanır. Bunları sunucularımıza yüklemeyiz; uzaktan erişemez, okuyamaz veya yedekleyemeyiz.'],
['p','Mevcut sürüm; üçüncü taraf reklam, istatistik analizi, çökme izleme, abonelik veya uygulama içi satın alma hizmetlerini entegre etmez, dolayısıyla bu amaçlarla cihaz tanımlayıcıları veya kullanım verileri toplamaz. Gelecekteki bir sürüm bu tür hizmetleri eklerse bu politikayı önceden güncelleriz ve gerektiğinde yasaların öngördüğü şekilde onayınızı alırız.'],
['h','2. Yerel olarak işlenen veriler'],
['p','Uygulamanın temel işlevleri cihazınızda çalışır. Aşağıdaki veriler yalnızca cihazınızda kalır:'],
['table',{head:['Veri türü','Konum','Amaç'],rows:[
['İçe aktardığınız ses dosyaları','Cihazınız','Kesme, düzenleme ve dışa aktarma'],
['Mikrofonla kaydedilen ses','Cihazınız','Düzenleme için geçerli projeye kaydedilir'],
['Düzenleme projeleri, parametreleri ve dışa aktarılan dosyalar','Cihazınız','İlerlemenizi ve sonuçlarınızı saklama']]}],
['p','Bu yerel verileri tek tek projeleri silerek, uygulama verilerini temizleyerek veya Uygulamayı kaldırarak silebilirsiniz.'],
['h','3. Uygulama izinleri'],
['p','Uygulama, yalnızca ilgili işlevi siz etkin olarak kullandığınızda izin ister. Bir izni reddetmek diğer işlevleri etkilemez.'],
['table',{head:['İzin','Amaç','Zorunlu mu?'],rows:[
['Mikrofon','Yalnızca kayıt işlevine dokunduğunuzda ses alır; kayıtlar yalnızca yerel projede saklanır','Kayıt için zorunlu; reddedilebilir'],
['Dosya / medya erişimi','Yalnızca siz seçtiğinizde, seçtiğiniz ses veya medya dosyalarını içe aktarma ve düzenleme için okur','İçe aktarma için zorunlu; reddedilebilir']]}],
['p','Mikrofon izni uygulama açılışında istenmez; sistem istemi yalnızca kayıt işlevini açıp tetiklediğinizde görünür. İzinleri istediğiniz zaman iOS Ayarları’ndan inceleyebilir, değiştirebilir veya geri çekebilirsiniz.'],
['h','4. Üçüncü taraf hizmetleri'],
['p','Mevcut sürüm; reklam, istatistik analizi, çökme izleme, abonelik yönetimi, sosyal oturum açma ve push hizmetleri dâhil hiçbir üçüncü taraf SDK’sını veya harici hizmeti entegre etmez. Bu nedenle üçüncü taraf hizmetler aracılığıyla harici sunuculara cihaz bilgisi, kullanım verisi veya ses içeriği iletilmez.'],
['p','Gelecekteki bir sürüm üçüncü taraf hizmetleri gerektirirse entegrasyondan önce bu politikayı güncelleriz, App Store gizlilik bilgilerinde açıklarız ve yasaların gerektirdiği bilgilendirme ve onay prosedürlerini uygularız (uygulanabilirse).'],
['h','5. Saklama ve güvenlik'],
['p','Uygulama, kullanıcı verilerini sunucularımıza yüklemez. Ses içeriğiniz, kayıtlarınız ve proje verileriniz yalnızca iOS cihazınızda saklanır. Cihazınızı ve yedeklerinizi güvende tutmanızı, yerel proje dosyalarının saklanmasını ve silinmesini ihtiyaç duydukça kendiniz yönetmenizi öneririz.'],
['h','6. Paylaşım, aktarım ve açıklama'],
['p','Kişisel bilgilerinizi satmaz, kiralamaz ve reklam amacıyla paylaşmayız. Uygulama sizi tanımlayan kişisel bilgileri toplamadığından ve ses içeriğini sunucularımıza iletmediğinden, kişisel bilgilerinizin üçüncü taraflarla paylaşılması söz konusu değildir.'],
['p','Yalnızca aşağıdaki durumlarda yasalar çerçevesinde iş birliği yapabiliriz:'],
['ol',['Yasa, düzenleme veya yargı ya da idari makamların zorunlu talebi olduğunda;','Onayınızı almanın güç olduğu durumlarda sizin veya başkalarının hayatını, mal varlığını ya da diğer önemli meşru menfaatlerini korumak için.']],
['h','7. Haklarınız'],
['p','Uygulama hesap gerektirmediğinden ve veriler yerel olarak saklandığından, verileriniz üzerinde doğrudan kontrole sahipsiniz:'],
['ul',['Projeleri silerek, uygulama verilerini temizleyerek veya Uygulamayı kaldırarak yerel ses, kayıt ve proje verilerini silebilirsiniz;','iOS Ayarları’nda Uygulamanın mikrofon ve dosya/medya erişim izinlerini kapatabilir veya düzenleyebilirsiniz;','Bu politikayla ilgili soru veya şikâyetleriniz için xieh6888@gmail.com adresinden bize ulaşabilirsiniz.']],
['p','Bilgilerinizi hesap üzerinden bulamadığımız ve ses verilerinizi elimizde tutmadığımız için, bazı talepler verilerin bizde bulunmaması nedeniyle yerine getirilemeyebilir. Anlayışınız için teşekkür ederiz.'],
['h','8. Küçüklerin korunması'],
['p','Uygulama ağırlıklı olarak yetişkinlere yöneliktir. 14 yaşından küçükseniz lütfen yalnızca ebeveyn veya vasinizin izni ve rehberliğinde kullanın. Uygulama çocukların kişisel bilgilerini aktif olarak toplamaz; ses yalnızca yerel olarak saklandığından belirli bir kullanıcının yerel verilerini uzaktan tespit edemez veya silemeyiz. Sorusu olan vasiler xieh6888@gmail.com adresine yazabilir.'],
['h','9. Bu politikadaki değişiklikler'],
['p','Bu politikayı zaman zaman revize edebiliriz. Bu sayfadaki “Son güncelleme” ve “Yürürlük tarihi”ni güncelleriz ve veri toplama kapsamı gerçekten değişirse sizi Uygulama içinde bilgilendiririz. Uygulamayı kullanmaya devam etmeniz güncellenmiş politikayı kabul ettiğiniz anlamına gelir; kabul etmiyorsanız lütfen kullanımı bırakın.'],
['h','10. Bize ulaşın'],
['contact',['**Gizlilik iletişim e-postası:** xieh6888@gmail.com','Talepleri hızla işleme alır ve makul bir süre içinde yanıt veririz.']]
]},
vi:{dir:'ltr',title:'Chính sách quyền riêng tư',footer:'© 2026 EditBook-AudioEditor · All rights reserved.',blocks:[
['meta',[['Sản phẩm: ','EditBook-AudioEditor'],['Cập nhật lần cuối: ','17 tháng 11 năm 2026'],['Ngày có hiệu lực: ','17 tháng 11 năm 2026']]],
['p','EditBook-AudioEditor (“Ứng dụng”) được cung cấp bởi Mr. Xie (“chúng tôi”). Ứng dụng là công cụ chỉnh sửa âm thanh cục bộ và không yêu cầu tài khoản. Chính sách này giải thích cách Ứng dụng xử lý và bảo vệ thông tin của bạn, cũng như cách bạn quản lý dữ liệu cục bộ và quyền hệ thống.'],
['p','Nếu có bất kỳ câu hỏi nào về chính sách này, hãy liên hệ chúng tôi tại xieh6888@gmail.com.'],
['h','1. Cách xử lý thông tin'],
['p','Ứng dụng không yêu cầu bạn đăng ký tài khoản, cũng không yêu cầu cung cấp tên, số điện thoại hoặc thông tin cá nhân khác không liên quan đến chỉnh sửa âm thanh.'],
['p','Các tệp âm thanh bạn nhập, âm thanh bạn ghi bằng micrô, dự án chỉnh sửa và kết quả xuất đều được xử lý và lưu cục bộ trên thiết bị của bạn. Chúng tôi không tải chúng lên máy chủ và không thể truy cập, đọc hay sao lưu chúng từ xa.'],
['p','Phiên bản hiện tại không tích hợp dịch vụ bên thứ ba về quảng cáo, thống kê phân tích, giám sát sự cố, đăng ký hoặc mua trong ứng dụng, do đó không thu thập mã nhận dạng thiết bị hay dữ liệu sử dụng cho các mục đích đó. Nếu phiên bản tương lai bổ sung các dịch vụ này, chúng tôi sẽ cập nhật chính sách trước và, khi cần, xin sự đồng ý của bạn theo quy định pháp luật.'],
['h','2. Dữ liệu được xử lý cục bộ'],
['p','Các tính năng cốt lõi của Ứng dụng chạy trên thiết bị của bạn. Dữ liệu sau chỉ được lưu trên thiết bị của bạn:'],
['table',{head:['Loại dữ liệu','Vị trí','Mục đích'],rows:[
['Tệp âm thanh bạn nhập','Thiết bị của bạn','Cắt, chỉnh sửa và xuất'],
['Âm thanh ghi bằng micrô','Thiết bị của bạn','Lưu vào dự án hiện tại để chỉnh sửa'],
['Dự án chỉnh sửa, thông số và tệp đã xuất','Thiết bị của bạn','Lưu tiến độ và thành quả của bạn']]}],
['p','Bạn có thể xóa dữ liệu cục bộ này bằng cách xóa từng dự án, xóa dữ liệu Ứng dụng hoặc gỡ cài đặt Ứng dụng.'],
['h','3. Quyền của Ứng dụng'],
['p','Ứng dụng chỉ yêu cầu quyền khi bạn chủ động sử dụng tính năng tương ứng. Từ chối quyền không ảnh hưởng đến các tính năng khác.'],
['table',{head:['Quyền','Mục đích','Có bắt buộc?'],rows:[
['Micrô','Chỉ ghi âm khi bạn nhấn tính năng ghi âm; bản ghi chỉ được lưu trong dự án cục bộ','Bắt buộc để ghi âm; có thể từ chối'],

['p','Quyền micrô không được yêu cầu khi khởi chạy Ứng dụng; hộp thoại hệ thống chỉ xuất hiện khi bạn mở và kích hoạt tính năng ghi âm. Bạn có thể xem, thay đổi hoặc thu hồi quyền bất cứ lúc nào trong Cài đặt iOS.'],
['h','4. Dịch vụ bên thứ ba'],
['p','Phiên bản hiện tại không tích hợp SDK hay dịch vụ bên ngoài của bên thứ ba, bao gồm quảng cáo, thống kê phân tích, giám sát sự cố, quản lý đăng ký, đăng nhập mạng xã hội và dịch vụ push. Do đó, không có thông tin thiết bị, dữ liệu sử dụng hay nội dung âm thanh nào được gửi đến máy chủ bên ngoài thông qua dịch vụ bên thứ ba.'],
['p','Nếu phiên bản tương lai cần dịch vụ bên thứ ba, chúng tôi sẽ cập nhật chính sách trước khi tích hợp, công bố trong thông tin quyền riêng tư trên App Store và thực hiện thủ tục thông báo, xin đồng ý theo quy định pháp luật (nếu áp dụng).'],
['h','5. Lưu trữ và bảo mật'],
['p','Ứng dụng không tải dữ liệu người dùng lên máy chủ của chúng tôi. Nội dung âm thanh, bản ghi và dữ liệu dự án của bạn chỉ được lưu trên thiết bị iOS của bạn. Chúng tôi khuyên bạn giữ an toàn cho thiết bị và bản sao lưu, đồng thời tự quản lý việc lưu giữ và xóa các tệp dự án cục bộ khi cần.'],
['h','6. Chia sẻ, chuyển giao và công bố'],

['ol',['Khi luật, quy định hoặc cơ quan tư pháp, hành chính yêu cầu bắt buộc;','Để bảo vệ tính mạng, tài sản hoặc lợi ích hợp pháp quan trọng khác của bạn hay người khác khi khó xin được sự đồng ý của bạn.']],
['h','7. Quyền của bạn'],
['p','Vì Ứng dụng không cần tài khoản và dữ liệu được lưu cục bộ, bạn có quyền kiểm soát trực tiếp dữ liệu của mình:'],
['ul',['Xóa âm thanh, bản ghi và dữ liệu dự án cục bộ bằng cách xóa dự án, xóa dữ liệu Ứng dụng hoặc gỡ cài đặt Ứng dụng;','Tắt hoặc điều chỉnh quyền micrô và quyền truy cập tệp/phương tiện của Ứng dụng trong Cài đặt iOS;','Liên hệ chúng tôi tại xieh6888@gmail.com với các câu hỏi hoặc khiếu nại liên quan đến chính sách này.']],
['p','Vì chúng tôi không thể xác định thông tin của bạn qua tài khoản và không nắm giữ dữ liệu âm thanh của bạn, một số yêu cầu có thể không thực hiện được do dữ liệu không tồn tại ở chúng tôi. Rất mong bạn thông cảm.'],
['h','8. Bảo vệ người chưa thành niên'],
['p','Ứng dụng chủ yếu dành cho người trưởng thành. Nếu bạn dưới 14 tuổi, vui lòng chỉ sử dụng khi có sự đồng ý và hướng dẫn của cha mẹ hoặc người giám hộ. Ứng dụng không chủ động thu thập thông tin cá nhân của trẻ em; vì âm thanh chỉ lưu cục bộ, chúng tôi không thể nhận diện hay xóa từ xa dữ liệu cục bộ của một người dùng cụ thể. Người giám hộ có thắc mắc có thể liên hệ xieh6888@gmail.com.'],

['contact',['**Email liên hệ về quyền riêng tư:** xieh6888@gmail.com','Chúng tôi sẽ xử lý yêu cầu nhanh chóng và phản hồi trong thời hạn hợp lý.']]

['p','Импортированные вами аудиофайлы, записи с микрофона, проекты редактирования и результаты экспорта обрабатываются и хранятся локально на вашем устройстве. Мы не загружаем их на наши серверы и не можем удалённо получать к ним доступ, читать или резервировать их.'],
['p','Текущая версия не использует сторонние сервисы рекламы, статистики, мониторинга сбоев, подписок или встроенных покупок, поэтому не собирает идентификаторы устройства и данные об использовании для этих целей. Если будущая версия добавит такие сервисы, мы заранее обновим эту политику и при необходимости получим ваше согласие в соответствии с законом.'],
['h','2. Данные, обрабатываемые локально'],
['p','Основные функции Приложения выполняются на вашем устройстве. Следующие данные хранятся только на вашем устройстве:'],
['table',{head:['Тип данных','Местоположение','Назначение'],rows:[

['p','Вы можете удалить эти локальные данные, удалив отдельные проекты, очистив данные Приложения или удалив само Приложение.'],

['p','Разрешение на микрофон не запрашивается при запуске Приложения; системный запрос появляется только когда вы открываете и запускаете запись. Вы можете в любое время просмотреть, изменить или отозвать разрешения в «Настройках» iOS.'],

['p','Приложение не загружает пользовательские данные на наши серверы. Ваш аудиоконтент, записи и данные проектов хранятся только на вашем устройстве iOS. Рекомендуем беречь устройство и резервные копии и самостоятельно управлять хранением и удалением локальных файлов проектов.'],
['h','6. Передача, перемещение и раскрытие информации'],
['p','Мы не продаём, не сдаём в аренду и не передаём вашу личную информацию в рекламных целях. Поскольку Приложение не собирает личную информацию, позволяющую вас идентифицировать, и не передаёт аудио на наши серверы, передачи вашей личной информации третьим лицам не происходит.'],
['p','Только в следующих случаях мы можем содействовать в соответствии с законом:'],
['ol',['Когда этого требуют законы, нормативные акты или судебные либо административные органы;','Для защиты жизни, имущества или иных существенных законных интересов вас или других лиц, когда получить ваше согласие затруднительно.']],
['h','7. Ваши права'],
['p','Поскольку Приложению не нужна учётная запись, а данные хранятся локально, вы напрямую контролируете свои данные:'],
['ul',['Удалить локальные аудио, записи и данные проектов, удалив проекты, очистив данные Приложения или удалив Приложение;','Отключить или изменить разрешения Приложения на микрофон и доступ к файлам/медиа в «Настройках» iOS;','Связаться с нами по адресу xieh6888@gmail.com с вопросами или жалобами по этой политике.']],
['p','Поскольку мы не можем найти вашу информацию по учётной записи и не храним ваши аудиоданные, некоторые запросы могут быть невыполнимы из-за отсутствия данных у нас. Благодарим за понимание.'],
['h','8. Защита несовершеннолетних'],
['p','Приложение предназначено в основном для взрослых. Если вам меньше 14 лет, используйте его только с согласия и под руководством родителей или опекунов. Приложение не собирает активно личную информацию детей; поскольку аудио хранится только локально, мы не можем удалённо идентифицировать или удалить локальные данные конкретного пользователя. Опекуны с вопросами могут написать на xieh6888@gmail.com.'],
['h','9. Изменения настоящей политики'],
['p','Мы можем периодически пересматривать эту политику. Мы обновим «Дату обновления» и «Дату вступления в силу» на этой странице и, если объём сбора данных действительно изменится, уведомим вас в Приложении. Продолжение использования Приложения означает согласие с обновлённой политикой; если вы не согласны, прекратите использование.'],
['h','10. Связаться с нами'],
['contact',['**Электронная почта по вопросам конфиденциальности:** xieh6888@gmail.com','Мы оперативно обработаем запросы и ответим в разумный срок.']]

['h','2. البيانات المعالَجة محليًا'],
['p','تُنفَّذ الميزات الأساسية للتطبيق على جهازك. تُحفظ البيانات التالية على جهازك فقط:'],
['table',{head:['نوع البيانات','الموقع','الغرض'],rows:[

['مشاريع التحرير ومعاملاتها والملفات المصدَّرة','جهازك','حفظ تقدمك ونتائجك']]}],
['p','يمكنك حذف هذه البيانات المحلية بحذف المشاريع الفردية أو مسح بيانات التطبيق أو إلغاء تثبيته.'],

['p','يطلب التطبيق الإذن فقط عندما تستخدم الميزة المرتبطة به بنفسك. ولا يؤثر رفض الإذن على الميزات الأخرى.'],
['table',{head:['الإذن','الغرض','مطلوب؟'],rows:[

['الوصول إلى الملفات / الوسائط','يقرأ ملفات الصوت أو الوسائط التي تحددها أنت فقط عند اختيارها، للاستيراد والتحرير','مطلوب للاستيراد؛ يمكن رفضه']]}],
['p','لا يُطلب إذن الميكروفون عند تشغيل التطبيق؛ وتظهر مطالبة النظام فقط عند فتح التسجيل وتشغيله. ويمكنك مراجعة الأذونات أو تغييرها أو إلغاؤها في أي وقت من «الإعدادات» في iOS.'],

['h','5. التخزين والأمان'],
['p','لا يرفع التطبيق بيانات المستخدمين إلى خوادمنا. يُخزَّن محتوى الصوت والتسجيلات وبيانات المشاريع على جهاز iOS الخاص بك فقط. نوصيك بالحفاظ على أمان جهازك ونسخك الاحتياطية، وبإدارة الاحتفاظ بملفات المشاريع المحلية وحذفها بنفسك حسب الحاجة.'],
['h','6. المشاركة والنقل والإفصاح'],

['ul',['حذف الصوت والتسجيلات وبيانات المشاريع المحلية بحذف المشاريع أو مسح بيانات التطبيق أو إلغاء تثبيته؛','إيقاف أو تعديل أذونات الميكروفون والوصول إلى الملفات/الوسائط للتطبيق في «الإعدادات» في iOS؛','التواصل معنا على xieh6888@gmail.com لطرح الأسئلة أو الشكاوى المتعلقة بهذه السياسة.']],
['p','بما أننا لا نستطيع تحديد معلوماتك عبر حساب ولا نحتفظ ببيانات الصوت الخاصة بك، فقد يتعذر تنفيذ بعض الطلبات لعدم وجود البيانات لدينا. نشكرك على تفهمك.'],

['p','التطبيق موجّه بشكل أساسي للبالغين. إذا كنت دون 14 عامًا، فيُرجى استخدامه فقط بموافقة وتوجيه أحد والديك أو وليّ أمرك. لا يجمع التطبيق بشكل استباقي معلومات شخصية عن الأطفال؛ وبما أن الصوت يُخزَّن محليًا فقط، فلا يمكننا التعرف عن بُعد على بيانات مستخدم معين المحلية أو حذفها. يمكن للأولياء الذين لديهم أسئلة التواصل على xieh6888@gmail.com.'],

hi:{dir:'ltr',title:'गोपनीयता नीति',footer:'© 2026 EditBook-AudioEditor · All rights reserved.',blocks:[
['meta',[['उत्पाद: ','EditBook-AudioEditor'],['अंतिम अद्यतन: ','17 नवंबर 2026'],['प्रभावी तिथि: ','17 नवंबर 2026']]],
['p','EditBook-AudioEditor (“ऐप”) Mr. Xie (“हम”) द्वारा प्रदान किया जाता है। यह ऐप एक स्थानीय ऑडियो एडिटिंग टूल है और इसके लिए खाते की आवश्यकता नहीं है। यह नीति बताती है कि ऐप आपकी जानकारी को कैसे संसाधित और सुरक्षित करता है, और आप स्थानीय डेटा व सिस्टम अनुमतियों को कैसे प्रबंधित कर सकते हैं।'],
['p','इस नीति के बारे में कोई प्रश्न हो तो xieh6888@gmail.com पर हमसे संपर्क करें।'],
['h','1. जानकारी का संचालन'],
['p','ऐप आपसे खाता पंजीकृत करने के लिए नहीं कहता, और न ही आपका नाम, फ़ोन नंबर या ऑडियो संपादन से असंबंधित अन्य व्यक्तिगत जानकारी माँगता है।'],
['p','आपके द्वारा आयात की गई ऑडियो फ़ाइलें, माइक्रोफ़ोन से रिकॉर्ड किया गया ऑडियो, संपादन प्रोजेक्ट और निर्यात परिणाम सभी आपके डिवाइस पर ही संसाधित और सहेजे जाते हैं। हम इन्हें अपने सर्वर पर अपलोड नहीं करते और न ही दूर से इन तक पहुँच सकते, पढ़ सकते या बैकअप ले सकते हैं।'],
['p','वर्तमान संस्करण में तृतीय-पक्ष विज्ञापन, उपयोग विश्लेषण, क्रैश निगरानी, सदस्यता या ऐप-भीतर खरीद सेवाएँ एकीकृत नहीं हैं, इसलिए इन उद्देश्यों के लिए डिवाइस पहचानकर्ता या उपयोग डेटा एकत्र नहीं किया जाता। यदि भविष्य के संस्करण में ऐसी सेवाएँ जोड़ी गईं, तो हम पहले इस नीति को अद्यतन करेंगे और आवश्यक होने पर कानून के अनुसार आपकी सहमति लेंगे।'],
['h','2. स्थानीय रूप से संसाधित डेटा'],
['p','ऐप की मुख्य सुविधाएँ आपके डिवाइस पर चलती हैं। निम्नलिखित डेटा केवल आपके डिवाइस पर रहता है:'],
['table',{head:['डेटा का प्रकार','स्थान','उद्देश्य'],rows:[
['आपके द्वारा आयात की गई ऑडियो फ़ाइलें','आपका डिवाइस','काटना, संपादित करना और निर्यात करना'],
['माइक्रोफ़ोन से रिकॉर्ड किया गया ऑडियो','आपका डिवाइस','संपादन के लिए वर्तमान प्रोजेक्ट में सहेजा जाता है'],
['संपादन प्रोजेक्ट, पैरामीटर और निर्यात की गई फ़ाइलें','आपका डिवाइस','आपकी प्रगति और परिणाम सहेजना']]}],
['p','आप अलग-अलग प्रोजेक्ट हटाकर, ऐप डेटा साफ़ करके या ऐप अनइंस्टॉल करके इस स्थानीय डेटा को हटा सकते हैं।'],
['h','3. ऐप अनुमतियाँ'],
['p','ऐप केवल तभी अनुमति माँगता है जब आप संबंधित सुविधा स्वयं उपयोग करते हैं। किसी अनुमति को अस्वीकार करने से अन्य सुविधाएँ प्रभावित नहीं होतीं।'],
['table',{head:['अनुमति','उद्देश्य','आवश्यक?'],rows:[
['माइक्रोफ़ोन','केवल रिकॉर्डिंग सुविधा पर टैप करने पर ऑडियो कैप्चर करता है; रिकॉर्डिंग केवल स्थानीय प्रोजेक्ट में सहेजी जाती है','रिकॉर्डिंग के लिए आवश्यक; अस्वीकार किया जा सकता है'],
['फ़ाइल / मीडिया एक्सेस','केवल जब आप फ़ाइल चुनते हैं, तब आपकी चुनी हुई ऑडियो या मीडिया फ़ाइलें आयात और संपादन के लिए पढ़ता है','आयात के लिए आवश्यक; अस्वीकार किया जा सकता है']]}],
['p','माइक्रोफ़ोन अनुमति ऐप शुरू होने पर नहीं माँगी जाती; सिस्टम संकेत केवल तब दिखता है जब आप रिकॉर्डिंग खोलकर उसे शुरू करते हैं। आप किसी भी समय iOS “सेटिंग्स” में अनुमतियाँ देख, बदल या रद्द कर सकते हैं।'],
['h','4. तृतीय-पक्ष सेवाएँ'],
['p','वर्तमान संस्करण में कोई तृतीय-पक्ष SDK या बाहरी सेवा एकीकृत नहीं है, जिनमें विज्ञापन, उपयोग विश्लेषण, क्रैश निगरानी, सदस्यता प्रबंधन, सोशल लॉगिन और पुश सेवाएँ शामिल हैं। इसलिए तृतीय-पक्ष सेवाओं के माध्यम से डिवाइस जानकारी, उपयोग डेटा या ऑडियो सामग्री बाहरी सर्वर पर नहीं भेजी जाती।'],
['p','यदि भविष्य के संस्करण में तृतीय-पक्ष सेवाओं की आवश्यकता हुई, तो हम एकीकरण से पहले इस नीति को अद्यतन करेंगे, App Store की गोपनीयता जानकारी में उन्हें प्रकट करेंगे और कानून द्वारा अपेक्षित सूचना व सहमति प्रक्रियाओं का पालन करेंगे (यदि लागू हो)।'],
['h','5. संग्रहण और सुरक्षा'],
['p','ऐप उपयोगकर्ता डेटा हमारे सर्वर पर अपलोड नहीं करता। आपकी ऑडियो सामग्री, रिकॉर्डिंग और प्रोजेक्ट डेटा केवल आपके iOS डिवाइस पर संग्रहीत होते हैं। हम सुझाव देते हैं कि आप अपने डिवाइस और बैकअप को सुरक्षित रखें और आवश्यकता अनुसार स्थानीय प्रोजेक्ट फ़ाइलों के रखरखाव और हटाने का प्रबंधन स्वयं करें।'],
['h','6. साझाकरण, हस्तांतरण और प्रकटीकरण'],
['p','हम आपकी व्यक्तिगत जानकारी को न बेचते हैं, न किराए पर देते हैं और न विज्ञापन उद्देश्यों के लिए साझा करते हैं। चूँकि ऐप आपकी पहचान करने वाली व्यक्तिगत जानकारी एकत्र नहीं करता और ऑडियो सामग्री हमारे सर्वर पर नहीं भेजता, इसलिए आपकी व्यक्तिगत जानकारी तृतीय पक्षों के साथ साझा करने की कोई स्थिति नहीं है।'],
['p','केवल निम्नलिखित वैधानिक स्थितियों में हम कानून के अनुसार सहयोग कर सकते हैं:'],
['ol',['जब कानून, विनियम या न्यायिक अथवा प्रशासनिक प्राधिकरण अनिवार्य रूप से माँगें;','आपके या अन्य के जीवन, संपत्ति या अन्य महत्वपूर्ण वैध हितों की रक्षा के लिए, जब आपकी सहमति प्राप्त करना कठिन हो।']],
['h','7. आपके अधिकार'],
['p','चूँकि ऐप को खाते की आवश्यकता नहीं है और डेटा स्थानीय रूप से संग्रहीत है, आपका अपने डेटा पर सीधा नियंत्रण है:'],
['ul',['प्रोजेक्ट हटाकर, ऐप डेटा साफ़ करके या ऐप अनइंस्टॉल करके स्थानीय ऑडियो, रिकॉर्डिंग और प्रोजेक्ट डेटा हटाएँ;','iOS “सेटिंग्स” में ऐप की माइक्रोफ़ोन और फ़ाइल/मीडिया एक्सेस अनुमतियाँ बंद या समायोजित करें;','इस नीति से संबंधित प्रश्नों या शिकायतों के लिए xieh6888@gmail.com पर हमसे संपर्क करें।']],
['p','चूँकि हम खाते के माध्यम से आपकी जानकारी का पता नहीं लगा सकते और आपका ऑडियो डेटा हमारे पास नहीं है, इसलिए कुछ अनुरोध डेटा उपलब्ध न होने के कारण पूरे नहीं किए जा सकते। आपकी समझ के लिए धन्यवाद।'],
['h','8. नाबालिगों की सुरक्षा'],
['p','यह ऐप मुख्य रूप से वयस्कों के लिए है। यदि आप 14 वर्ष से कम आयु के हैं, तो कृपया इसे माता-पिता या अभिभावक की सहमति और मार्गदर्शन में ही उपयोग करें। ऐप बच्चों की व्यक्तिगत जानकारी सक्रिय रूप से एकत्र नहीं करता; चूँकि ऑडियो केवल स्थानीय रूप से संग्रहीत है, हम किसी विशेष उपयोगकर्ता के स्थानीय डेटा को दूर से पहचान या हटा नहीं सकते। प्रश्न होने पर अभिभावक xieh6888@gmail.com पर संपर्क कर सकते हैं।'],
['h','9. इस नीति में परिवर्तन'],
['p','हम समय-समय पर इस नीति को संशोधित कर सकते हैं। हम इस पृष्ठ की “अंतिम अद्यतन” और “प्रभावी तिथि” को अद्यतन करेंगे और यदि डेटा संग्रह का दायरा वास्तव में बदलता है तो ऐप के भीतर आपको सूचित करेंगे। ऐप का उपयोग जारी रखने का अर्थ है कि आप अद्यतन नीति से सहमत हैं; यदि नहीं, तो कृपया उपयोग बंद कर दें।'],
['h','10. हमसे संपर्क करें'],
['contact',['**गोपनीयता संबंधी संपर्क ईमेल:** xieh6888@gmail.com','हम अनुरोधों को शीघ्र संसाधित करेंगे और उचित अवधि के भीतर उत्तर देंगे।']]
]},

['p','EditBook-AudioEditor (“แอป”) ให้บริการโดย Mr. Xie (“เรา”) แอปนี้เป็นเครื่องมือตัดต่อเสียงภายในเครื่องและไม่ต้องใช้บัญชี นโยบายนี้อธิบายวิธีที่แอปประมวลผลและปกป้องข้อมูลของคุณ รวมถึงวิธีจัดการข้อมูลในเครื่องและสิทธิ์ของระบบ'],
['p','หากมีคำถามเกี่ยวกับนโยบายนี้ โปรดติดต่อเราที่ xieh6888@gmail.com'],
['h','1. วิธีจัดการข้อมูล'],

const DEFAULT_LANG='en';
const ALIAS={zh:'zh-Hans','zh-cn':'zh-Hans','zh-sg':'zh-Hans','zh-tw':'zh-Hant','zh-hk':'zh-Hant','zh-mo':'zh-Hant'};
const SUPPORTED=LANGUAGES.reduce((m,l)=>(m[l.code.toLowerCase()]=l.code,m),{});
function normalizeLang(raw){
  if(!raw)return null;
  const v=String(raw).trim().toLowerCase().replace(/_/g,'-');
  if(ALIAS[v])return ALIAS[v];
  if(SUPPORTED[v])return SUPPORTED[v];
  if(v.startsWith('zh-hant'))return 'zh-Hant';
  if(v.startsWith('zh'))return 'zh-Hans';
  return SUPPORTED[v.split('-')[0]]||null;
}
function detectLang(){
  try{const p=normalizeLang(new URLSearchParams(location.search).get('lang'));if(p)return p;}catch(e){}
  try{for(const n of (navigator.languages&&navigator.languages.length?navigator.languages:[navigator.language])){const m=normalizeLang(n);if(m)return m;}}catch(e){}
  return DEFAULT_LANG;
}
const app=document.getElementById('app'),btn=document.getElementById('langBtn'),menu=document.getElementById('langMenu'),cur=document.getElementById('langCur'),picker=document.getElementById('langPicker');
const EMAIL='xieh6888@gmail.com';
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const fmt=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').split(EMAIL).join('<a href="mailto:'+EMAIL+'">'+EMAIL+'</a>');
function renderBlock(b){
  const [t,v]=b;
  switch(t){
    case 'meta':return '<div class="meta">'+v.map(r=>'<p><strong>'+esc(r[0])+'</strong>'+esc(r[1])+'</p>').join('')+'</div>';
    case 'p':return '<p>'+fmt(v)+'</p>';
    case 'h':return '<h2>'+fmt(v)+'</h2>';
    case 'contact':return '<div class="contact">'+v.map(x=>'<p>'+fmt(x)+'</p>').join('')+'</div>';
    case 'ul':case 'ol':return '<'+t+'>'+v.map(x=>'<li>'+fmt(x)+'</li>').join('')+'</'+t+'>';
    case 'table':return '<div class="table-wrap"><table><thead><tr>'+v.head.map(h=>'<th>'+esc(h)+'</th>').join('')+'</tr></thead><tbody>'+v.rows.map(r=>'<tr>'+r.map(c=>'<td>'+fmt(c)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>';
  }
  return '';
}
function render(code){
  const d=I18N[I18N[code]?code:DEFAULT_LANG];
  document.documentElement.lang=code;document.documentElement.dir=d.dir;
  document.title=d.title+' - EditBook-AudioEditor';
  app.innerHTML='<h1>'+esc(d.title)+'</h1>'+d.blocks.map(renderBlock).join('')+'<footer><p>'+esc(d.footer)+'</p></footer>';
  cur.textContent=(LANGUAGES.find(x=>x.code===code)||LANGUAGES[0]).label;
  menu.querySelectorAll('li').forEach(li=>li.setAttribute('aria-selected',li.dataset.code===code?'true':'false'));
}
function syncUrl(code){
  const u=new URL(location.href);
  if(code===DEFAULT_LANG&&!u.searchParams.has('lang'))return;
  u.searchParams.set('lang',code);
  try{history.replaceState(null,'',u.toString());}catch(e){}
}
function openMenu(o){menu.classList.toggle('open',o);btn.setAttribute('aria-expanded',o?'true':'false');}
LANGUAGES.forEach(l=>{const li=document.createElement('li');li.setAttribute('role','option');li.dataset.code=l.code;li.lang=l.code;li.textContent=l.label;menu.appendChild(li);});
let current=detectLang();render(current);syncUrl(current);
btn.addEventListener('click',e=>{e.stopPropagation();openMenu(!menu.classList.contains('open'));});
menu.addEventListener('click',e=>{const li=e.target.closest('li');if(!li)return;current=li.dataset.code;render(current);syncUrl(current);openMenu(false);window.scrollTo({top:0,behavior:'smooth'});});
document.addEventListener('click',e=>{if(!picker.contains(e.target))openMenu(false);});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){openMenu(false);btn.focus();}});
</script>
