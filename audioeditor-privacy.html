<style>
:root{--primary:#216e93;--text:#212121;--muted:#5f6368;--line:#e0e0e0;--bg:#fff;--soft:#f2f2f2}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Lato","PingFang SC","Hiragino Sans GB","Microsoft YaHei",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans","Noto Sans Arabic","Noto Sans Thai","Noto Sans Devanagari","Noto Sans JP","Noto Sans KR",sans-serif;font-size:16px;line-height:1.75}
.page{max-width:760px;margin:0 auto;padding:72px 24px 80px}
.lang-picker{position:absolute;top:16px;inset-inline-end:20px;z-index:50}
.lang-btn{display:flex;align-items:center;gap:8px;border:1px solid var(--primary);border-radius:999px;padding:7px 12px;background:#fff;color:var(--primary);font:inherit;font-size:14px;line-height:1.2;cursor:pointer;-webkit-tap-highlight-color:transparent}
.lang-btn svg{width:17px;height:17px;fill:var(--primary);flex:none}
.lang-btn .cur{max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lang-btn .chev{border-left:4px solid transparent;border-right:4px solid transparent;border-top:5px solid var(--primary);transition:transform .15s}
.lang-btn[aria-expanded="true"] .chev{transform:rotate(180deg)}
.lang-menu{display:none;position:absolute;top:calc(100% + 6px);inset-inline-end:0;width:220px;max-width:calc(100vw - 32px);max-height:min(60vh,420px);overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;margin:0;padding:6px;list-style:none;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.15)}
.lang-menu.open{display:block}
.lang-menu li{margin:0;padding:11px 14px;border-radius:8px;font-size:15px;line-height:1.3;cursor:pointer;color:var(--text);-webkit-tap-highlight-color:transparent}
.lang-menu li:hover{background:var(--soft)}
.lang-menu li[aria-selected="true"]{background:#eaf3f8;color:var(--primary);font-weight:600}
h1{color:var(--primary);font-size:34px;font-weight:400;line-height:1.25;text-align:center;margin:0 0 32px}
h2{color:var(--primary);font-size:20px;font-weight:600;line-height:1.5;margin:40px 0 12px;padding-top:8px;border-top:1px solid var(--line)}
h3{font-size:17px;font-weight:600;margin:26px 0 10px}
p{margin:12px 0}
.meta{background:var(--soft);border-radius:8px;padding:16px 20px;color:var(--muted);font-size:15px;margin-bottom:8px}
.meta p{margin:4px 0}
.notice{background:#f7fbfd;border-inline-start:4px solid var(--primary);border-radius:4px;padding:14px 18px;margin:20px 0}
.notice p{margin:8px 0}
ul,ol{margin:12px 0;padding-inline-start:24px}
li{margin:8px 0}
strong{font-weight:600}
a{color:#006580;text-decoration:underline;word-break:break-all}
.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:16px 0;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;min-width:640px;font-size:15px}
th,td{text-align:start;vertical-align:top;padding:12px 14px;border-bottom:1px solid var(--line);line-height:1.65}
th{background:var(--soft);font-weight:600;white-space:nowrap}
tr:last-child td{border-bottom:none}
td a{font-size:14px}
.contact{background:var(--soft);border-radius:8px;padding:18px 20px;margin-top:16px}
.contact p{margin:6px 0}
footer{margin-top:56px;padding-top:20px;border-top:1px solid var(--line);color:var(--muted);font-size:14px;text-align:center}
@media(max-width:479px){.page{padding:64px 16px 64px}h1{font-size:26px}h2{font-size:18px}h3{font-size:16px}body{font-size:15px}}
</style>

['p','EditBook-AudioEditor（以下簡稱「本應用」）由 Mr. Xie（以下簡稱「我們」）提供。我們深知個人資料對您的重要性，並會盡力保護您的個人資料安全。本政策適用於 EditBook-AudioEditor 行動應用程式（Android／iOS）及隨附服務，說明我們如何蒐集、使用、儲存、分享和保護您的資料，以及您如何行使相關權利。'],
['notice',['**特別提示：**','本應用**無需註冊帳號**，我們不會要求您提供手機號碼、姓名等帳號註冊資料。請您在使用本應用前仔細閱讀本政策；您首次使用前，我們會透過隱私權政策彈窗等方式向您展示並徵得您的同意。您不同意本政策，請勿使用本應用。']],
['p','如您對本政策有任何疑問、意見或投訴，可透過 xieh6888@gmail.com 與我們聯絡。'],
['h','一、我們蒐集哪些資料'],
['p','我們遵循合法、正當、必要和誠信原則，僅蒐集實現產品功能所必需的資料。'],
['h3','1. 您主動選擇或錄製的音訊內容'],
['p','本應用是音訊剪輯工具。您匯入的音訊檔案、透過麥克風錄製的音訊、編輯操作及匯出結果，**預設在您的裝置本機處理**，我們不會主動將您的音訊內容上傳至我們的伺服器。'],
['p','僅在您主動使用「分享／匯出至其他應用程式」等功能時，檔案會透過您裝置的系統分享功能交由您選擇的目標應用程式處理。請您注意該目標應用程式的資料處理規則。'],
['p','我們僅在您主動選擇檔案時存取您選定的音訊／媒體檔案，**不會掃描您裝置中的其他檔案**；麥克風權限也**僅在您主動點擊錄音功能時請求與呼叫**。'],
['h3','2. 裝置資訊、記錄與使用統計'],
['p','為實現應用程式執行、統計分析、故障排查和廣告展示，我們及第三方 SDK 可能蒐集：'],
['ul',['裝置型號、作業系統版本、應用程式版本、語言和地區設定；','網路類型、網路狀態、IP 位址；','裝置識別碼，如 Android Advertising ID、OAID、IDFA（如您授權）、Android ID 等，具體以 SDK 實際蒐集為準；','應用程式啟動、頁面／功能使用、點擊等統計資訊；','廣告展示、點擊及轉換資料；','當機記錄、錯誤堆疊、效能資料。']],
['h3','3. 訂閱與購買資訊'],
['p','如您透過 **Google Play 或 Apple App Store** 購買訂閱，付款和訂單處理由應用程式商店完成。我們**不會直接蒐集您的信用卡號、付款密碼等付款資訊**。'],
['p','我們可能從應用程式商店取得用於驗證訂閱權益、恢復購買和處理退款諮詢所必需的資訊，包括：'],
['ul',['商品 ID、訂閱狀態、購買時間、到期時間；','訂單／交易識別碼、地區；','**Apple 可能向開發者提供訂閱者 ID 及購買記錄**，用於識別訂閱關係、提供訂閱內容及協助處理退款請求；','**Google Play 帳款服務**可能提供購買記錄（購買狀態、交易識別碼等），用於確認訂閱有效性。']],
['p','退款、付款爭議請優先透過 Google Play 或 Apple 官方管道處理。'],
['h3','4. 廣告相關資訊'],
['p','本應用接入 **Google AdMob（Google Mobile Ads SDK）** 展示廣告。根據 Google 對 Mobile Ads SDK 資料蒐集實務的公開說明，SDK 可能蒐集以下資料，用於廣告投放、頻次控制、反作弊、成效評估及 SDK 效能改進：'],
['ul',['**IP 位址**，可用於估算裝置大致位置；','**裝置 ID**，包括廣告識別碼（Android Advertising ID／iOS IDFA，IDFA 受 iOS ATT 授權控制）或其他應用程式／開發者範圍內的裝置識別碼；','**廣告資料**，如您看到的廣告；','**使用者互動資訊**，如應用程式啟動點擊、影片觀看等；','**非使用者關聯的當機記錄、診斷資訊及效能資料**。']],
['p','AdMob 可能將這些資料用於第三方廣告和分析目的，並在傳輸過程中加密。在適用法律要求時（如歐洲經濟區、英國、瑞士），我們會透過同意管理彈窗徵得您的同意。您可透過 Android 廣告設定或 iOS「追蹤」設定限制廣告追蹤、重設廣告識別碼或關閉個人化廣告；關閉後您仍可能看到非個人化廣告。'],
['h3','5. 您透過電子郵件聯絡我們時提供的資訊'],
['p','如您透過電子郵件聯絡我們，我們會處理您主動提供的電子郵件地址、通訊內容及附件，僅用於回覆和處理您的問題。'],
['notice',['**我們不會主動蒐集您的通訊錄、簡訊、精確地理位置、生物辨識、健康等敏感性個人資料。**如未來業務需要蒐集，我們會另行告知並依法徵得同意。']],
['h','二、應用程式權限說明'],
['p','我們僅在實現具體功能時申請權限，您可拒絕或隨時在系統設定中關閉。拒絕非必要權限不影響其他功能使用。'],
['table',{head:['權限／能力','用途','是否必要'],rows:[
['網路權限','載入廣告、統計、當機回報、驗證訂閱狀態','必要'],
['儲存／媒體／檔案存取','匯入、編輯、匯出您選擇的音訊檔案','使用相關功能時必要'],
['**麥克風**','**僅在您主動點擊錄音功能時擷取音訊，錄製內容僅儲存在本機專案中，不上傳至我們的伺服器**','**使用錄音功能時必要**'],
['廣告識別碼／追蹤（iOS ATT，如適用）','個人化廣告與廣告成效評估','選用，可拒絕']]}],
['notice',['**關於麥克風權限的說明：**','麥克風權限不會在應用程式啟動時或引導流程中自動請求，僅在您進入錄音功能並主動觸發時彈出系統授權提示。拒絕授權後，您仍可正常使用匯入、編輯、匯出等不依賴錄音的功能。您可隨時在系統設定中查看、修改或撤銷該權限。']],
['h','三、第三方 SDK／服務清單'],
['table',{head:['SDK／服務','提供方','用途','可能蒐集的資訊','隱私權政策連結'],rows:[
['友盟統計','友盟同欣（北京）科技有限公司','應用程式使用統計、分析','裝置識別碼、裝置型號、系統版本、網路類型、應用程式版本、頁面／功能使用記錄、IP 位址等',SDK_ROWS_URL[0]],

['**Google AdMob（Google Mobile Ads SDK）**','**Google LLC**','**廣告展示、頻次控制、反作弊、成效評估、SDK 效能改進**','**IP 位址、裝置 ID（含廣告識別碼）、廣告資料、使用者互動資訊、當機記錄、診斷及效能資料**',SDK_ROWS_URL[2]],
['Google Play 帳款服務','Google LLC','Android 訂閱與購買','商品 ID、購買記錄、訂單／交易識別碼、訂閱狀態、地區等',SDK_ROWS_URL[3]],
['Apple App Store／應用程式內購買','Apple Inc.','iOS 訂閱與購買','商品 ID、訂閱者 ID、購買記錄、訂單／交易識別碼、訂閱狀態、地區等',SDK_ROWS_URL[4]]]}],
['p','我們可能隨版本更新調整第三方 SDK。變更時我們會透過應用程式內「第三方資訊分享清單」、隱私權政策更新等方式告知您。'],
['h','四、我們如何使用資訊'],
['p','我們將蒐集的資訊用於：'],
['ol',['提供音訊匯入、**錄音**、編輯、匯出、分享等核心功能；','驗證訂閱權益、恢復購買、顯示訂閱狀態；','透過 Google AdMob 展示廣告、控制廣告頻次、評估廣告成效和反作弊；','統計應用程式使用情況，改進產品功能和使用者體驗；','監測當機、排查故障、保障應用程式穩定和安全；','回覆您的諮詢、投訴和權利請求；','遵守法律法規及監管要求。']],
['p','我們不會將您的音訊內容（包括錄音）用於廣告定向或出售給第三方。'],
['h','五、資訊儲存'],
['h3','1. 儲存方式和期限'],
['p','您的音訊檔案和編輯資料預設儲存在您的裝置本機，**錄音內容同樣僅儲存在本機專案中，不會上傳至我們的伺服器**。我們及第三方 SDK 在實現本政策所述目的所需的最短期限內保存資訊，法律法規另有規定或為處理爭議、安全稽核所必需的除外。超出期限後，我們將刪除或匿名化處理。'],
['h3','2. 儲存地點與跨境傳輸'],
['p','我們主要在中國境內儲存和處理資訊。部分第三方服務（如 **Google AdMob、Google Play、Apple App Store**）可能涉及境外處理。如發生跨境傳輸，我們將依法履行告知、取得同意、安全評估或標準契約等義務，並要求接收方採取相應保護措施。'],
['h3','3. 產品停止營運'],
['p','如本應用停止營運，我們將透過應用程式內公告、推播通知等方式告知您，並在合理期限內刪除或匿名化處理您的個人資料，法律法規另有規定的除外。'],
['h','六、資訊分享、轉讓和公開揭露'],
['p','我們不會出售您的個人資料。除以下情形外，我們不會主動分享或轉讓您的個人資料：'],
['ol',['為實現**廣告（Google AdMob）、統計（友盟）、當機監測（Bugly）、訂閱驗證（Google Play／Apple）**等功能，與上述第三方 SDK／服務商分享必要資訊；','根據法律法規、司法或行政機關的強制性要求；','為保護您或他人的生命、財產等重大合法權益，且難以取得本人同意；','您自行公開或已合法公開的資訊；','涉及合併、收購、資產轉讓時，我們會告知您，並要求新的控制方繼續受本政策約束，或依法重新徵得同意。']],
['p','我們不會公開揭露您的個人資料，除非取得您的單獨同意或法律法規另有規定。'],
['h','七、您的權利'],
['p','在適用法律範圍內，您有權：'],
['ul',['**查閱、更正、刪除**您的個人資料；','**撤回同意**：透過系統設定關閉**麥克風權限**、限制廣告追蹤，或聯絡我們撤回同意；','**關閉個人化廣告**：透過 Android 廣告設定或 iOS「追蹤」設定管理 AdMob 的廣告識別碼使用；','**管理訂閱**：透過 Google Play 或 Apple App Store 的訂閱管理頁面取消或管理訂閱；','**刪除本機資料**：透過清除應用程式快取／資料或解除安裝應用程式刪除本機音訊、錄音專案等資料；','**投訴檢舉**：透過 xieh6888@gmail.com 聯絡我們，我們將在法定期限內回覆。']],
['p','由於本應用無需註冊帳號，我們可能無法透過帳號定位您的資訊。您提出權利請求時，我們可能需要您提供必要資訊以核驗身分和請求內容。'],

['p','我們採取合理的安全技術和管理措施保護資訊，防止遺失、不當使用、未經授權存取或揭露，例如傳輸加密、存取控制、最小化蒐集等。但請注意，網際網路環境不存在絕對安全，我們不能保證 100% 安全。如發生個人資料安全事件，我們將依法啟動應變計畫、採取補救措施並按規定告知您和監管部門。'],
['h','九、未成年人保護'],
['p','本應用主要面向成年人。若您是不滿十四歲的兒童，請在父母或其他監護人同意和指導下使用本應用。我們不會主動蒐集兒童個人資料；如我們發現在未取得監護人同意的情況下蒐集了兒童個人資料，將依法刪除。監護人如發現相關情況，可透過 xieh6888@gmail.com 聯絡我們。'],
['h','十、政策更新'],
['p','我們可能適時修訂本政策。修訂後，我們會透過應用程式內彈窗、公告等方式提示您，並標明更新日期和生效日期。涉及重大變更時，我們會依法重新徵得您的同意。您繼續使用本應用，表示您同意更新後的政策；如不同意，請停止使用。'],
['h','十一、聯絡我們'],
['contact',['**個人資料保護相關聯絡電子郵件：**xieh6888@gmail.com','我們將在收到請求後儘快處理，並在法律規定的期限內回覆。']]
]},

en:{dir:'ltr',title:'Privacy Policy',footer:'© 2026 EditBook-AudioEditor · Mr. Xie',blocks:[
['meta',[['Product: ','EditBook-AudioEditor'],['Last updated: ','November 1, 2026'],['Effective date: ','November 1, 2026']]],
['p','EditBook-AudioEditor (the “App”) is provided by Mr. Xie (“we”). We understand how important your personal information is and work to keep it safe. This policy applies to the EditBook-AudioEditor mobile app (Android/iOS) and related services. It explains how we collect, use, store, share and protect your information, and how you can exercise your rights.'],
['notice',['**Important:**','The App **does not require an account**. We do not ask for your phone number, name or other registration details. Please read this policy before using the App; on first launch we will show it to you (e.g. in a pop-up) and ask for your consent. If you do not agree, please do not use the App.']],
['p','If you have questions, comments or complaints about this policy, contact us at xieh6888@gmail.com.'],
['h','1. Information we collect'],
['p','We follow the principles of lawfulness, fairness, necessity and good faith, and collect only what is needed to provide the App’s features.'],
['h3','1.1 Audio you choose or record'],
['p','The App is an audio editor. Audio files you import, audio you record with the microphone, your edits and exported results are **processed locally on your device by default**. We do not proactively upload your audio to our servers.'],
['p','Only when you use features such as “share/export to another app” is a file handed, via your device’s system share function, to the app you choose. Please review that app’s own data practices.'],
['p','We access media files only when you select them, **we do not scan other files on your device**, and the microphone permission is **requested and used only when you tap the recording feature**.'],
['h3','1.2 Device information, logs and usage statistics'],
['p','For app operation, analytics, troubleshooting and ad display, we and third-party SDKs may collect:'],
['ul',['Device model, OS version, app version, language and region settings;','Network type and status, IP address;','Device identifiers such as Android Advertising ID, OAID, IDFA (if you authorize) and Android ID, depending on what each SDK actually collects;','App launch, page/feature usage and click statistics;','Ad impression, click and conversion data;','Crash logs, error stacks and performance data.']],
['h3','1.3 Subscription and purchase information'],
['p','If you subscribe through **Google Play or the Apple App Store**, payment and order processing are handled by the store. We **do not directly collect your card number, payment password or similar payment data**.'],
['p','We may receive from the store the information needed to verify entitlements, restore purchases and handle refund inquiries, including:'],
['ul',['Product ID, subscription status, purchase and expiry time;','Order/transaction identifiers, region;','**Apple may provide developers with a subscriber ID and purchase history** to identify the subscription, deliver content and help with refund requests;','**Google Play Billing** may provide purchase history (purchase state, transaction identifiers, etc.) to confirm that a subscription is valid.']],
['p','Please handle refunds and payment disputes through the official Google Play or Apple channels first.'],
['h3','1.4 Advertising information'],
['p','The App uses **Google AdMob (Google Mobile Ads SDK)** to show ads. According to Google’s public description of the SDK’s data practices, it may collect the following for ad delivery, frequency capping, fraud prevention, measurement and SDK performance:'],
['ul',['**IP address**, which may be used to estimate approximate device location;','**Device IDs**, including advertising identifiers (Android Advertising ID / iOS IDFA, the latter governed by iOS ATT) or other app/developer-scoped identifiers;','**Advertising data**, such as the ads you see;','**User interactions**, such as app-launch taps and video views;','**Crash logs, diagnostics and performance data** not linked to you.']],
['p','AdMob may use this data for third-party advertising and analytics and encrypts it in transit. Where required by law (e.g. EEA, UK, Switzerland) we ask for your consent through a consent dialog. You can limit ad tracking, reset your advertising ID or turn off personalized ads in Android ad settings or iOS “Tracking” settings; you may still see non-personalized ads.'],
['h3','1.5 Information you send us by email'],
['p','If you email us, we process the address, message content and attachments you provide, solely to reply to and resolve your request.'],
['notice',['**We do not proactively collect sensitive personal information such as contacts, SMS, precise location, biometrics or health data.** If that changes, we will notify you and obtain consent as required by law.']],
['h','2. App permissions'],
['p','We request permissions only when a specific feature needs them. You may decline or revoke them in system settings at any time; declining non-essential permissions does not affect other features.'],
['table',{head:['Permission','Purpose','Required?'],rows:[
['Network','Load ads, analytics, crash reporting, verify subscription status','Required'],
['Storage / media / files','Import, edit and export audio files you select','Required for those features'],
['**Microphone**','**Captures audio only when you tap recording; recordings stay in local projects and are not uploaded to our servers**','**Required for recording**'],
['Advertising ID / tracking (iOS ATT, if applicable)','Personalized ads and ad measurement','Optional; may be declined']]}],
['notice',['**About the microphone permission:**','It is never requested at launch or during onboarding; the system prompt appears only when you open and trigger recording. If you decline, import, editing and export still work. You can review, change or revoke it in system settings at any time.']],
['h','3. Third-party SDKs and services'],
['table',{head:['SDK / service','Provider','Purpose','Information possibly collected','Privacy policy'],rows:[
['Umeng Analytics','Umeng Tongxin (Beijing) Technology Co., Ltd.','Usage statistics and analysis','Device identifiers, model, OS version, network type, app version, page/feature usage, IP address, etc.',SDK_ROWS_URL[0]],
['Bugly','Shenzhen Tencent Computer Systems Co., Ltd.','Crash monitoring, troubleshooting, performance analysis','Crash logs, stacks, model, OS and app version, network status, IP address, etc.',SDK_ROWS_URL[1]],
['**Google AdMob (Google Mobile Ads SDK)**','**Google LLC**','**Ad display, frequency capping, fraud prevention, measurement, SDK performance**','**IP address, device IDs (incl. advertising ID), advertising data, user interactions, crash logs, diagnostics, performance data**',SDK_ROWS_URL[2]],
['Google Play Billing','Google LLC','Android subscriptions and purchases','Product ID, purchase history, order/transaction IDs, subscription status, region, etc.',SDK_ROWS_URL[3]],
['Apple App Store / In-App Purchase','Apple Inc.','iOS subscriptions and purchases','Product ID, subscriber ID, purchase history, order/transaction IDs, subscription status, region, etc.',SDK_ROWS_URL[4]]]}],
['p','We may change third-party SDKs with app updates and will tell you through the in-app third-party sharing list or policy updates.'],
['h','4. How we use information'],
['ol',['To provide core features: audio import, **recording**, editing, export and sharing;','To verify subscription entitlements, restore purchases and show subscription status;','To show ads via Google AdMob, cap frequency, measure ad performance and prevent fraud;','To analyze usage and improve features and experience;','To monitor crashes, troubleshoot and keep the App stable and secure;','To respond to your inquiries, complaints and rights requests;','To comply with laws and regulatory requirements.']],
['p','We do not use your audio content (including recordings) for ad targeting or sell it to third parties.'],
['h','5. Storage'],
['h3','5.1 Method and retention'],
['p','Your audio files and editing data are stored locally on your device by default, and **recordings likewise remain in local projects and are not uploaded to our servers**. We and third-party SDKs keep information only as long as needed for the purposes above, unless law or dispute/security-audit needs require longer. After that we delete or anonymize it.'],
['h3','5.2 Location and cross-border transfers'],
['p','We mainly store and process information in China. Some third-party services (such as **Google AdMob, Google Play and the Apple App Store**) may process data abroad. Where cross-border transfers occur, we will meet notice, consent, security assessment or standard contract obligations required by law and require recipients to apply appropriate protections.'],
['h3','5.3 If the product ceases operation'],
['p','If the App ceases operation, we will notify you in-app or by push notification and delete or anonymize your personal information within a reasonable period, unless law provides otherwise.'],
['h','6. Sharing, transfer and public disclosure'],
['p','We do not sell your personal information. Except in the following cases, we do not proactively share or transfer it:'],
['ol',['To provide **advertising (Google AdMob), analytics (Umeng), crash monitoring (Bugly) and subscription verification (Google Play / Apple)**, we share necessary information with those SDKs/providers;','Where required by law or by judicial or administrative authorities;','To protect the life, property or other major legitimate interests of you or others when your consent is hard to obtain;','Information you made public or that has been lawfully made public;','In a merger, acquisition or asset transfer, we will tell you and require the new controller to remain bound by this policy or obtain your consent again as required.']],
['p','We do not publicly disclose your personal information unless we obtain your separate consent or the law requires otherwise.'],
['h','7. Your rights'],
['p','Under applicable law, you may:'],
['ul',['**Access, correct and delete** your personal information;','**Withdraw consent** by turning off the **microphone permission** or limiting ad tracking in system settings, or by contacting us;','**Turn off personalized ads** via Android ad settings or iOS “Tracking” settings;','**Manage subscriptions** in Google Play or Apple App Store subscription settings;','**Delete local data** by clearing app data or uninstalling the App;','**Complain or report** by emailing xieh6888@gmail.com; we will reply within the statutory period.']],
['p','Because the App has no accounts, we may be unable to locate your information by account. When you submit a request we may ask for information needed to verify your identity and request.'],
['h','8. Information security'],
['p','We use reasonable technical and organizational measures such as encryption in transit, access control and data minimization to protect information against loss, misuse, unauthorized access or disclosure. No internet environment is absolutely secure, so we cannot guarantee 100% security. In the event of a personal information security incident, we will activate our response plan, take remedial action and notify you and regulators as required by law.'],
['h','9. Protection of minors'],
['p','The App is mainly intended for adults. If you are a child under 14, please use it only with the consent and guidance of a parent or guardian. We do not proactively collect children’s personal information; if we find we have done so without guardian consent, we will delete it as required by law. Guardians who become aware of such a case can contact xieh6888@gmail.com.'],
['h','10. Changes to this policy'],
['p','We may revise this policy from time to time. We will notify you through an in-app pop-up or announcement and state the update and effective dates. For material changes we will obtain your consent again as required by law. Continued use of the App means you accept the updated policy; if you do not, please stop using it.'],
['h','11. Contact us'],
['contact',['**Privacy contact email:** xieh6888@gmail.com','We will handle requests promptly and reply within the period required by law.']]
]},

['p','يُقدَّم تطبيق EditBook-AudioEditor («التطبيق») من قبل Mr. Xie («نحن»). ندرك أهمية معلوماتك الشخصية ونعمل على حمايتها. تنطبق هذه السياسة على تطبيق EditBook-AudioEditor للهواتف (Android/iOS) والخدمات المرتبطة به، وتوضح كيفية جمعنا لمعلوماتك واستخدامها وتخزينها ومشاركتها وحمايتها، وكيفية ممارسة حقوقك.'],
['notice',['**تنبيه مهم:**','لا يتطلب التطبيق **إنشاء حساب**. لا نطلب رقم هاتفك أو اسمك أو أي بيانات تسجيل أخرى. يُرجى قراءة هذه السياسة قبل استخدام التطبيق؛ وعند أول تشغيل سنعرضها عليك (مثلًا في نافذة منبثقة) ونطلب موافقتك. إذا كنت لا توافق، يُرجى عدم استخدام التطبيق.']],
['p','إذا كانت لديك أسئلة أو ملاحظات أو شكاوى بشأن هذه السياسة، تواصل معنا على xieh6888@gmail.com.'],
['h','1. المعلومات التي نجمعها'],
['p','نلتزم بمبادئ المشروعية والإنصاف والضرورة وحسن النية، ولا نجمع سوى ما يلزم لتقديم ميزات التطبيق.'],
['h3','1.1 الصوت الذي تختاره أو تسجله'],
['p','التطبيق أداة تحرير صوتي. تتم **معالجة** ملفات الصوت التي تستوردها والتسجيلات التي تلتقطها بالميكروفون وتعديلاتك ونتائج التصدير **محليًا على جهازك افتراضيًا**. ولا نرفع محتوى الصوت الخاص بك إلى خوادمنا من تلقاء أنفسنا.'],
['p','فقط عند استخدام ميزات مثل «مشاركة/تصدير إلى تطبيق آخر» يتم تسليم الملف، عبر وظيفة المشاركة في نظام جهازك، إلى التطبيق الذي تختاره. يُرجى مراجعة ممارسات البيانات الخاصة بذلك التطبيق.'],
['p','لا نصل إلى ملفات الوسائط إلا عندما تختارها، **ولا نفحص ملفات أخرى على جهازك**، ولا يتم **طلب إذن الميكروفون واستخدامه إلا عند النقر على ميزة التسجيل**.'],
['h3','1.2 معلومات الجهاز والسجلات وإحصاءات الاستخدام'],
['p','لتشغيل التطبيق والتحليلات واستكشاف الأخطاء وعرض الإعلانات، قد نجمع نحن وSDKs الخاصة بأطراف ثالثة:'],
['ul',['طراز الجهاز وإصدار نظام التشغيل وإصدار التطبيق وإعدادات اللغة والمنطقة؛','نوع الشبكة وحالتها وعنوان IP؛','معرّفات الجهاز مثل Android Advertising ID وOAID وIDFA (إذا سمحت) وAndroid ID، حسب ما يجمعه كل SDK فعليًا؛','إحصاءات بدء التطبيق واستخدام الصفحات/الميزات والنقرات؛','بيانات ظهور الإعلانات والنقرات والتحويلات؛','سجلات الأعطال وأدوات تتبع الأخطاء وبيانات الأداء.']],
['h3','1.3 معلومات الاشتراك والشراء'],
['p','إذا اشتركت عبر **Google Play أو Apple App Store**، فستتولى المتجر معالجة الدفع والطلبات. **ولا نجمع مباشرة رقم بطاقتك أو كلمة مرور الدفع أو ما شابه من بيانات الدفع**.'],
['p','قد نتلقى من المتجر المعلومات اللازمة للتحقق من الاستحقاقات واستعادة المشتريات ومعالجة استفسارات الاسترداد، بما في ذلك:'],
['ul',['معرّف المنتج وحالة الاشتراك ووقت الشراء والانتهاء؛','معرّفات الطلب/المعاملة والمنطقة؛','**قد توفر Apple للمطورين معرّف المشترك وسجل المشتريات** لتحديد الاشتراك وتقديم المحتوى والمساعدة في طلبات الاسترداد؛','قد توفر **خدمة الفوترة في Google Play** سجل المشتريات (حالة الشراء ومعرّفات المعاملة وما إلى ذلك) لتأكيد صلاحية الاشتراك.']],
['p','يُرجى معالجة عمليات الاسترداد ونزاعات الدفع عبر قنوات Google Play أو Apple الرسمية أولًا.'],
['h3','1.4 معلومات الإعلانات'],
['p','يستخدم التطبيق **Google AdMob (Google Mobile Ads SDK)** لعرض الإعلانات. ووفقًا للوصف العام من Google لممارسات جمع البيانات في الـ SDK، قد يجمع ما يلي لتقديم الإعلانات والحد من تكرارها ومنع الاحتيال وقياس الأداء وتحسين أداء الـ SDK:'],
['ul',['**عنوان IP**، وقد يُستخدم لتقدير الموقع التقريبي للجهاز؛','**معرّفات الجهاز**، بما في ذلك معرّفات الإعلانات (Android Advertising ID / iOS IDFA، ويخضع الأخير لإذن ATT في iOS) أو معرّفات أخرى خاصة بالتطبيق/المطور؛','**بيانات الإعلانات**، مثل الإعلانات التي تراها؛','**تفاعلات المستخدم**، مثل نقرات بدء التطبيق ومشاهدات الفيديو؛','**سجلات الأعطال والتشخيصات وبيانات الأداء** غير المرتبطة بك.']],
['p','قد تستخدم AdMob هذه البيانات لأغراض الإعلانات والتحليلات الخاصة بأطراف ثالثة، وتشفّرها أثناء النقل. وحيث يقتضي القانون ذلك (مثل المنطقة الاقتصادية الأوروبية والمملكة المتحدة وسويسرا) نطلب موافقتك عبر نافذة إدارة الموافقة. يمكنك تقييد تتبع الإعلانات أو إعادة تعيين معرّف الإعلانات أو إيقاف الإعلانات المخصصة من إعدادات إعلانات Android أو إعدادات «التتبع» في iOS؛ وقد تظل ترى إعلانات غير مخصصة.'],
['h3','1.5 المعلومات التي ترسلها إلينا بالبريد الإلكتروني'],
['p','إذا راسلتنا بالبريد الإلكتروني، فإننا نعالج العنوان ومحتوى الرسالة والمرفقات التي تقدمها، وذلك فقط للرد على طلبك وحلّه.'],
['notice',['**لا نجمع معلومات شخصية حساسة مثل جهات الاتصال أو الرسائل النصية أو الموقع الدقيق أو البيانات البيومترية أو الصحية من تلقاء أنفسنا.** وإذا تغير ذلك، سنُعلمك ونحصل على موافقتك وفقًا للقانون.']],
['h','2. أذونات التطبيق'],
['p','لا نطلب الأذونات إلا عندما تحتاجها ميزة معينة. ويمكنك رفضها أو إلغاؤها في إعدادات النظام في أي وقت؛ ولا يؤثر رفض الأذونات غير الضرورية على الميزات الأخرى.'],

['h','4. كيف نستخدم المعلومات'],
['ol',['لتقديم الميزات الأساسية: استيراد الصوت و**التسجيل** والتحرير والتصدير والمشاركة؛','للتحقق من استحقاقات الاشتراك واستعادة المشتريات وعرض حالة الاشتراك؛','لعرض الإعلانات عبر Google AdMob والحد من تكرارها وقياس أدائها ومنع الاحتيال؛','لتحليل الاستخدام وتحسين الميزات والتجربة؛','لمراقبة الأعطال واستكشاف الأخطاء والحفاظ على استقرار التطبيق وأمانه؛','للرد على استفساراتك وشكاواك وطلبات حقوقك؛','للامتثال للقوانين والمتطلبات التنظيمية.']],
['p','لا نستخدم محتوى الصوت الخاص بك (بما في ذلك التسجيلات) لاستهداف الإعلانات ولا نبيعه لأطراف ثالثة.'],
['h','5. التخزين'],
['h3','5.1 الطريقة ومدة الاحتفاظ'],
['p','تُخزَّن ملفات الصوت وبيانات التحرير محليًا على جهازك افتراضيًا، و**تبقى التسجيلات كذلك في المشاريع المحلية ولا تُرفع إلى خوادمنا**. ونحتفظ نحن وSDKs الأطراف الثالثة بالمعلومات فقط للمدة اللازمة للأغراض المذكورة أعلاه، ما لم يتطلب القانون أو الحاجة إلى معالجة النزاعات/تدقيق الأمان مدة أطول. وبعد ذلك نحذفها أو نجعلها مجهولة الهوية.'],
['h3','5.2 الموقع والنقل عبر الحدود'],
['p','نخزّن المعلومات ونعالجها بشكل أساسي في الصين. وقد تعالج بعض خدمات الأطراف الثالثة (مثل **Google AdMob وGoogle Play وApple App Store**) البيانات في الخارج. وعند حدوث نقل عبر الحدود، سنفي بالتزامات الإشعار والموافقة وتقييم الأمان أو العقود النموذجية التي يقتضيها القانون، ونطلب من المتلقين تطبيق حمايات مناسبة.'],
['h3','5.3 إذا توقف المنتج عن العمل'],
['p','إذا توقف تشغيل التطبيق، سنُعلمك داخل التطبيق أو عبر إشعار، ونحذف معلوماتك الشخصية أو نجعلها مجهولة الهوية خلال مدة معقولة، ما لم ينص القانون على خلاف ذلك.'],
['h','6. المشاركة والنقل والإفصاح العلني'],
['p','لا نبيع معلوماتك الشخصية. وباستثناء الحالات التالية، لا نشاركها أو ننقلها من تلقاء أنفسنا:'],
['ol',['لتقديم **الإعلانات (Google AdMob) والتحليلات (Umeng) ومراقبة الأعطال (Bugly) والتحقق من الاشتراك (Google Play / Apple)**، نشارك المعلومات اللازمة مع تلك الـ SDKs/المزودين؛','عندما يقتضي القانون ذلك أو تطلبه السلطات القضائية أو الإدارية؛','لحماية حياة أو ممتلكات أو مصالح مشروعة جوهرية أخرى لك أو للآخرين عندما يصعب الحصول على موافقتك؛','المعلومات التي أعلنتها بنفسك أو التي أصبحت علنية بشكل قانوني؛','في حالة الاندماج أو الاستحواذ أو نقل الأصول، سنُعلمك ونطلب من المتحكم الجديد الالتزام بهذه السياسة أو الحصول على موافقتك مجددًا وفقًا للقانون.']],
['p','لا نفصح علنًا عن معلوماتك الشخصية إلا بموافقتك المنفصلة أو إذا اقتضى القانون خلاف ذلك.'],
['h','7. حقوقك'],
['p','وفقًا للقانون المعمول به، يحق لك:'],
['ul',['**الوصول إلى معلوماتك الشخصية وتصحيحها وحذفها**؛','**سحب الموافقة** بإيقاف **إذن الميكروفون** أو تقييد تتبع الإعلانات من إعدادات النظام، أو بالتواصل معنا؛','**إيقاف الإعلانات المخصصة** عبر إعدادات إعلانات Android أو إعدادات «التتبع» في iOS؛','**إدارة الاشتراكات** في إعدادات اشتراك Google Play أو Apple App Store؛','**حذف البيانات المحلية** بمسح بيانات التطبيق أو إلغاء تثبيته؛','**تقديم شكوى أو إبلاغ** عبر البريد xieh6888@gmail.com؛ وسنرد خلال المدة القانونية.']],
['p','لأن التطبيق لا يتضمن حسابات، قد لا نتمكن من تحديد موقع معلوماتك عبر حساب. وعند تقديم طلب، قد نطلب معلومات لازمة للتحقق من هويتك وطلبك.'],
['h','8. أمن المعلومات'],
['p','نستخدم تدابير تقنية وتنظيمية معقولة مثل التشفير أثناء النقل والتحكم في الوصول وتقليل البيانات لحماية المعلومات من الفقدان أو سوء الاستخدام أو الوصول غير المصرح به أو الإفصاح. ولا توجد بيئة إنترنت آمنة بشكل مطلق، لذلك لا يمكننا ضمان أمان بنسبة 100%. وفي حال وقوع حادث أمني يتعلق بالمعلومات الشخصية، سنفعّل خطة الاستجابة ونتخذ إجراءات تصحيحية ونُعلمك والجهات التنظيمية وفقًا للقانون.'],
['h','9. حماية القاصرين'],
['p','التطبيق موجه بشكل أساسي للبالغين. إذا كنت طفلًا دون 14 عامًا، فيُرجى استخدامه فقط بموافقة والديك أو وليك وإرشادهما. ولا نجمع معلومات الأطفال الشخصية من تلقاء أنفسنا؛ وإذا تبين أننا جمعناها دون موافقة الولي، فسنحذفها وفقًا للقانون. ويمكن للأولياء الذين يعلمون بذلك التواصل على xieh6888@gmail.com.'],
['h','10. التغييرات على هذه السياسة'],

de:{dir:'ltr',title:'Datenschutzerklärung',footer:'© 2026 EditBook-AudioEditor · Mr. Xie',blocks:[
['meta',[['Produkt: ','EditBook-AudioEditor'],['Zuletzt aktualisiert: ','1. November 2026'],['Inkrafttreten: ','1. November 2026']]],
['p','EditBook-AudioEditor (die „App“) wird von Mr. Xie („wir“) bereitgestellt. Wir wissen, wie wichtig Ihre personenbezogenen Daten sind, und bemühen uns, sie zu schützen. Diese Erklärung gilt für die mobile App EditBook-AudioEditor (Android/iOS) und die zugehörigen Dienste. Sie erläutert, wie wir Ihre Daten erheben, verwenden, speichern, weitergeben und schützen und wie Sie Ihre Rechte ausüben können.'],
['notice',['**Wichtiger Hinweis:**','Die App **erfordert kein Benutzerkonto**. Wir fragen nicht nach Telefonnummer, Namen oder anderen Registrierungsdaten. Bitte lesen Sie diese Erklärung vor der Nutzung der App; beim ersten Start zeigen wir sie Ihnen (z. B. in einem Pop-up) und bitten um Ihre Einwilligung. Wenn Sie nicht einverstanden sind, nutzen Sie die App bitte nicht.']],
['p','Bei Fragen, Anmerkungen oder Beschwerden zu dieser Erklärung kontaktieren Sie uns unter xieh6888@gmail.com.'],
['h','1. Welche Informationen wir erheben'],
['p','Wir befolgen die Grundsätze der Rechtmäßigkeit, Fairness, Erforderlichkeit und von Treu und Glauben und erheben nur die Informationen, die für die Bereitstellung der App-Funktionen erforderlich sind.'],
['h3','1.1 Von Ihnen ausgewählte oder aufgenommene Audiodaten'],
['p','Die App ist ein Audio-Editor. Von Ihnen importierte Audiodateien, mit dem Mikrofon aufgenommene Audiodaten, Ihre Bearbeitungen und Exporte werden **standardmäßig lokal auf Ihrem Gerät verarbeitet**. Wir laden Ihre Audiodaten nicht von uns aus auf unsere Server hoch.'],
['p','Nur wenn Sie Funktionen wie „Teilen/In eine andere App exportieren“ aktiv nutzen, wird eine Datei über die Systemfreigabe Ihres Geräts an die von Ihnen gewählte App übergeben. Bitte beachten Sie die Datenpraktiken dieser App.'],
['p','Wir greifen nur auf Mediendateien zu, wenn Sie sie auswählen, **durchsuchen keine anderen Dateien auf Ihrem Gerät**, und die Mikrofonberechtigung wird **nur beim Tippen auf die Aufnahmefunktion angefragt und genutzt**.'],
['h3','1.2 Geräteinformationen, Protokolle und Nutzungsstatistiken'],
['p','Für den Betrieb der App, Analysen, Fehlerbehebung und die Anzeige von Werbung können wir und Drittanbieter-SDKs Folgendes erheben:'],
['ul',['Gerätemodell, Betriebssystemversion, App-Version, Sprach- und Regionseinstellungen;','Netzwerktyp und -status, IP-Adresse;','Gerätekennungen wie Android Advertising ID, OAID, IDFA (bei Einwilligung) und Android ID, je nachdem, was das jeweilige SDK tatsächlich erhebt;','Statistiken zu App-Starts, Seiten-/Funktionsnutzung und Klicks;','Daten zu Werbeeinblendungen, Klicks und Conversions;','Absturzprotokolle, Fehlerstapel und Leistungsdaten.']],
['h3','1.3 Abonnement- und Kaufdaten'],
['p','Wenn Sie über **Google Play oder den Apple App Store** abonnieren, werden Zahlung und Bestellabwicklung vom Store durchgeführt. Wir **erheben nicht unmittelbar Ihre Kartennummer, Ihr Zahlungspasswort oder ähnliche Zahlungsdaten**.'],
['p','Wir können vom Store die Informationen erhalten, die zur Prüfung von Ansprüchen, zur Wiederherstellung von Käufen und zur Bearbeitung von Rückerstattungsanfragen erforderlich sind, darunter:'],
['ul',['Produkt-ID, Abonnementstatus, Kauf- und Ablaufzeitpunkt;','Bestell-/Transaktionskennungen, Region;','**Apple kann Entwicklern eine Abonnenten-ID und den Kaufverlauf bereitstellen**, um das Abonnement zu identifizieren, Inhalte bereitzustellen und Rückerstattungsanfragen zu bearbeiten;','**Google Play Billing** kann den Kaufverlauf (Kaufstatus, Transaktionskennungen usw.) bereitstellen, um die Gültigkeit eines Abonnements zu bestätigen.']],
['p','Rückerstattungen und Zahlungsstreitigkeiten richten Sie bitte zunächst über die offiziellen Kanäle von Google Play oder Apple.'],
['h3','1.4 Werbebezogene Informationen'],
['p','Die App verwendet **Google AdMob (Google Mobile Ads SDK)** zur Anzeige von Werbung. Nach Googles öffentlicher Beschreibung der Datenpraktiken des SDK kann es Folgendes erheben, um Werbung auszuliefern, die Häufigkeit zu begrenzen, Betrug zu verhindern, die Wirkung zu messen und die SDK-Leistung zu verbessern:'],
['ul',['**IP-Adresse**, die zur Schätzung des ungefähren Gerätestandorts verwendet werden kann;','**Gerätekennungen**, einschließlich Werbe-IDs (Android Advertising ID / iOS IDFA, letztere unterliegt iOS ATT) oder anderer app-/entwicklerbezogener Kennungen;','**Werbedaten**, etwa die Ihnen angezeigten Anzeigen;','**Nutzerinteraktionen**, etwa App-Start-Taps und Videoaufrufe;','**Nicht mit Ihnen verknüpfte Absturzprotokolle, Diagnose- und Leistungsdaten**.']],
['p','AdMob kann diese Daten für Werbe- und Analysezwecke Dritter verwenden und verschlüsselt sie bei der Übertragung. Wo gesetzlich erforderlich (z. B. EWR, UK, Schweiz), holen wir Ihre Einwilligung über einen Consent-Dialog ein. Sie können das Werbe-Tracking einschränken, Ihre Werbe-ID zurücksetzen oder personalisierte Werbung in den Android-Werbeeinstellungen bzw. den iOS-„Tracking“-Einstellungen deaktivieren; nicht personalisierte Werbung kann weiterhin erscheinen.'],
['h3','1.5 Informationen, die Sie uns per E-Mail senden'],
['p','Wenn Sie uns per E-Mail kontaktieren, verarbeiten wir die von Ihnen angegebene E-Mail-Adresse, den Nachrichteninhalt und Anhänge ausschließlich zur Beantwortung und Bearbeitung Ihres Anliegens.'],
['notice',['**Wir erheben nicht von uns aus sensible personenbezogene Daten wie Kontakte, SMS, genauen Standort, biometrische Daten oder Gesundheitsdaten.** Sollte dies künftig erforderlich sein, informieren wir Sie und holen die gesetzlich erforderliche Einwilligung ein.']],
['h','2. App-Berechtigungen'],
['p','Wir fordern Berechtigungen nur an, wenn eine bestimmte Funktion sie benötigt. Sie können sie jederzeit in den Systemeinstellungen ablehnen oder widerrufen; die Ablehnung nicht wesentlicher Berechtigungen beeinträchtigt andere Funktionen nicht.'],

['**Mikrofon**','**Erfasst Audio nur beim Tippen auf „Aufnehmen“; Aufnahmen verbleiben in lokalen Projekten und werden nicht auf unsere Server hochgeladen**','**Für Aufnahmen erforderlich**'],
['Werbe-ID/Tracking (iOS ATT, falls zutreffend)','Personalisierte Werbung und Werbemessung','Optional; ablehnbar']]}],
['notice',['**Zur Mikrofonberechtigung:**','Sie wird nie beim Start oder in der Einführung angefragt; die Systemabfrage erscheint erst, wenn Sie die Aufnahmefunktion öffnen und auslösen. Bei Ablehnung funktionieren Import, Bearbeitung und Export weiterhin. Sie können die Berechtigung jederzeit in den Systemeinstellungen prüfen, ändern oder widerrufen.']],

['Bugly','Shenzhen Tencent Computer Systems Co., Ltd.','Absturzüberwachung, Fehlerbehebung, Leistungsanalyse','Absturzprotokolle, Stapel, Modell, OS- und App-Version, Netzwerkstatus, IP-Adresse usw.',SDK_ROWS_URL[1]],
['**Google AdMob (Google Mobile Ads SDK)**','**Google LLC**','**Werbeanzeige, Häufigkeitsbegrenzung, Betrugsprävention, Messung, SDK-Leistung**','**IP-Adresse, Gerätekennungen (einschl. Werbe-ID), Werbedaten, Nutzerinteraktionen, Absturzprotokolle, Diagnose- und Leistungsdaten**',SDK_ROWS_URL[2]],

['p','Wir können Drittanbieter-SDKs im Zuge von App-Updates ändern und informieren Sie über die In-App-Liste zur Weitergabe an Dritte oder Aktualisierungen dieser Erklärung.'],
['h','4. Wie wir Informationen verwenden'],
['ol',['Bereitstellung der Kernfunktionen: Audioimport, **Aufnahme**, Bearbeitung, Export und Teilen;','Prüfung von Abonnementansprüchen, Wiederherstellung von Käufen und Anzeige des Abonnementstatus;','Anzeige von Werbung über Google AdMob, Häufigkeitsbegrenzung, Messung der Werbewirkung und Betrugsprävention;','Analyse der Nutzung und Verbesserung von Funktionen und Nutzererlebnis;','Überwachung von Abstürzen, Fehlerbehebung und Gewährleistung von Stabilität und Sicherheit;','Beantwortung Ihrer Anfragen, Beschwerden und Rechteanfragen;','Einhaltung gesetzlicher und regulatorischer Anforderungen.']],
['p','Wir verwenden Ihre Audioinhalte (einschließlich Aufnahmen) nicht für Werbe-Targeting und verkaufen sie nicht an Dritte.'],
['h','5. Speicherung'],
['h3','5.1 Art und Dauer der Speicherung'],
['p','Ihre Audiodateien und Bearbeitungsdaten werden standardmäßig lokal auf Ihrem Gerät gespeichert; **auch Aufnahmen verbleiben in lokalen Projekten und werden nicht auf unsere Server hochgeladen**. Wir und Drittanbieter-SDKs speichern Informationen nur so lange, wie es für die genannten Zwecke erforderlich ist, es sei denn, Gesetze oder die Notwendigkeit der Streitbeilegung/Sicherheitsprüfung verlangen eine längere Aufbewahrung. Danach löschen oder anonymisieren wir sie.'],
['h3','5.2 Speicherort und grenzüberschreitende Übermittlung'],
['p','Wir speichern und verarbeiten Informationen hauptsächlich in China. Einige Dienste Dritter (z. B. **Google AdMob, Google Play und der Apple App Store**) können Daten im Ausland verarbeiten. Bei grenzüberschreitenden Übermittlungen erfüllen wir die gesetzlichen Pflichten zu Information, Einwilligung, Sicherheitsbewertung oder Standardvertragsklauseln und verpflichten Empfänger zu angemessenen Schutzmaßnahmen.'],
['h3','5.3 Bei Einstellung des Betriebs'],
['p','Wird die App eingestellt, informieren wir Sie in der App oder per Push-Benachrichtigung und löschen oder anonymisieren Ihre personenbezogenen Daten innerhalb eines angemessenen Zeitraums, sofern gesetzlich nichts anderes vorgeschrieben ist.'],
['h','6. Weitergabe, Übertragung und Offenlegung'],
['p','Wir verkaufen Ihre personenbezogenen Daten nicht. Außer in den folgenden Fällen geben wir sie nicht von uns aus weiter oder übertragen sie:'],
['ol',['Zur Bereitstellung von **Werbung (Google AdMob), Analysen (Umeng), Absturzüberwachung (Bugly) und Abonnementprüfung (Google Play / Apple)** teilen wir erforderliche Informationen mit diesen SDKs/Anbietern;','wenn Gesetze oder Justiz- bzw. Verwaltungsbehörden dies zwingend verlangen;','zum Schutz von Leben, Eigentum oder anderen wesentlichen berechtigten Interessen Ihnen oder Dritter, wenn eine Einwilligung schwer zu erlangen ist;','bei Informationen, die Sie selbst öffentlich gemacht haben oder die rechtmäßig öffentlich geworden sind;','bei Fusion, Übernahme oder Vermögensübertragung informieren wir Sie und verpflichten den neuen Verantwortlichen, diese Erklärung einzuhalten, oder holen – je nach Gesetzeslage – erneut Ihre Einwilligung ein.']],
['p','Wir legen Ihre personenbezogenen Daten nicht öffentlich offen, es sei denn, Sie willigen gesondert ein oder das Gesetz verlangt es.'],
['h','7. Ihre Rechte'],
['p','Im Rahmen des anwendbaren Rechts können Sie:'],
['ul',['Ihre personenbezogenen Daten **einsehen, berichtigen und löschen**;','**Ihre Einwilligung widerrufen**, indem Sie die **Mikrofonberechtigung** deaktivieren, Werbe-Tracking einschränken oder uns kontaktieren;','**Personalisierte Werbung deaktivieren** über die Android-Werbeeinstellungen oder die iOS-„Tracking“-Einstellungen;','**Abonnements verwalten** in den Abonnementeinstellungen von Google Play oder dem Apple App Store;','**Lokale Daten löschen** durch Löschen der App-Daten oder Deinstallieren der App;','**Beschwerde einlegen** per E-Mail an xieh6888@gmail.com; wir antworten innerhalb der gesetzlichen Frist.']],
['p','Da die App keine Konten hat, können wir Ihre Daten möglicherweise nicht über ein Konto zuordnen. Bei Anfragen bitten wir ggf. um Angaben zur Identitäts- und Anfrageprüfung.'],
['h','8. Datensicherheit'],
['p','Wir setzen angemessene technische und organisatorische Maßnahmen wie Verschlüsselung bei der Übertragung, Zugriffskontrolle und Datenminimierung ein, um Informationen vor Verlust, Missbrauch, unbefugtem Zugriff oder Offenlegung zu schützen. Keine Internetumgebung ist absolut sicher; eine 100%ige Sicherheit können wir nicht garantieren. Bei einem Sicherheitsvorfall mit personenbezogenen Daten aktivieren wir unseren Notfallplan, ergreifen Abhilfemaßnahmen und informieren Sie und die Aufsichtsbehörden wie gesetzlich vorgeschrieben.'],
['h','9. Schutz von Minderjährigen'],
['p','Die App richtet sich hauptsächlich an Erwachsene. Wenn Sie ein Kind unter 14 Jahren sind, nutzen Sie die App bitte nur mit Einwilligung und Anleitung eines Elternteils oder Erziehungsberechtigten. Wir erheben nicht von uns aus personenbezogene Daten von Kindern; stellen wir fest, dass dies ohne Einwilligung des Erziehungsberechtigten geschehen ist, löschen wir sie wie gesetzlich vorgeschrieben. Erziehungsberechtigte können sich unter xieh6888@gmail.com an uns wenden.'],
['h','10. Änderungen dieser Erklärung'],
['p','Wir können diese Erklärung von Zeit zu Zeit überarbeiten. Wir informieren Sie über ein In-App-Pop-up oder eine Ankündigung und geben Aktualisierungs- und Inkrafttretensdatum an. Bei wesentlichen Änderungen holen wir, wie gesetzlich erforderlich, erneut Ihre Einwilligung ein. Die weitere Nutzung der App gilt als Zustimmung zur aktualisierten Erklärung; andernfalls stellen Sie die Nutzung bitte ein.'],
['h','11. Kontakt'],
['contact',['**E-Mail für Datenschutzanliegen:** xieh6888@gmail.com','Wir bearbeiten Anfragen zügig und antworten innerhalb der gesetzlich vorgeschriebenen Frist.']]

es:{dir:'ltr',title:'Política de privacidad',footer:'© 2026 EditBook-AudioEditor · Mr. Xie',blocks:[
['meta',[['Producto: ','EditBook-AudioEditor'],['Última actualización: ','1 de noviembre de 2026'],['Fecha de entrada en vigor: ','1 de noviembre de 2026']]],
['p','EditBook-AudioEditor (la «Aplicación») es proporcionada por Mr. Xie («nosotros»). Entendemos la importancia de su información personal y trabajamos para protegerla. Esta política se aplica a la aplicación móvil EditBook-AudioEditor (Android/iOS) y a los servicios asociados. Explica cómo recopilamos, utilizamos, almacenamos, compartimos y protegemos su información, y cómo puede ejercer sus derechos.'],
['notice',['**Aviso importante:**','La Aplicación **no requiere cuenta**. No solicitamos su número de teléfono, nombre ni otros datos de registro. Lea esta política antes de usar la Aplicación; en el primer inicio se la mostraremos (por ejemplo, en una ventana emergente) y le pediremos su consentimiento. Si no está de acuerdo, no utilice la Aplicación.']],
['p','Si tiene preguntas, comentarios o quejas sobre esta política, contáctenos en xieh6888@gmail.com.'],
['h','1. Información que recopilamos'],
['p','Seguimos los principios de licitud, equidad, necesidad y buena fe, y solo recopilamos lo necesario para ofrecer las funciones de la Aplicación.'],
['h3','1.1 Audio que selecciona o graba'],
['p','La Aplicación es un editor de audio. Los archivos de audio que importa, el audio que graba con el micrófono, sus ediciones y los resultados exportados se **procesan localmente en su dispositivo de forma predeterminada**. No subimos su contenido de audio a nuestros servidores por iniciativa propia.'],
['p','Solo cuando utiliza funciones como «compartir/exportar a otra aplicación» se entrega un archivo, mediante la función de compartir del sistema de su dispositivo, a la aplicación que usted elija. Revise las prácticas de datos de esa aplicación.'],
['p','Solo accedemos a los archivos multimedia cuando usted los selecciona, **no escaneamos otros archivos de su dispositivo**, y el permiso de micrófono se **solicita y utiliza únicamente cuando pulsa la función de grabación**.'],
['h3','1.2 Información del dispositivo, registros y estadísticas de uso'],
['p','Para el funcionamiento de la Aplicación, los análisis, la resolución de problemas y la muestra de anuncios, nosotros y SDK de terceros podemos recopilar:'],
['ul',['Modelo del dispositivo, versión del sistema operativo, versión de la Aplicación, idioma y región;','Tipo y estado de la red, dirección IP;','Identificadores del dispositivo como Android Advertising ID, OAID, IDFA (si lo autoriza) y Android ID, según lo que recopile realmente cada SDK;','Estadísticas de inicio de la Aplicación, uso de páginas/funciones y clics;','Datos de impresiones, clics y conversiones publicitarias;','Registros de fallos, pilas de errores y datos de rendimiento.']],
['h3','1.3 Información de suscripciones y compras'],
['p','Si se suscribe a través de **Google Play o la App Store de Apple**, el pago y la gestión de pedidos los realiza la tienda. **No recopilamos directamente su número de tarjeta, contraseña de pago ni otros datos de pago similares**.'],
['p','Podemos recibir de la tienda la información necesaria para verificar derechos, restaurar compras y atender consultas de reembolso, incluida:'],
['ul',['ID del producto, estado de la suscripción, fecha de compra y de vencimiento;','Identificadores de pedido/transacción, región;','**Apple puede proporcionar a los desarrolladores un ID de suscriptor y el historial de compras** para identificar la suscripción, entregar contenido y ayudar con las solicitudes de reembolso;','**Google Play Billing** puede proporcionar el historial de compras (estado de la compra, identificadores de transacción, etc.) para confirmar la validez de la suscripción.']],
['p','Gestione los reembolsos y disputas de pago primero a través de los canales oficiales de Google Play o Apple.'],
['h3','1.4 Información publicitaria'],
['p','La Aplicación utiliza **Google AdMob (Google Mobile Ads SDK)** para mostrar anuncios. Según la descripción pública de Google sobre las prácticas de datos del SDK, este puede recopilar lo siguiente para la entrega de anuncios, la limitación de frecuencia, la prevención de fraude, la medición y el rendimiento del SDK:'],
['ul',['**Dirección IP**, que puede usarse para estimar la ubicación aproximada del dispositivo;','**Identificadores del dispositivo**, incluidos los identificadores publicitarios (Android Advertising ID / IDFA de iOS, este último sujeto al ATT de iOS) u otros identificadores propios de la aplicación o del desarrollador;','**Datos publicitarios**, como los anuncios que ve;','**Interacciones del usuario**, como toques de inicio de la aplicación y visualizaciones de vídeo;','**Registros de fallos, diagnósticos y datos de rendimiento** no vinculados a usted.']],
['p','AdMob puede usar estos datos con fines publicitarios y analíticos de terceros y los cifra en tránsito. Cuando la ley lo exige (p. ej., EEE, Reino Unido, Suiza), solicitamos su consentimiento mediante un diálogo de gestión del consentimiento. Puede limitar el seguimiento publicitario, restablecer su identificador publicitario o desactivar los anuncios personalizados en los ajustes de anuncios de Android o en los ajustes de «Seguimiento» de iOS; es posible que siga viendo anuncios no personalizados.'],
['h3','1.5 Información que nos envía por correo electrónico'],
['p','Si nos escribe, tratamos la dirección, el contenido del mensaje y los archivos adjuntos que proporcione, únicamente para responder y resolver su solicitud.'],
['notice',['**No recopilamos por iniciativa propia datos personales sensibles como contactos, SMS, ubicación precisa, datos biométricos o de salud.** Si esto cambiara, se lo notificaríamos y obtendríamos su consentimiento conforme a la ley.']],
['h','2. Permisos de la Aplicación'],
['p','Solicitamos permisos solo cuando una función concreta los necesita. Puede rechazarlos o revocarlos en los ajustes del sistema en cualquier momento; rechazar permisos no esenciales no afecta a otras funciones.'],

['**Micrófono**','**Captura audio solo cuando pulsa grabar; las grabaciones permanecen en proyectos locales y no se suben a nuestros servidores**','**Necesario para grabar**'],

it:{dir:'ltr',title:'Informativa sulla privacy',footer:'© 2026 EditBook-AudioEditor · Mr. Xie',blocks:[
['meta',[['Prodotto: ','EditBook-AudioEditor'],['Ultimo aggiornamento: ','1 novembre 2026'],['Data di entrata in vigore: ','1 novembre 2026']]],
['p','EditBook-AudioEditor (l’«App») è fornita da Mr. Xie («noi»). Siamo consapevoli dell’importanza dei Suoi dati personali e ci impegniamo a proteggerli. La presente informativa si applica all’app mobile EditBook-AudioEditor (Android/iOS) e ai servizi associati. Spiega come raccogliamo, utilizziamo, conserviamo, condividiamo e proteggiamo le informazioni e come Lei può esercitare i Suoi diritti.'],
['notice',['**Avviso importante:**','L’App **non richiede un account**. Non chiediamo il Suo numero di telefono, il Suo nome o altri dati di registrazione. La preghiamo di leggere la presente informativa prima di utilizzare l’App; al primo avvio La mostreremo (ad esempio in una finestra pop-up) e chiederemo il Suo consenso. Se non è d’accordo, non utilizzi l’App.']],
['p','Per domande, commenti o reclami relativi alla presente informativa, ci contatti all’indirizzo xieh6888@gmail.com.'],
['h','1. Informazioni che raccogliamo'],
['p','Seguiamo i principi di liceità, correttezza, necessità e buona fede e raccogliamo solo quanto necessario a fornire le funzionalità dell’App.'],
['h3','1.1 Audio che seleziona o registra'],
['p','L’App è un editor audio. I file audio che importa, l’audio registrato con il microfono, le modifiche e i risultati esportati sono **elaborati localmente sul Suo dispositivo per impostazione predefinita**. Non carichiamo i Suoi contenuti audio sui nostri server di nostra iniziativa.'],
['p','Solo quando utilizza funzioni come «condividi/esporta in un’altra app» un file viene trasferito, tramite la funzione di condivisione del sistema del Suo dispositivo, all’app che sceglie. La preghiamo di verificare le pratiche sui dati di tale app.'],
['p','Accediamo ai file multimediali solo quando Lei li seleziona, **non analizziamo altri file sul Suo dispositivo** e l’autorizzazione al microfono viene **richiesta e utilizzata solo quando tocca la funzione di registrazione**.'],
['h3','1.2 Informazioni sul dispositivo, log e statistiche di utilizzo'],
['p','Per il funzionamento dell’App, le statistiche, la risoluzione dei problemi e la visualizzazione di annunci pubblicitari, noi e SDK di terze parti possiamo raccogliere:'],
['ul',['Modello del dispositivo, versione del sistema operativo, versione dell’App, impostazioni di lingua e regione;','Tipo e stato della rete, indirizzo IP;','Identificatori del dispositivo quali Android Advertising ID, OAID, IDFA (se autorizzato) e Android ID, in base a quanto effettivamente raccolto da ciascun SDK;','Statistiche su avvio dell’App, utilizzo di pagine/funzioni e clic;','Dati su impressioni, clic e conversioni pubblicitarie;','Log di arresto anomalo, stack di errori e dati sulle prestazioni.']],
['h3','1.3 Informazioni su abbonamenti e acquisti'],
['p','Se si abbona tramite **Google Play o l’App Store di Apple**, il pagamento e la gestione degli ordini sono effettuati dallo store. **Non raccogliamo direttamente il Suo numero di carta, la password di pagamento o altri dati di pagamento simili**.'],
['p','Possiamo ricevere dallo store le informazioni necessarie per verificare i diritti, ripristinare gli acquisti e gestire le richieste di rimborso, tra cui:'],
['ul',['ID prodotto, stato dell’abbonamento, data di acquisto e di scadenza;','Identificatori di ordine/transazione, regione;','**Apple può fornire agli sviluppatori un ID abbonato e la cronologia degli acquisti** per identificare l’abbonamento, fornire i contenuti e assistere nelle richieste di rimborso;','**Google Play Billing** può fornire la cronologia degli acquisti (stato dell’acquisto, identificatori di transazione, ecc.) per confermare la validità dell’abbonamento.']],
['p','Per rimborsi e controversie di pagamento si rivolga innanzitutto ai canali ufficiali di Google Play o Apple.'],
['h3','1.4 Informazioni pubblicitarie'],
['p','L’App utilizza **Google AdMob (Google Mobile Ads SDK)** per mostrare annunci. Secondo la descrizione pubblica di Google delle pratiche di raccolta dati dell’SDK, questo può raccogliere quanto segue per la distribuzione degli annunci, il limite di frequenza, la prevenzione delle frodi, la misurazione e le prestazioni dell’SDK:'],
['ul',['**Indirizzo IP**, che può essere utilizzato per stimare la posizione approssimativa del dispositivo;','**Identificatori del dispositivo**, inclusi identificatori pubblicitari (Android Advertising ID / IDFA di iOS, quest’ultimo soggetto all’ATT di iOS) o altri identificatori propri dell’app o dello sviluppatore;','**Dati pubblicitari**, come gli annunci che visualizza;','**Interazioni dell’utente**, come tocchi di avvio dell’app e visualizzazioni di video;','**Log di arresto anomalo, diagnostica e dati sulle prestazioni** non collegati a Lei.']],
['p','AdMob può utilizzare tali dati per finalità pubblicitarie e analitiche di terze parti e li cifra durante la trasmissione. Ove richiesto dalla legge (ad es. SEE, Regno Unito, Svizzera), raccogliamo il Suo consenso tramite una finestra di gestione del consenso. Può limitare il tracciamento pubblicitario, reimpostare l’identificatore pubblicitario o disattivare gli annunci personalizzati nelle impostazioni annunci di Android o nelle impostazioni «Tracciamento» di iOS; potrebbero comunque essere mostrati annunci non personalizzati.'],
['h3','1.5 Informazioni che ci invia via e-mail'],
['p','Se ci contatta via e-mail, trattiamo l’indirizzo, il contenuto del messaggio e gli allegati forniti, esclusivamente per rispondere e risolvere la Sua richiesta.'],
['notice',['**Non raccogliamo di nostra iniziativa dati personali sensibili quali contatti, SMS, posizione precisa, dati biometrici o sanitari.** Qualora ciò dovesse cambiare, La informeremmo e otterremmo il consenso come previsto dalla legge.']],
['h','2. Autorizzazioni dell’App'],
['p','Richiediamo autorizzazioni solo quando una specifica funzione ne ha bisogno. Può rifiutarle o revocarle in qualsiasi momento nelle impostazioni di sistema; il rifiuto di autorizzazioni non essenziali non pregiudica le altre funzioni.'],
['table',{head:['Autorizzazione','Finalità','Necessaria?'],rows:[
['Rete','Caricare annunci, statistiche, segnalazioni di arresti anomali, verificare lo stato dell’abbonamento','Necessaria'],
['Archiviazione / contenuti multimediali / file','Importare, modificare ed esportare i file audio selezionati','Necessaria per tali funzioni'],
['**Microfono**','**Acquisisce audio solo quando tocca la registrazione; le registrazioni restano nei progetti locali e non vengono caricate sui nostri server**','**Necessaria per la registrazione**'],
['Identificatore pubblicitario / tracciamento (ATT iOS, se applicabile)','Annunci personalizzati e misurazione pubblicitaria','Facoltativa; può essere rifiutata']]}],
['notice',['**Informazioni sull’autorizzazione al microfono:**','Non viene mai richiesta all’avvio o durante la presentazione iniziale; la richiesta di sistema compare solo quando apre e avvia la registrazione. Se la rifiuta, importazione, modifica ed esportazione continuano a funzionare. Può consultarla, modificarla o revocarla in qualsiasi momento nelle impostazioni di sistema.']],
['h','3. SDK e servizi di terze parti'],
['table',{head:['SDK / servizio','Fornitore','Finalità','Informazioni possibilmente raccolte','Informativa sulla privacy'],rows:[
['Umeng Analytics','Umeng Tongxin (Beijing) Technology Co., Ltd.','Statistiche e analisi sull’utilizzo','Identificatori del dispositivo, modello, versione del sistema operativo, tipo di rete, versione dell’App, utilizzo di pagine/funzioni, indirizzo IP, ecc.',SDK_ROWS_URL[0]],
['Bugly','Shenzhen Tencent Computer Systems Co., Ltd.','Monitoraggio degli arresti anomali, risoluzione dei problemi, analisi delle prestazioni','Log di arresto anomalo, stack, modello, versioni del sistema operativo e dell’App, stato della rete, indirizzo IP, ecc.',SDK_ROWS_URL[1]],
['**Google AdMob (Google Mobile Ads SDK)**','**Google LLC**','**Visualizzazione di annunci, limite di frequenza, prevenzione delle frodi, misurazione, prestazioni dell’SDK**','**Indirizzo IP, identificatori del dispositivo (incluso l’identificatore pubblicitario), dati pubblicitari, interazioni dell’utente, log di arresto anomalo, diagnostica, dati sulle prestazioni**',SDK_ROWS_URL[2]],
['Google Play Billing','Google LLC','Abbonamenti e acquisti Android','ID prodotto, cronologia degli acquisti, identificatori di ordine/transazione, stato dell’abbonamento, regione, ecc.',SDK_ROWS_URL[3]],
['Apple App Store / Acquisti in-app','Apple Inc.','Abbonamenti e acquisti iOS','ID prodotto, ID abbonato, cronologia degli acquisti, identificatori di ordine/transazione, stato dell’abbonamento, regione, ecc.',SDK_ROWS_URL[4]]]}],
['p','Possiamo modificare gli SDK di terze parti con gli aggiornamenti dell’App e La informeremo tramite l’elenco di condivisione con terze parti nell’App o l’aggiornamento della presente informativa.'],
['h','4. Come utilizziamo le informazioni'],
['ol',['Fornire le funzioni principali: importazione audio, **registrazione**, modifica, esportazione e condivisione;','Verificare i diritti di abbonamento, ripristinare gli acquisti e mostrare lo stato dell’abbonamento;','Mostrare annunci tramite Google AdMob, limitarne la frequenza, misurarne le prestazioni e prevenire le frodi;','Analizzare l’utilizzo e migliorare funzioni ed esperienza;','Monitorare gli arresti anomali, risolvere i problemi e mantenere l’App stabile e sicura;','Rispondere alle Sue richieste, reclami e istanze relative ai diritti;','Rispettare le leggi e i requisiti normativi.']],
['p','Non utilizziamo i Suoi contenuti audio (incluse le registrazioni) per il targeting pubblicitario né li vendiamo a terzi.'],
['h','5. Conservazione'],
['h3','5.1 Modalità e durata'],
['p','I Suoi file audio e i dati di modifica sono memorizzati localmente sul Suo dispositivo per impostazione predefinita e **anche le registrazioni restano nei progetti locali e non vengono caricate sui nostri server**. Noi e gli SDK di terze parti conserviamo le informazioni solo per il periodo necessario alle finalità sopra indicate, salvo che la legge o l’esigenza di gestire controversie o audit di sicurezza richiedano un periodo più lungo. Trascorso tale periodo, le eliminiamo o le rendiamo anonime.'],
['h3','5.2 Luogo di conservazione e trasferimenti transfrontalieri'],
['p','Conserviamo e trattiamo le informazioni principalmente in Cina. Alcuni servizi di terze parti (come **Google AdMob, Google Play e l’App Store di Apple**) possono trattare dati all’estero. In caso di trasferimenti transfrontalieri, adempiremo agli obblighi di informativa, consenso, valutazione di sicurezza o clausole contrattuali tipo previsti dalla legge e richiederemo ai destinatari adeguate misure di protezione.'],
['h3','5.3 Cessazione del servizio'],
['p','Se l’App cessa l’attività, La informeremo tramite avviso nell’App o notifica push ed elimineremo o renderemo anonimi i Suoi dati personali entro un periodo ragionevole, salvo diversa disposizione di legge.'],
['h','6. Comunicazione, trasferimento e divulgazione'],
['p','Non vendiamo i Suoi dati personali. Salvo nei seguenti casi, non li condividiamo né li trasferiamo di nostra iniziativa:'],
['ol',['Per fornire funzioni di **pubblicità (Google AdMob), statistiche (Umeng), monitoraggio degli arresti anomali (Bugly) e verifica degli abbonamenti (Google Play / Apple)**, condividiamo le informazioni necessarie con tali SDK/fornitori;','Quando richiesto dalla legge o da autorità giudiziarie o amministrative;','Per proteggere la vita, il patrimonio o altri interessi legittimi rilevanti Suoi o di terzi quando sia difficile ottenere il consenso;','Informazioni da Lei rese pubbliche o divenute pubbliche lecitamente;','In caso di fusione, acquisizione o cessione di beni, La informeremo e richiederemo al nuovo titolare di rispettare la presente informativa o otterremo nuovamente il Suo consenso come previsto dalla legge.']],
['p','Non divulghiamo pubblicamente i Suoi dati personali salvo Suo consenso separato o obbligo di legge.'],
['h','7. I Suoi diritti'],
['p','Nei limiti della legge applicabile, Lei può:'],
['ul',['**Accedere, rettificare e cancellare** i Suoi dati personali;','**Revocare il consenso** disattivando l’**autorizzazione al microfono** o limitando il tracciamento pubblicitario nelle impostazioni di sistema, oppure contattandoci;','**Disattivare gli annunci personalizzati** tramite le impostazioni annunci di Android o le impostazioni «Tracciamento» di iOS;','**Gestire gli abbonamenti** nelle impostazioni di abbonamento di Google Play o dell’App Store di Apple;','**Eliminare i dati locali** cancellando i dati dell’App o disinstallandola;','**Presentare un reclamo** scrivendo a xieh6888@gmail.com; risponderemo entro il termine di legge.']],
['p','Poiché l’App non prevede account, potremmo non essere in grado di individuare i Suoi dati tramite un account. In caso di richiesta, potremmo chiederLe le informazioni necessarie a verificare la Sua identità e la richiesta.'],
['h','8. Sicurezza delle informazioni'],
['p','Adottiamo misure tecniche e organizzative ragionevoli, come la cifratura in transito, il controllo degli accessi e la minimizzazione dei dati, per proteggere le informazioni da perdita, uso improprio, accesso non autorizzato o divulgazione. Nessun ambiente Internet è assolutamente sicuro, pertanto non possiamo garantire una sicurezza al 100%. In caso di incidente di sicurezza dei dati personali, attiveremo il piano di risposta, adotteremo misure correttive e informeremo Lei e le autorità come previsto dalla legge.'],
['h','9. Protezione dei minori'],
['p','L’App è destinata principalmente agli adulti. Se ha meno di 14 anni, La preghiamo di utilizzarla con il consenso e la guida di un genitore o tutore. Non raccogliamo di nostra iniziativa dati personali dei minori; qualora rilevassimo una raccolta senza il consenso del tutore, li elimineremo come previsto dalla legge. I tutori che ne venissero a conoscenza possono contattarci a xieh6888@gmail.com.'],
['h','10. Modifiche alla presente informativa'],
['p','Possiamo rivedere la presente informativa di tanto in tanto. La informeremo tramite una finestra pop-up o un avviso nell’App e indicheremo le date di aggiornamento ed entrata in vigore. In caso di modifiche sostanziali, otterremo nuovamente il Suo consenso come previsto dalla legge. L’uso continuato dell’App implica l’accettazione dell’informativa aggiornata; in caso contrario, La preghiamo di interromperne l’uso.'],
['h','11. Contatti'],
['contact',['**E-mail di contatto per la privacy:** xieh6888@gmail.com','Gestiremo le richieste tempestivamente e risponderemo entro il termine previsto dalla legge.']]
]},

['p','本ポリシーに関するご質問、ご意見、苦情は xieh6888@gmail.com までお寄せください。'],
['h','1. 当方が収集する情報'],
['p','当方は、適法性・公正性・必要性・誠実性の原則に従い、本アプリの機能提供に必要な情報のみを収集します。'],
['h3','1.1 お客様が選択または録音した音声'],

['p','「共有／他のアプリへ書き出し」等の機能を能動的にご利用になった場合に限り、端末のシステム共有機能を通じて、お客様が選択したアプリへファイルが渡されます。当該アプリの情報取扱いについてはご確認ください。'],
['p','当方がメディアファイルにアクセスするのはお客様がファイルを選択したときのみで、**端末内の他のファイルをスキャンすることはありません**。マイク権限も、**お客様が録音機能をタップしたときにのみ要求・使用**されます。'],
['h3','1.2 端末情報、ログおよび利用統計'],
['p','アプリの動作、統計分析、障害調査および広告表示のため、当方および第三者SDKは以下を収集する場合があります：'],
['ul',['端末の機種、OSバージョン、アプリバージョン、言語および地域設定；','ネットワーク種別、ネットワーク状態、IPアドレス；','Android Advertising ID、OAID、IDFA（同意された場合）、Android ID 等の端末識別子（各SDKの実際の収集内容によります）；','アプリの起動、ページ／機能の利用、クリック等の統計情報；','広告の表示、クリックおよびコンバージョンデータ；','クラッシュログ、エラースタック、パフォーマンスデータ。']],
['h3','1.3 サブスクリプションおよび購入情報'],
['p','**Google Play または Apple App Store** を通じてサブスクリプションを購入された場合、決済および注文処理は各ストアが行います。当方が**お客様のカード番号、決済パスワード等の決済情報を直接収集することはありません**。'],
['p','当方は、購入権利の確認、購入の復元および返金に関するお問い合わせ対応に必要な情報をストアから取得する場合があります。具体的には：'],
['ul',['商品ID、サブスクリプションの状態、購入日時、有効期限；','注文／取引識別子、地域；','**Apple が開発者にサブスクライバーIDおよび購入履歴を提供する場合があり**、サブスクリプションの特定、コンテンツ提供および返金対応に利用されます；','**Google Play の課金サービス**が購入履歴（購入状態、取引識別子等）を提供し、サブスクリプションの有効性確認に利用される場合があります。']],
['p','返金および決済に関する紛争は、まず Google Play または Apple の公式窓口へご連絡ください。'],
['h3','1.4 広告に関する情報'],
['p','本アプリは **Google AdMob（Google Mobile Ads SDK）** を利用して広告を表示します。Google が公表する Mobile Ads SDK のデータ収集慣行によれば、SDK は広告配信、フリークエンシーキャップ、不正防止、効果測定および SDK の性能改善のために以下を収集する場合があります：'],
['ul',['**IPアドレス**（端末のおおよその位置の推定に使用される場合があります）；','**端末ID**（Android Advertising ID／iOS IDFA（iOS ATT の対象）その他アプリ／開発者単位の識別子を含む）；','**広告データ**（表示された広告等）；','**ユーザーインタラクション**（アプリ起動時のタップ、動画視聴等）；','**お客様に紐付かないクラッシュログ、診断情報およびパフォーマンスデータ**。']],
['p','AdMob はこれらのデータを第三者による広告および分析の目的で利用する場合があり、転送時に暗号化します。法令上必要な場合（欧州経済領域、英国、スイス等）、当方は同意管理ダイアログを通じて同意を取得します。Android の広告設定または iOS の「トラッキング」設定で、広告トラッキングの制限、広告識別子のリセット、パーソナライズ広告の停止が可能です。停止後も非パーソナライズ広告が表示される場合があります。'],
['h3','1.5 メールでお問い合わせいただいた情報'],
['p','メールでお問い合わせいただいた場合、当方はお客様が提供されたメールアドレス、本文および添付ファイルを、お問い合わせへの回答および解決のみに利用します。'],
['notice',['**当方は、連絡先、SMS、正確な位置情報、生体情報、健康情報等の機微な個人情報を能動的に収集することはありません。**将来必要となった場合は、別途お知らせし、法令に従い同意を取得します。']],

['p','본 앱은 오디오 편집 도구입니다. 이용자가 가져온 오디오 파일, 마이크로 녹음한 오디오, 편집 작업 및 내보내기 결과는 **기본적으로 이용자의 기기에서 로컬로 처리**되며, 당사는 이용자의 오디오를 당사 서버로 능동적으로 업로드하지 않습니다.'],

['p','본 앱은 계정이 필요하지 않으므로 계정으로 이용자의 정보를 특정하지 못할 수 있습니다. 권리 요청 시 본인 확인 및 요청 내용 확인에 필요한 정보를 요청할 수 있습니다.'],

['h','9. 미성년자 보호'],

['h','10. 방침의 변경'],

]},

pt:{dir:'ltr',title:'Política de Privacidade',footer:'© 2026 EditBook-AudioEditor · Mr. Xie',blocks:[
['meta',[['Produto: ','EditBook-AudioEditor'],['Última atualização: ','1º de novembro de 2026'],['Data de vigência: ','1º de novembro de 2026']]],
['p','O EditBook-AudioEditor (o “Aplicativo”) é fornecido por Mr. Xie (“nós”). Entendemos a importância das suas informações pessoais e trabalhamos para protegê-las. Esta política se aplica ao aplicativo móvel EditBook-AudioEditor (Android/iOS) e aos serviços relacionados. Ela explica como coletamos, usamos, armazenamos, compartilhamos e protegemos suas informações, e como você pode exercer seus direitos.'],
['notice',['**Aviso importante:**','O Aplicativo **não exige conta**. Não solicitamos seu número de telefone, nome ou outros dados de cadastro. Leia esta política antes de usar o Aplicativo; no primeiro uso, mostraremos a política (por exemplo, em uma janela pop-up) e pediremos seu consentimento. Se você não concordar, não use o Aplicativo.']],
['p','Se tiver dúvidas, comentários ou reclamações sobre esta política, entre em contato pelo e-mail xieh6888@gmail.com.'],
['h','1. Informações que coletamos'],
['p','Seguimos os princípios da legalidade, lealdade, necessidade e boa-fé e coletamos apenas o necessário para fornecer as funcionalidades do Aplicativo.'],
['h3','1.1 Áudio que você seleciona ou grava'],
['p','O Aplicativo é um editor de áudio. Os arquivos de áudio que você importa, o áudio gravado com o microfone, suas edições e os resultados exportados são **processados localmente no seu dispositivo por padrão**. Não enviamos seu conteúdo de áudio aos nossos servidores por iniciativa própria.'],
['p','Somente quando você usa funções como “compartilhar/exportar para outro aplicativo” é que um arquivo é entregue, por meio da função de compartilhamento do sistema do seu dispositivo, ao aplicativo que você escolher. Verifique as práticas de dados desse aplicativo.'],
['p','Acessamos arquivos de mídia apenas quando você os seleciona, **não verificamos outros arquivos no seu dispositivo**, e a permissão de microfone é **solicitada e usada somente quando você toca na função de gravação**.'],
['h3','1.2 Informações do dispositivo, registros e estatísticas de uso'],
['p','Para o funcionamento do Aplicativo, análises, solução de problemas e exibição de anúncios, nós e SDKs de terceiros podemos coletar:'],
['ul',['Modelo do dispositivo, versão do sistema operacional, versão do Aplicativo, idioma e região;','Tipo e estado da rede, endereço IP;','Identificadores do dispositivo, como Android Advertising ID, OAID, IDFA (se você autorizar) e Android ID, conforme o que cada SDK realmente coleta;','Estatísticas de abertura do Aplicativo, uso de páginas/funções e cliques;','Dados de impressão, clique e conversão de anúncios;','Registros de falhas, pilhas de erros e dados de desempenho.']],
['h3','1.3 Informações de assinatura e compra'],
['p','Se você assinar pelo **Google Play ou pela Apple App Store**, o pagamento e o processamento de pedidos são realizados pela loja. **Não coletamos diretamente o número do seu cartão, senha de pagamento ou dados de pagamento semelhantes**.'],
['p','Podemos receber da loja as informações necessárias para verificar direitos, restaurar compras e tratar solicitações de reembolso, incluindo:'],
['ul',['ID do produto, status da assinatura, data da compra e de expiração;','Identificadores de pedido/transação, região;','**A Apple pode fornecer aos desenvolvedores um ID de assinante e o histórico de compras** para identificar a assinatura, entregar conteúdo e auxiliar em solicitações de reembolso;','O **Google Play Billing** pode fornecer o histórico de compras (status da compra, identificadores de transação etc.) para confirmar a validade da assinatura.']],
['p','Trate reembolsos e disputas de pagamento primeiro pelos canais oficiais do Google Play ou da Apple.'],
['h3','1.4 Informações de publicidade'],
['p','O Aplicativo usa o **Google AdMob (Google Mobile Ads SDK)** para exibir anúncios. Segundo a descrição pública do Google sobre as práticas de coleta de dados do SDK, ele pode coletar o seguinte para veiculação de anúncios, limitação de frequência, prevenção de fraude, medição e desempenho do SDK:'],
['ul',['**Endereço IP**, que pode ser usado para estimar a localização aproximada do dispositivo;','**Identificadores do dispositivo**, incluindo identificadores de publicidade (Android Advertising ID / IDFA do iOS, este último sujeito ao ATT do iOS) ou outros identificadores próprios do aplicativo/desenvolvedor;','**Dados de publicidade**, como os anúncios que você vê;','**Interações do usuário**, como toques de abertura do aplicativo e visualizações de vídeo;','**Registros de falhas, diagnósticos e dados de desempenho** não vinculados a você.']],
['p','O AdMob pode usar esses dados para fins publicitários e analíticos de terceiros e os criptografa em trânsito. Quando exigido por lei (por exemplo, EEE, Reino Unido, Suíça), solicitamos seu consentimento por meio de uma janela de gerenciamento de consentimento. Você pode limitar o rastreamento de anúncios, redefinir o identificador de publicidade ou desativar anúncios personalizados nas configurações de anúncios do Android ou nas configurações de “Rastreamento” do iOS; ainda poderá ver anúncios não personalizados.'],
['h3','1.5 Informações que você nos envia por e-mail'],
['p','Se você nos enviar um e-mail, tratamos o endereço, o conteúdo da mensagem e os anexos fornecidos, exclusivamente para responder e resolver sua solicitação.'],
['notice',['**Não coletamos por iniciativa própria dados pessoais sensíveis, como contatos, SMS, localização precisa, dados biométricos ou de saúde.** Se isso mudar, informaremos você e obteremos o consentimento conforme a lei.']],
['h','2. Permissões do Aplicativo'],

['h3','5.2 Local de armazenamento e transferências internacionais'],

['ol',['Para fornecer funções de **publicidade (Google AdMob), estatísticas (Umeng), monitoramento de falhas (Bugly) e verificação de assinaturas (Google Play / Apple)**, compartilhamos as informações necessárias com esses SDKs/fornecedores;','Quando exigido por lei ou por autoridades judiciais ou administrativas;','Para proteger a vida, o patrimônio ou outros interesses legítimos relevantes seus ou de terceiros quando for difícil obter seu consentimento;','Informações que você tornou públicas ou que se tornaram públicas licitamente;','Em caso de fusão, aquisição ou transferência de ativos, informaremos você e exigiremos que o novo controlador permaneça vinculado a esta política ou obteremos novamente seu consentimento conforme a lei.']],
['p','Não divulgamos publicamente suas informações pessoais, exceto com seu consentimento separado ou quando a lei exigir.'],

['p','ไฟล์เสียงและข้อมูลการแก้ไขของคุณถูกจัดเก็บไว้ในอุปกรณ์ของคุณตามค่าเริ่มต้น และ**การบันทึกเสียงก็อยู่ในโปรเจกต์ภายในเครื่องและไม่ถูกอัปโหลดไปยังเซิร์ฟเวอร์ของเรา** เราและ SDK ของบุคคลภายนอกเก็บรักษาข้อมูลเท่าที่จำเป็นสำหรับวัตถุประสงค์ข้างต้น เว้นแต่กฎหมายหรือความจำเป็นในการจัดการข้อพิพาท/การตรวจสอบความปลอดภัยกำหนดให้เก็บนานกว่า หลังจากนั้นเราจะลบหรือทำให้ข้อมูลไม่สามารถระบุตัวตนได้'],
['h3','5.2 สถานที่จัดเก็บและการโอนข้ามพรมแดน'],
['p','เราเก็บรักษาและประมวลผลข้อมูลในประเทศจีนเป็นหลัก บริการของบุคคลภายนอกบางราย (เช่น **Google AdMob, Google Play และ Apple App Store**) อาจประมวลผลข้อมูลในต่างประเทศ หากมีการโอนข้ามพรมแดน เราจะปฏิบัติตามหน้าที่ในการแจ้ง การขอความยินยอม การประเมินความปลอดภัย หรือข้อสัญญามาตรฐานตามที่กฎหมายกำหนด และกำหนดให้ผู้รับข้อมูลใช้มาตรการคุ้มครองที่เหมาะสม'],
['h3','5.3 เมื่อผลิตภัณฑ์ยุติการให้บริการ'],
['p','หากแอปยุติการให้บริการ เราจะแจ้งให้คุณทราบผ่านประกาศในแอปหรือการแจ้งเตือนแบบพุช และลบหรือทำให้ข้อมูลส่วนบุคคลของคุณไม่สามารถระบุตัวตนได้ภายในระยะเวลาที่เหมาะสม เว้นแต่กฎหมายจะกำหนดไว้เป็นอย่างอื่น'],
['h','6. การแบ่งปัน การโอน และการเปิดเผยข้อมูล'],
['p','เราไม่ขายข้อมูลส่วนบุคคลของคุณ นอกเหนือจากกรณีต่อไปนี้ เราจะไม่แบ่งปันหรือโอนข้อมูลโดยพลการ:'],
['ol',['เพื่อให้บริการฟังก์ชัน **โฆษณา (Google AdMob) สถิติ (Umeng) การตรวจสอบการขัดข้อง (Bugly) และการตรวจสอบการสมัครสมาชิก (Google Play / Apple)** เราจะแบ่งปันข้อมูลที่จำเป็นกับ SDK/ผู้ให้บริการดังกล่าว;','เมื่อกฎหมายหรือหน่วยงานตุลาการหรือปกครองกำหนดให้เปิดเผย;','เพื่อปกป้องชีวิต ทรัพย์สิน หรือผลประโยชน์อันชอบด้วยกฎหมายที่สำคัญอื่นของคุณหรือของผู้อื่นเมื่อไม่สามารถขอความยินยอมได้;','ข้อมูลที่คุณเปิดเผยต่อสาธารณะเองหรือที่เปิดเผยต่อสาธารณะโดยชอบด้วยกฎหมาย;','ในกรณีการควบรวม การเข้าซื้อกิจการ หรือการโอนสินทรัพย์ เราจะแจ้งให้คุณทราบและกำหนดให้ผู้ควบคุมข้อมูลรายใหม่ยังคงผูกพันตามนโยบายนี้ หรือขอความยินยอมจากคุณใหม่ตามกฎหมาย']],
['p','เราไม่เปิดเผยข้อมูลส่วนบุคคลของคุณต่อสาธารณะ เว้นแต่ได้รับความยินยอมแยกต่างหากจากคุณหรือกฎหมายกำหนดไว้เป็นอย่างอื่น'],
['h','7. สิทธิของคุณ'],
['p','ภายในขอบเขตของกฎหมายที่ใช้บังคับ คุณมีสิทธิ:'],
['ul',['**เข้าถึง แก้ไข และลบ**ข้อมูลส่วนบุคคลของคุณ;','**ถอนความยินยอม**โดยปิด**สิทธิ์ไมโครโฟน**หรือจำกัดการติดตามโฆษณาในการตั้งค่าระบบ หรือติดต่อเรา;','**ปิดโฆษณาเฉพาะบุคคล**ผ่านการตั้งค่าโฆษณาของ Android หรือการตั้งค่า “การติดตาม” ของ iOS;','**จัดการการสมัครสมาชิก**ในการตั้งค่าการสมัครสมาชิกของ Google Play หรือ Apple App Store;','**ลบข้อมูลภายในเครื่อง**โดยล้างข้อมูลแอปหรือถอนการติดตั้งแอป;','**ร้องเรียนหรือแจ้งเบาะแส**ได้ที่ xieh6888@gmail.com เราจะตอบกลับภายในระยะเวลาตามที่กฎหมายกำหนด']],
['p','เนื่องจากแอปไม่มีบัญชีผู้ใช้ เราอาจไม่สามารถระบุข้อมูลของคุณผ่านบัญชีได้ เมื่อคุณส่งคำขอ เราอาจขอข้อมูลที่จำเป็นเพื่อยืนยันตัวตนและคำขอของคุณ'],
['h','8. ความปลอดภัยของข้อมูล'],
['p','เราใช้มาตรการทางเทคนิคและการจัดการที่เหมาะสม เช่น การเข้ารหัสระหว่างการส่ง การควบคุมการเข้าถึง และการเก็บข้อมูลเท่าที่จำเป็น เพื่อปกป้องข้อมูลจากการสูญหาย การใช้งานในทางที่ผิด การเข้าถึงโดยไม่ได้รับอนุญาต หรือการเปิดเผย อย่างไรก็ตาม สภาพแวดล้อมอินเทอร์เน็ตไม่มีความปลอดภัยแบบสมบูรณ์ ดังนั้นเราจึงไม่สามารถรับประกันความปลอดภัยได้ 100% หากเกิดเหตุการณ์ความปลอดภัยของข้อมูลส่วนบุคคล เราจะเริ่มแผนตอบสนอง ใช้มาตรการแก้ไข และแจ้งให้คุณและหน่วยงานกำกับดูแลทราบตามกฎหมาย'],
['h','9. การคุ้มครองผู้เยาว์'],
['p','แอปนี้มุ่งเป้าหมายหลักไปที่ผู้ใหญ่ หากคุณเป็นเด็กอายุต่ำกว่า 14 ปี โปรดใช้งานภายใต้ความยินยอมและการแนะนำของผู้ปกครองหรือผู้ดูแล เราไม่เก็บรวบรวมข้อมูลส่วนบุคคลของเด็กโดยพลการ หากพบว่าเราเก็บรวบรวมโดยไม่ได้รับความยินยอมจากผู้ปกครอง เราจะลบข้อมูลนั้นตามกฎหมาย ผู้ปกครองที่พบเห็นสามารถติดต่อเราได้ที่ xieh6888@gmail.com'],
['h','10. การเปลี่ยนแปลงนโยบายนี้'],
['p','เราอาจปรับปรุงนโยบายนี้เป็นครั้งคราว เราจะแจ้งให้คุณทราบผ่านป๊อปอัปหรือประกาศในแอป และระบุวันที่อัปเดตและวันที่มีผลบังคับใช้ ในกรณีที่มีการเปลี่ยนแปลงที่สำคัญ เราจะขอความยินยอมจากคุณใหม่ตามกฎหมาย การใช้แอปต่อไปถือว่าคุณยอมรับนโยบายที่อัปเดตแล้ว หากคุณไม่ยินยอม โปรดหยุดใช้งาน'],
['h','11. ติดต่อเรา'],
['contact',['**อีเมลติดต่อด้านความเป็นส่วนตัว:** xieh6888@gmail.com','เราจะดำเนินการตามคำขออย่างรวดเร็วและตอบกลับภายในระยะเวลาที่กฎหมายกำหนด']]
]},
