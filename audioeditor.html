<style>
  :root{
    --bg:#ffffff;
    --bg-soft:#f6f8fa;
    --card:#f7f9fa;
    --card-border:#e6eaee;
    --cyan:#00a892;
    --violet:#6b4dff;
    --text:#0d1117;
    --muted:#5b6570;
    --radius:20px;
    --safe-bottom:env(safe-area-inset-bottom,0px);
    --safe-top:env(safe-area-inset-top,0px);
    --soft:#f2f2f2;
    --line:#e6eaee;
  }

  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}

  html{
    background:var(--bg);
    color-scheme:light;
    -webkit-text-size-adjust:100%;
    text-size-adjust:100%;
  }

  body{
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,"Helvetica Neue","PingFang SC","Microsoft YaHei","Noto Sans Arabic","Noto Sans Thai","Noto Sans Devanagari","Noto Sans JP","Noto Sans KR",sans-serif;
    color:var(--text);
    min-height:100vh;
    line-height:1.6;
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
    text-size-adjust:100%;
  }

  a,button{touch-action:manipulation;cursor:pointer}

  /* ——— 动态背景（浅色） ——— */
  .bg-glow{
    position:fixed;inset:0;z-index:0;pointer-events:none;
    background:
      radial-gradient(ellipse 80% 50% at 50% -10%, rgba(0,168,146,.10), transparent 60%),
      radial-gradient(ellipse 60% 40% at 85% 40%, rgba(107,77,255,.07), transparent 60%),
      radial-gradient(ellipse 50% 30% at 10% 80%, rgba(0,168,146,.05), transparent 60%);
  }

  .bg-grid{
    position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.55;
    background-image:
      linear-gradient(rgba(13,17,23,.045) 1px,transparent 1px),
      linear-gradient(90deg,rgba(13,17,23,.045) 1px,transparent 1px);
    background-size:48px 48px;
    mask-image:radial-gradient(ellipse 70% 60% at 50% 30%,#000 20%,transparent 70%);
    -webkit-mask-image:radial-gradient(ellipse 70% 60% at 50% 30%,#000 20%,transparent 70%);
  }

  /* ——— 声波装饰 ——— */
  .wave-rail{
    position:fixed;left:0;right:0;bottom:0;height:180px;z-index:0;pointer-events:none;
    display:flex;align-items:flex-end;justify-content:center;gap:4px;
    opacity:.14;overflow:hidden;
  }
  .wave-rail span{
    width:3px;border-radius:3px;background:var(--cyan);
    animation:wavePulse 2.8s ease-in-out infinite;
    flex-shrink:0;
    will-change:height;
  }
  @keyframes wavePulse{
    0%,100%{height:12px;opacity:.35}
    50%{height:90px;opacity:1}
  }

  .page{position:relative;z-index:1;max-width:520px;margin:0 auto;padding:0 20px calc(48px + var(--safe-bottom))}

  /* ——— 顶栏：品牌 + 语言选择器 ——— */
  .top-bar{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:calc(20px + var(--safe-top)) 0 8px;
    position:relative;z-index:60;
  }
  .brand{
    display:flex;align-items:center;gap:8px;
    font-size:13px;font-weight:600;letter-spacing:.08em;
    color:var(--muted);text-transform:uppercase;
    direction:ltr;
    flex-shrink:1;
    min-width:0;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .brand-dot{width:6px;height:6px;border-radius:50%;background:var(--cyan);box-shadow:0 0 8px rgba(0,168,146,.6);flex:none}

  /* ——— 语言选择器 ——— */
  .lang-picker{position:relative;z-index:50;flex:none}
  .lang-btn{display:flex;align-items:center;gap:7px;border:1px solid var(--cyan);border-radius:999px;padding:6px 11px;background:#fff;color:var(--cyan);font:inherit;font-size:13px;line-height:1.2;cursor:pointer;-webkit-tap-highlight-color:transparent}
  .lang-btn svg{width:16px;height:16px;fill:var(--cyan);flex:none}
  .lang-btn .cur{max-width:100px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .lang-btn .chev{border-left:4px solid transparent;border-right:4px solid transparent;border-top:5px solid var(--cyan);transition:transform .15s}
  .lang-btn[aria-expanded="true"] .chev{transform:rotate(180deg)}
  .lang-menu{display:none;position:absolute;top:calc(100% + 6px);inset-inline-end:0;width:220px;max-width:calc(100vw - 32px);max-height:min(60vh,420px);overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;margin:0;padding:6px;list-style:none;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.15)}
  .lang-menu.open{display:block}
  .lang-menu li{margin:0;padding:11px 14px;border-radius:8px;font-size:15px;line-height:1.3;cursor:pointer;color:var(--text);-webkit-tap-highlight-color:transparent}
  .lang-menu li:hover{background:var(--soft)}
  .lang-menu li[aria-selected="true"]{background:rgba(0,168,146,.10);color:var(--cyan);font-weight:600}

  /* ——— 主视觉 ——— */
  .hero{text-align:center;padding:20px 0 36px}

  .app-icon-wrap{
    width:92px;height:92px;margin:0 auto 22px;border-radius:24px;
    background:#fff;overflow:hidden;
    border:1px solid rgba(13,17,23,.06);
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 8px 28px -8px rgba(13,17,23,.18), 0 2px 8px -2px rgba(13,17,23,.08);
    position:relative;
  }
  .app-icon-wrap img{
    width:100%;height:100%;display:block;object-fit:cover;border-radius:23px;
  }

  .app-title{
    font-size:30px;font-weight:800;letter-spacing:-.02em;line-height:1.25;margin-bottom:6px;
    background:linear-gradient(135deg,#0d1117 15%,#0a8f7d 60%,#5b3df5);
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  }
  .app-subtitle{
    font-size:14px;color:var(--muted);font-weight:400;letter-spacing:.02em;
    margin-bottom:28px;
  }

  /* ——— 下载按钮 ——— */
  .download-group{
    display:flex;flex-direction:column;gap:12px;margin-bottom:14px;
  }
  .store-btn{
    display:flex;align-items:center;gap:14px;
    width:100%;padding:14px 20px;border-radius:16px;
    text-decoration:none;color:#fff;
    background:#101419;
    border:1px solid #101419;
    box-shadow:0 6px 20px -10px rgba(13,17,23,.55);
    transition:transform .18s ease,background .18s ease,box-shadow .18s ease;
    position:relative;overflow:hidden;
  }
  .store-btn:active{transform:scale(.975)}
  .store-btn::before{
    content:"";position:absolute;inset:0;
    background:linear-gradient(135deg,rgba(0,229,195,.16),transparent 55%);
    opacity:0;transition:opacity .2s;
  }

  .store-icon{
    width:38px;height:38px;flex-shrink:0;border-radius:10px;
    display:flex;align-items:center;justify-content:center;
    background:rgba(255,255,255,.10);
  }
  .store-icon svg{width:22px;height:22px}

  .store-text{flex:1;text-align:left;min-width:0}
  .store-small{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.55);font-weight:500;line-height:1.3;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .store-name{font-size:16px;font-weight:700;line-height:1.3;margin-top:1px;color:#fff;display:block}

  .store-arrow{
    flex-shrink:0;opacity:.45;transition:transform .18s,opacity .18s;color:#fff;
  }

  .btn-apple .store-icon{background:rgba(255,255,255,.12)}
  .btn-google .store-icon{background:rgba(66,133,244,.22)}
  .btn-apk .store-icon{background:rgba(61,220,132,.22)}
  .store-btn[hidden]{display:none}

  .download-hint{
    text-align:center;font-size:12px;color:var(--muted);margin-bottom:48px;
    letter-spacing:.02em;
  }

  /* ——— 区块通用 ——— */
  .section{margin-bottom:44px}
  .section-label{
    font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
    color:var(--muted);margin-bottom:18px;display:flex;align-items:center;gap:10px;
  }
  .section-label::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,rgba(13,17,23,.12),transparent)}

  /* ——— 功能卡片 ——— */
  .feature-grid{
    display:grid;grid-template-columns:1fr 1fr;gap:10px;
  }
  .feature-card{
    padding:18px 16px;border-radius:var(--radius);
    background:var(--card);border:1px solid var(--card-border);
    transition:border-color .2s,background .2s,box-shadow .2s;
  }
  .feature-icon{
    width:34px;height:34px;border-radius:10px;margin-bottom:12px;
    display:flex;align-items:center;justify-content:center;font-size:16px;
    background:rgba(0,168,146,.10);
  }
  .feature-card:nth-child(2) .feature-icon{background:rgba(107,77,255,.10)}
  .feature-card:nth-child(3) .feature-icon{background:rgba(255,160,40,.14)}
  .feature-card:nth-child(4) .feature-icon{background:rgba(0,168,146,.08)}
  .feature-card:nth-child(5) .feature-icon{background:rgba(107,77,255,.09)}
  .feature-card:nth-child(6) .feature-icon{background:rgba(255,160,40,.11)}
  .feature-title{font-size:14px;font-weight:700;margin-bottom:4px;color:var(--text);letter-spacing:-.01em}
  .feature-desc{font-size:12px;color:var(--muted);line-height:1.55}

  /* ——— 页脚 ——— */
  .footer{
    text-align:center;padding-top:8px;
    font-size:11px;color:rgba(13,17,23,.5);line-height:1.8;
  }
  .footer a{
    color:rgba(13,17,23,.62);text-decoration:none;
    border-bottom:1px solid rgba(13,17,23,.14);
    transition:color .2s,border-color .2s;
  }

  /* ——— 入场动画 ——— */
  .reveal{opacity:0;transform:translateY(16px);animation:revealUp .7s cubic-bezier(.2,.7,.3,1) forwards}
  .d1{animation-delay:.05s}.d2{animation-delay:.12s}.d3{animation-delay:.2s}
  .d4{animation-delay:.28s}.d5{animation-delay:.36s}
  @keyframes revealUp{to{opacity:1;transform:translateY(0)}}

  /* ——— 桌面端 hover 效果 ——— */
  @media (hover:hover) and (pointer:fine){
    .store-btn:hover::before{opacity:1}
    .store-btn:hover{box-shadow:0 10px 26px -10px rgba(13,17,23,.7)}
    .store-btn:hover .store-arrow{transform:translateX(3px);opacity:.9}
    .feature-card:hover{
      border-color:rgba(0,168,146,.30);
      background:#fff;
      box-shadow:0 10px 24px -14px rgba(13,17,23,.25);
    }
    .footer a:hover{color:var(--cyan);border-color:rgba(0,168,146,.4)}
  }

  /* ——— RTL 基础适配 ——— */
  [dir="rtl"] .store-text{text-align:right}
  [dir="rtl"] .store-arrow{transform:scaleX(-1)}
  [dir="rtl"] .store-btn:hover .store-arrow{transform:scaleX(-1) translateX(-3px)}
  [dir="rtl"] .brand{direction:ltr;justify-content:flex-end}
  [dir="rtl"] .section-label::after{background:linear-gradient(270deg,rgba(13,17,23,.12),transparent)}
  /* 阿拉伯文无大小写，取消 uppercase 与 letter-spacing，避免字距异常 */
  [dir="rtl"] .store-small{text-transform:none;letter-spacing:0;font-size:12px;font-weight:400}
  [dir="rtl"] .section-label{letter-spacing:0}

  /* ——— 小屏适配 ——— */
  @media (max-width:360px){
    .app-title{font-size:26px}
    .feature-grid{gap:8px}
    .feature-card{padding:14px 13px}
    .store-btn{padding:13px 16px;gap:12px}
    .store-icon{width:34px;height:34px}
    .brand{font-size:12px;letter-spacing:.05em}
    .lang-btn{font-size:12px;padding:5px 9px;gap:6px}
    .lang-btn .cur{max-width:80px}
    .store-small{font-size:9px;letter-spacing:.06em}
  }

  @media (max-width:340px){
    .feature-grid{grid-template-columns:1fr}
    .app-title{font-size:24px}
    .download-group{gap:10px}
    .brand{font-size:11px}
    .lang-btn .cur{max-width:70px}
    .store-small{font-size:9px}
  }

  /* ——— 减少动画 ——— */
  @media (prefers-reduced-motion: reduce){
    .reveal{opacity:1;transform:none;animation:none}
    .wave-rail{display:none}
    .store-btn,.feature-card,.footer a{transition:none}
  }
</style>
</head>

<script>
/* ==================== 语言列表 ==================== */
const LANGUAGES=[
  {code:'en',label:'English'},
  {code:'ar',label:'العربية'},
  {code:'de',label:'Deutsch'},
  {code:'es',label:'Español'},
  {code:'fr',label:'Français'},
  {code:'hi',label:'हिन्दी'},
  {code:'id',label:'Bahasa Indonesia'},
  {code:'it',label:'Italiano'},
  {code:'ja',label:'日本語'},
  {code:'ko',label:'한국어'},
  {code:'pt',label:'Português'},
  {code:'ru',label:'Русский'},
  {code:'th',label:'ไทย'},

];

const DEFAULT_LANG='en';
const ALIAS={
  zh:'zh-Hans','zh-hans':'zh-Hans','zh-cn':'zh-Hans','zh-sg':'zh-Hans','zh-my':'zh-Hans',
  'zh-hant':'zh-Hant','zh-tw':'zh-Hant','zh-hk':'zh-Hant','zh-mo':'zh-Hant'
};
const SUPPORTED=LANGUAGES.reduce((m,l)=>(m[l.code.toLowerCase()]=l.code,m),{});

function normalizeLang(raw){
  if(!raw)return null;
  const v=String(raw).trim().toLowerCase().replace(/_/g,'-');
  if(!v)return null;
  if(ALIAS[v])return ALIAS[v];
  if(SUPPORTED[v])return SUPPORTED[v];
  if(v.startsWith('zh-hant'))return 'zh-Hant';
  if(v.startsWith('zh'))return 'zh-Hans';
  const b=v.split('-')[0];
  return SUPPORTED[b]||null;
}

function detectLang(){
  try{
    const p=normalizeLang(new URLSearchParams(location.search).get('lang'));
    if(p)return p;
  }catch(e){}
  try{
    const list=(navigator.languages&&navigator.languages.length)?navigator.languages:[navigator.language];
    for(const n of list){
      const m=normalizeLang(n);
      if(m)return m;
    }
  }catch(e){}
  return DEFAULT_LANG;
}

/* 是否中国大陆：优先用时区（港澳台时区不同），兜底用 zh-CN 语言 */
const IS_CN=(function(){
  try{
    var tz=Intl.DateTimeFormat().resolvedOptions().timeZone||'';
    if(/^(Asia\/(Shanghai|Chongqing|Harbin|Urumqi|Kashgar)|PRC)$/.test(tz))return true;
    if(tz)return false;
  }catch(e){}
  try{
    var l=(navigator.languages&&navigator.languages.length?navigator.languages:[navigator.language]);
    return l.some(function(x){return /^zh-cn$/i.test(x);});
  }catch(e){}
  return false;
})();

/* ==================== 渲染与语言切换 ==================== */
const btn=document.getElementById('langBtn');
const menu=document.getElementById('langMenu');
const cur=document.getElementById('langCur');
const picker=document.getElementById('langPicker');

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function setSelected(code){
  const l=LANGUAGES.find(x=>x.code===code)||LANGUAGES[0];
  cur.textContent=l.label;
  menu.querySelectorAll('li').forEach(li=>li.setAttribute('aria-selected',li.dataset.code===code?'true':'false'));
}

function renderPage(code){
  const key=I18N[code]?code:DEFAULT_LANG;
  const d=I18N[key];

  document.documentElement.lang=key;
  document.documentElement.dir=d.dir;
  document.title='EditBook: Audio Editor · '+d.subtitle;

  document.getElementById('subtitle').textContent=d.subtitle;
  document.getElementById('downloadHint').textContent=d.downloadHint;
  document.getElementById('featuresLabel').textContent=d.featuresLabel;

  /* 平台引导文案多语言 */
  document.getElementById('googleSmall').textContent=d.googleSmall;
  document.getElementById('appleSmall').textContent=d.appleSmall;

  document.getElementById('featureGrid').innerHTML=d.features.map(f=>
    '<div class="feature-card">'+
      '<div class="feature-icon" aria-hidden="true">'+f.icon+'</div>'+
      '<div class="feature-title">'+esc(f.title)+'</div>'+
      '<div class="feature-desc">'+esc(f.desc)+'</div>'+
    '</div>'
  ).join('');

  document.getElementById('footerSlogan').textContent='EditBook: Audio Editor · '+d.footerSlogan;

  /* 仅 中国大陆 + 简体中文 显示 APK 下载；切换语言时自动显示/隐藏 */
  document.getElementById('apkBtn').hidden=!(IS_CN&&key==='zh-Hans');

  setSelected(key);
}

function syncUrl(code){
  const u=new URL(location.href);
  if(code===DEFAULT_LANG&&!u.searchParams.has('lang'))return;
  u.searchParams.set('lang',code);
  try{history.replaceState(null,'',u.toString());}catch(e){}
}

/* 构建语言菜单 */
LANGUAGES.forEach(l=>{
  const li=document.createElement('li');
  li.setAttribute('role','option');
  li.dataset.code=l.code;
  li.lang=l.code;
  li.textContent=l.label;
  menu.appendChild(li);
});

function openMenu(o){
  menu.classList.toggle('open',o);
  btn.setAttribute('aria-expanded',o?'true':'false');
  if(o){
    const s=menu.querySelector('[aria-selected="true"]');
    if(s)menu.scrollTop=s.offsetTop-menu.clientHeight/2+s.offsetHeight/2;
  }
}

let currentLang=detectLang();
renderPage(currentLang);
syncUrl(currentLang);

btn.addEventListener('click',e=>{
  e.stopPropagation();
  openMenu(!menu.classList.contains('open'));
});

menu.addEventListener('click',e=>{
  const li=e.target.closest('li');
  if(!li)return;
  currentLang=li.dataset.code;
  renderPage(currentLang);
  syncUrl(currentLang);
  openMenu(false);
  window.scrollTo({top:0,behavior:'smooth'});
});

document.addEventListener('click',e=>{
  if(!picker.contains(e.target))openMenu(false);
});

document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){
    openMenu(false);
    btn.focus();
  }
});

/* ==================== 声波装饰 ==================== */
(function(){
  var rail=document.getElementById('waveRail');
  var timer=null;

  function buildWave(){
    if(!rail)return;
    rail.innerHTML='';
    var count=Math.floor(window.innerWidth/10);
    for(var i=0;i<count;i++){
      var s=document.createElement('span');
      s.style.animationDelay=(i*0.11%2.8)+'s';
      s.style.height=(12+Math.random()*30)+'px';
      s.style.opacity=0.3+Math.random()*0.5;
      rail.appendChild(s);
    }
  }

  function onResize(){
    clearTimeout(timer);
    timer=setTimeout(buildWave,180);
  }

  buildWave();
  window.addEventListener('resize',onResize);
  window.addEventListener('orientationchange',onResize);
})();
</script>
