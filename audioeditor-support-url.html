<title>技术支持 - EditBook-AudioEditor</title>
<style>
:root{--primary:#007aff;--bg:#f2f2f7;--card:#fff;--text:#1c1c1e;--sub:#8e8e93;--line:#e5e5ea;--soft:#f2f2f2}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans Arabic","Noto Sans Thai","Noto Sans Devanagari","Noto Sans JP","Noto Sans KR",sans-serif;background:var(--bg);color:var(--text);line-height:1.6;padding:20px;-webkit-font-smoothing:antialiased}
.page{max-width:600px;margin:0 auto;padding-top:44px}
.lang-picker{position:absolute;top:16px;inset-inline-end:20px;z-index:50}
.lang-btn{display:flex;align-items:center;gap:8px;border:1px solid var(--primary);border-radius:999px;padding:7px 12px;background:#fff;color:var(--primary);font:inherit;font-size:14px;line-height:1.2;cursor:pointer;-webkit-tap-highlight-color:transparent}
.lang-btn svg{width:17px;height:17px;fill:var(--primary);flex:none}
.lang-btn .cur{max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lang-btn .chev{border-left:4px solid transparent;border-right:4px solid transparent;border-top:5px solid var(--primary);transition:transform .15s}
.lang-btn[aria-expanded="true"] .chev{transform:rotate(180deg)}
.lang-menu{display:none;position:absolute;top:calc(100% + 6px);inset-inline-end:0;width:220px;max-width:calc(100vw - 32px);max-height:min(60vh,420px);overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;margin:0;padding:6px;list-style:none;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.15)}
.lang-menu.open{display:block}
.lang-menu li{margin:0;padding:11px 14px;border-radius:8px;font-size:15px;line-height:1.3;cursor:pointer;color:var(--text);-webkit-tap-highlight-color:transparent}
.lang-menu li:hover{background:var(--soft)}
.lang-menu li[aria-selected="true"]{background:#eaf3ff;color:var(--primary);font-weight:600}
.header{text-align:center;padding:30px 0}
.header h1{font-size:24px;font-weight:700;margin-bottom:8px}
.header p{color:var(--sub);font-size:15px}
.card{background:var(--card);border-radius:12px;padding:24px;margin-bottom:20px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.contact-highlight{text-align:center;border:2px solid var(--primary)}
.contact-highlight h2{font-size:18px;margin-bottom:12px}
.contact-highlight .desc{margin-bottom:16px;font-size:14px;color:#666}
.contact-highlight a{display:inline-block;font-size:20px;font-weight:600;color:var(--primary);text-decoration:none;padding:10px 20px;background:rgba(0,122,255,.1);border-radius:8px;word-break:break-all}
.contact-highlight a:active{background:rgba(0,122,255,.2)}
.faq h3{font-size:18px;margin-bottom:16px;color:var(--text)}
details{border-bottom:1px solid var(--line);padding:12px 0}
details:last-child{border-bottom:none;padding-bottom:0}
summary{font-weight:500;cursor:pointer;list-style:none;position:relative;padding-right:24px;outline:none}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";position:absolute;right:0;top:50%;transform:translateY(-50%);font-size:20px;color:var(--sub)}
details[open] summary::after{content:"-"}
details p{margin-top:10px;font-size:14px;color:var(--sub)}
.footer{text-align:center;font-size:13px;color:var(--sub);margin-top:40px;padding-bottom:20px}
@media(max-width:479px){body{padding:16px}.page{padding-top:52px}.header h1{font-size:22px}.contact-highlight a{font-size:18px}}
</style>
</head>

/* ---------- language resolution: URL ?lang= > browser languages > English ---------- */
const DEFAULT_LANG='en';
const ALIAS={zh:'zh-Hans','zh-hans':'zh-Hans','zh-cn':'zh-Hans','zh-sg':'zh-Hans','zh-my':'zh-Hans','zh-hant':'zh-Hant','zh-tw':'zh-Hant','zh-hk':'zh-Hant','zh-mo':'zh-Hant'};
const SUPPORTED=LANGUAGES.reduce((m,l)=>(m[l.code.toLowerCase()]=l.code,m),{});
function normalizeLang(raw){
  if(!raw)return null;
  const v=String(raw).trim().toLowerCase().replace(/_/g,'-');
  if(!v)return null;
  if(ALIAS[v])return ALIAS[v];
  if(SUPPORTED[v])return SUPPORTED[v];
  if(v.startsWith('zh-hant'))return 'zh-Hant';
  if(v.startsWith('zh'))return 'zh-Hans';
  const b=v.split('-')[0];
  return SUPPORTED[b]||null;
}
function detectLang(){
  try{const p=normalizeLang(new URLSearchParams(location.search).get('lang'));if(p)return p;}catch(e){}
  try{
    const list=(navigator.languages&&navigator.languages.length)?navigator.languages:[navigator.language];
    for(const n of list){const m=normalizeLang(n);if(m)return m;}
  }catch(e){}
  return DEFAULT_LANG;
}

/* ---------- rendering ---------- */
const app=document.getElementById('app');
const btn=document.getElementById('langBtn'),menu=document.getElementById('langMenu'),cur=document.getElementById('langCur'),picker=document.getElementById('langPicker');
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function render(code){
  const key=I18N[code]?code:DEFAULT_LANG;
  const d=I18N[key];
  document.documentElement.lang=key;
  document.documentElement.dir=d.dir;
  document.title=d.helpTitle+' - EditBook-AudioEditor';
  app.innerHTML=
    '<div class="header"><h1>EditBook-AudioEditor</h1><p>'+esc(d.subtitle)+'</p></div>'+
    '<div class="card contact-highlight"><h2>'+esc(d.helpTitle)+'</h2><p class="desc">'+esc(d.helpDesc)+'</p><a href="mailto:'+EMAIL+'">'+EMAIL+'</a></div>'+
    '<div class="card faq"><h3>'+esc(d.faqTitle)+'</h3>'+
      d.faqs.map(f=>'<details><summary>'+esc(f[0])+'</summary><p>'+esc(f[1])+'</p></details>').join('')+
    '</div>'+
    '<div class="footer">'+esc(d.footer)+'</div>';
  setSelected(code);
}
function syncUrl(code){
  const u=new URL(location.href);
  if(code===DEFAULT_LANG&&!u.searchParams.has('lang'))return;
  u.searchParams.set('lang',code);
  try{history.replaceState(null,'',u.toString());}catch(e){}
}
function setSelected(code){
  const l=LANGUAGES.find(x=>x.code===code)||LANGUAGES[2];
  cur.textContent=l.label;
  menu.querySelectorAll('li').forEach(li=>li.setAttribute('aria-selected',li.dataset.code===code?'true':'false'));
}
function openMenu(o){
  menu.classList.toggle('open',o);
  btn.setAttribute('aria-expanded',o?'true':'false');
  if(o){const s=menu.querySelector('[aria-selected="true"]');if(s)menu.scrollTop=s.offsetTop-menu.clientHeight/2+s.offsetHeight/2;}
}
LANGUAGES.forEach(l=>{
  const li=document.createElement('li');
  li.setAttribute('role','option');li.dataset.code=l.code;li.lang=l.code;li.textContent=l.label;
  menu.appendChild(li);
});
let current=detectLang();
render(current);syncUrl(current);
btn.addEventListener('click',e=>{e.stopPropagation();openMenu(!menu.classList.contains('open'));});
menu.addEventListener('click',e=>{
  const li=e.target.closest('li');if(!li)return;
  current=li.dataset.code;render(current);syncUrl(current);openMenu(false);
  window.scrollTo({top:0,behavior:'smooth'});
});
document.addEventListener('click',e=>{if(!picker.contains(e.target))openMenu(false);});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){openMenu(false);btn.focus();}});
</script>
