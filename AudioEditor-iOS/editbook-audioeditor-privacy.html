  tr: {
    dir:'ltr', title:'Gizlilik Politikası',
    updated:'Güncelleme tarihi: 2026/11/1', effective:'Yürürlük tarihi: 2026/11/1',
    blocks:[
      ['p','EditBook-AudioEditor, Bay Xie (bundan sonra «biz» olarak anılacaktır) tarafından sağlanan bir üründür. Hizmetlerimizi kullandığınızda ilgili bilgilerinizi toplayabilir ve kullanabiliriz. Bu Gizlilik Politikası aracılığıyla, hizmetlerimizi kullandığınızda bu bilgileri nasıl topladığımızı, kullandığımızı, sakladığımızı ve paylaştığımızı ve bu bilgilere erişim, güncelleme, kontrol ve koruma sağlamayı size açıklamak istiyoruz. Bu «Gizlilik Politikası», kullandığınız EditBook-AudioEditor aracı hizmetiyle yakından ilgilidir. Lütfen dikkatlice okumanızı ve gerektiğinde bu «Gizlilik Politikası»nın yönergelerini izleyerek uygun gördüğünüz seçimleri yapmanızı umuyoruz. Bu Gizlilik Politikası’nda yer alan ilgili teknik terimleri olabildiğince kısa bir şekilde ifade etmeye ve anlamanızı kolaylaştırmak için daha fazla açıklamaya bağlantılar sağlamaya çalışıyoruz.'],
      ['p','Hizmetlerimizi kullanmanız veya kullanmaya devam etmeniz, ilgili bilgilerinizi bu Gizlilik Politikası’na uygun olarak toplamamızı, kullanmamızı, saklamamızı ve paylaşmamızı kabul ettiğiniz anlamına gelir.'],
      ['p','Bu Gizlilik Politikası veya ilgili konular hakkında herhangi bir sorunuz varsa, lütfen xieh6888@gmail.com adresinden bizimle iletişime geçin.'],

      ['h','1. Topladığımız bilgiler'],
      ['p','Biz veya üçüncü taraf ortaklarımız hizmet sağladığında, sizinle ilgili aşağıdaki bilgileri toplayabilir, saklayabilir ve kullanabiliriz. İlgili bilgileri sağlamamanız durumunda, kullanıcımız olarak kaydolamayabilir veya sunduğumuz hizmetlerin bir kısmından yararlanamayabilir ya da ilgili hizmetlerin amaçlanan etkilerini elde edemeyebilirsiniz.'],
      ['p','Kişisel bilgiler: bir hesap kaydederken veya hizmetlerimizi kullanırken bize sağladığınız ilgili kişisel bilgiler, örneğin telefon numarası, e-posta vb.'],
      ['p','Günlük bilgileri: hizmetlerimizi kullandığınızda sistemin çerezler, tanımlayıcılar ve ilgili teknolojiler aracılığıyla toplayabileceği bilgiler olup cihaz bilgileriniz, tarama bilgileriniz ve tıklama bilgileriniz dahildir; bu bilgiler size kişiselleştirilmiş bir kullanıcı deneyimi sunmak ve hizmet güvenliğini sağlamak için günlük bilgisi olarak saklanır. Tarayıcı ayarlarınız aracılığıyla çerezlerin, tanımlayıcıların veya ilgili teknolojilerin kullanımını reddedebilir veya yönetebilirsiniz.'],
      ['p','Eriştiğimiz üçüncü taraf SDK’ları:'],
      ['ul',['Umeng istatistikleri','Bugly']],

      ['h','2. Bilgilerin saklanması'],
      ['h3','2.1 Bilgilerin saklanma şekli ve süresi'],
      ['p','Bilgilerinizi yerel depolama (örneğin veri önbelleğe alma için APP kullanımı), veritabanları ve sunucu günlükleri dahil olmak üzere güvenli bir şekilde saklarız.'],
      ['p','Genellikle kişisel bilgilerinizi yalnızca hizmetin amacına ulaşmak için gerekli olan süre boyunca veya kanunlar ve yönetmeliklerde öngörülen koşullar altında saklarız.'],
      ['h3','2.2 Bilgilerin saklandığı bölge'],
      ['p','Çin içinde toplanan kullanıcı kişisel bilgilerini kanunlar ve yönetmelikler uyarınca Çin içinde saklarız.'],
      ['p','Şu anda kişisel bilgilerinizi sınır ötesine aktarmıyor veya saklamıyoruz. Gelecekte sınır ötesi iletim veya saklama gerekirse, bilgi aktarımının amacı, alıcılar, güvenlik güvence önlemleri ve güvenlik riskleri hakkında sizi bilgilendireceğiz ve onayınızı alacağız.'],
      ['h3','2.3 Ürün veya hizmetlerin faaliyetlerinin durdurulması durumunda bildirim'],
      ['p','Ürünlerimiz veya hizmetlerimiz faaliyetlerini durdurduğunda, sizi push bildirimleri, duyurular vb. yoluyla bilgilendireceğiz ve kanunlar ve yönetmeliklerde aksi belirtilmedikçe kişisel bilgilerinizi makul bir süre içinde sileceğiz veya anonim hale getireceğiz.'],

      ['h','3. Bilgi güvenliği'],
      ['p','Bilgileri kayıp, uygunsuz kullanım, yetkisiz erişim veya ifşaya karşı korumak için çeşitli güvenlik teknolojileri ve prosedürleri kullanıyoruz. Örneğin, bazı hizmetlerde sağladığınız kişisel bilgileri korumak için şifreleme teknolojileri (SSL gibi) kullanırız. Ancak, teknik sınırlamalar ve çeşitli olası kötü niyetli yöntemler nedeniyle, internet sektöründe güvenlik önlemlerini güçlendirmek için elimizden gelenin en iyisini yapsak bile, bilgi güvenliğini her zaman %100 garanti etmenin imkânsız olduğunu lütfen anlayın. Hizmetlerimize erişmek için kullandığınız sistemlerin ve iletişim ağlarının, kontrolümüz dışındaki faktörler nedeniyle sorun yaşayabileceğini anlamanız gerekir.'],

      ['h','4. Bilgileri nasıl kullanıyoruz'],
      ['p','Size hizmet sunma sürecinde toplanan bilgileri aşağıdaki amaçlarla kullanabiliriz:'],
      ['ul',[
        'Size hizmet sağlamak;',
        'Hizmet sunarken, size sağladığımız ürün ve hizmetlerin güvenliğini sağlamak amacıyla kimlik doğrulama, müşteri hizmetleri, güvenlik, dolandırıcılık izleme, arşivleme ve yedekleme amacıyla;',
        'Yeni hizmetler tasarlamamıza ve mevcut hizmetlerimizi iyileştirmemize yardımcı olmak;',
        'Dil ayarları, konum ayarları, kişiselleştirilmiş yardım hizmetleri ve talimatlar gibi kişiselleştirilmiş ihtiyaçlarınıza yanıt vermek veya size ve diğer kullanıcılara diğer önerilerde bulunmak amacıyla hizmetlerimize nasıl eriştiğinizi ve bunları nasıl kullandığınızı daha iyi anlamamızı sağlamak;',
        'Genel olarak yayınlanan reklamlar yerine size daha alakalı reklamlar sunmak;',
        'Hizmetlerimizdeki reklamların ve diğer promosyonların etkinliğini değerlendirmek ve bunları iyileştirmek;',
        'Yazılım sertifikasyonu veya yazılım yükseltmelerinin yönetimi;',
        'Ürünlerimiz ve hizmetlerimizle ilgili anketlere katılmanızı sağlamak.'
      ]],

      ['h','5. Bilgi paylaşımı'],
      ['p','Şu anda kişisel bilgilerinizi üçüncü taraflarla aktif olarak paylaşmayacak veya aktarmayacağız. Kişisel bilgilerinizin paylaşılması veya aktarılmasıyla ilgili başka durumlar varsa veya kişisel bilgilerinizi bir üçüncü tarafla paylaşmamız veya aktarmamız gerekiyorsa, yukarıdaki eylemler için doğrudan açık onayınızı alacağız veya üçüncü tarafın bunu aldığını teyit edeceğiz.'],
      ['p','Reklam yayınlamak, reklam yayınlama etkinliğini değerlendirmek ve optimize etmek için verilerinizin bir kısmını reklamverenler ve acenteleri gibi üçüncü taraf ortaklarla paylaşmamız gerekir ve kişisel kimliklerin tanımlanmasını önlemek ve gizlilik güvenliğini sağlamak için veri koruma anlaşmaları, taahhüt mektupları ve ilgili veri işleme politikaları dahil ancak bunlarla sınırlı olmamak üzere veri gizliliği koruma önlemlerimize ve gereksinimlerimize kesinlikle uymalarını talep ederiz.'],
      ['p','Açıkça yetki vermediğiniz sürece, sizi kişisel olarak tanımlayan bilgileri (adınız veya e-posta adresiniz gibi) ortaklarımızla paylaşmayız.'],
      ['p','Topladığımız kişisel bilgileri kamuya açıklamayacağız. Kamuya açıklama gerekliyse, kamuya açıklamanın amacını, açıklanan bilgilerin türünü ve ilgili olabilecek hassas bilgileri size bildireceğiz ve açık onayınızı alacağız.'],
      ['p','İşimiz gelişmeye devam ettikçe birleşmeler, devralmalar, varlık transferleri ve diğer işlemleri gerçekleştirebiliriz. İlgili durumlar hakkında sizi bilgilendireceğiz ve kanunlar ve yönetmelikler ile bu Gizlilik Politikası’nın gerektirdiğinden daha düşük olmayan standartlara uygun olarak kişisel bilgilerinizi korumaya devam edeceğiz veya yeni denetleyicinin korumaya devam etmesini talep edeceğiz.'],
      ['p','Ayrıca, ilgili kanunlar, yönetmelikler ve ulusal standartlar uyarınca, aşağıdaki durumlarda önceden izin ve onayınızı almadan kişisel bilgileri paylaşabilir, aktarabilir ve kamuya açıklayabiliriz:'],
      ['ul',[
        'Ulusal güvenlik ve ulusal savunma güvenliğiyle doğrudan ilgili olanlar;',
        'Kamu güvenliği, kamu sağlığı ve önemli kamu yararlarıyla doğrudan ilgili olanlar;',
        'Ceza soruşturması, kovuşturma, yargılama ve karar infazıyla doğrudan ilgili olanlar;',
        'Kişisel bilgi sahibinin veya diğer kişilerin yaşamı, malı ve diğer önemli meşru hak ve menfaatlerini korumak için olup kişinin onayını almanın zor olduğu durumlar;',
        'Kişisel bilgi sahibinin kişisel bilgilerini kendi inisiyatifiyle kamuya açıklaması;',
        'Yasal haber raporları, hükümet bilgi açıklaması ve diğer kanallar gibi yasal olarak kamuya açıklanmış bilgilerden kişisel bilgi toplanması.'

/* ==========================================================================
   3. 语言解析
   规则：URL 参数 > 浏览器语言列表 > 英文兜底
   ========================================================================== */
const DEFAULT_LANG = 'en';

// 全部用小写做 key，统一映射到 I18N 里的 key
const LANG_ALIAS = {
  'zh':      'zh-Hans',
  'zh-hans': 'zh-Hans',
  'zh-cn':   'zh-Hans',
  'zh-sg':   'zh-Hans',
  'zh-my':   'zh-Hans',
  'zh-hant': 'zh-Hant',
  'zh-tw':   'zh-Hant',
  'zh-hk':   'zh-Hant',
  'zh-mo':   'zh-Hant'
};

// 小写 -> I18N 真实 key（如 'zh-hans' -> 'zh-Hans'）
const I18N_KEY_BY_LOWER = Object.keys(I18N).reduce((map, k) => {
  map[k.toLowerCase()] = k;
  return map;
}, {});

/** 返回受支持的语言 key；不支持则返回 null */
function normalizeLang(raw){
  if(!raw) return null;
  const v = String(raw).trim().toLowerCase().replace(/_/g, '-');
  if(!v) return null;

  // 1. 别名（含 zh-CN / zh-TW / zh-HK 等）
  if(LANG_ALIAS[v]) return LANG_ALIAS[v];

  // 2. 完全匹配
  if(I18N_KEY_BY_LOWER[v]) return I18N_KEY_BY_LOWER[v];

  // 3. 带脚本/地区的中文，如 zh-Hans-CN、zh-Hant-TW
  if(v.startsWith('zh-hant')) return 'zh-Hant';
  if(v.startsWith('zh')) return 'zh-Hans';

  // 4. 取主语言，如 fr-CA -> fr、pt-BR -> pt
  const base = v.split('-')[0];
  if(I18N_KEY_BY_LOWER[base]) return I18N_KEY_BY_LOWER[base];

  return null;
}

function detectLang(){
  // 1. URL 参数 ?lang=xx（App 跳转时使用）
  try {
    const param = new URLSearchParams(location.search).get('lang');
    const fromParam = normalizeLang(param);
    if(fromParam) return fromParam;
  } catch(e) {}

  // 2. 浏览器语言列表，按优先级逐个尝试
  try {
    const list = (navigator.languages && navigator.languages.length)
      ? navigator.languages
      : [navigator.language || navigator.userLanguage];
    for(const n of list){
      const m = normalizeLang(n);
      if(m) return m;
    }
  } catch(e) {}

  // 3. 没有匹配或检测不到，默认英文
  return DEFAULT_LANG;
}

/* ==========================================================================
   4. 渲染
   ========================================================================== */
const elTitle     = document.getElementById('pageTitle');
const elUpdated   = document.getElementById('updated');
const elEffective = document.getElementById('effective');
const elContent   = document.getElementById('content');
const elSelect    = document.getElementById('langSelect');

function buildSelect(){
  const frag = document.createDocumentFragment();
  LANGUAGES.forEach(l => {
    const opt = document.createElement('option');
    opt.value = l.code;
    opt.textContent = l.label;
    frag.appendChild(opt);
  });
  elSelect.appendChild(frag);
}

function render(code){
  const data = I18N[code] || I18N[DEFAULT_LANG];

  document.documentElement.lang = code;
  document.documentElement.dir  = data.dir;
  document.title = data.title + ' · EditBook-AudioEditor';

  elTitle.textContent     = data.title;
  elUpdated.textContent   = data.updated;
  elEffective.textContent = data.effective;

  const frag = document.createDocumentFragment();
  data.blocks.forEach(block => {
    const type = block[0];

    if(type === 'ul'){
      const ul = document.createElement('ul');
      block[1].forEach(item => {
        const li = document.createElement('li');
        li.textContent = item;
        ul.appendChild(li);
      });
      frag.appendChild(ul);
      return;
    }

    const tag = type === 'h3' ? 'h3' : (type === 'h' ? 'h2' : 'p');
    const node = document.createElement(tag);
    node.textContent = block[1];

    // 邮箱自动转链接
    if(tag === 'p' && block[1].includes('xieh6888@gmail.com')){
      node.textContent = '';
      const parts = block[1].split('xieh6888@gmail.com');
      parts.forEach((part, i) => {
        node.appendChild(document.createTextNode(part));
        if(i < parts.length - 1){
          const a = document.createElement('a');
          a.href = 'mailto:xieh6888@gmail.com';
          a.textContent = 'xieh6888@gmail.com';
          node.appendChild(a);
        }
      });
    }

    frag.appendChild(node);
  });

  elContent.replaceChildren(frag);
  elSelect.value = code;
}

function syncUrl(code){
  const url = new URL(location.href);
  if(code === DEFAULT_LANG && !url.searchParams.has('lang')){
    return;
  }
  url.searchParams.set('lang', code);
  history.replaceState(null, '', url.toString());
}

/* ==========================================================================
   5. 启动
   ========================================================================== */
buildSelect();

let current = detectLang();
render(current);
syncUrl(current);

elSelect.addEventListener('change', e => {
  current = e.target.value;
  render(current);
  syncUrl(current);
  window.scrollTo({ top: 0, behavior: 'smooth' });
});
</script>
